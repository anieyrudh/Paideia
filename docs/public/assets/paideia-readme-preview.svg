<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 430">
  <title id="title">Paideia contribution library preview</title>
  <desc id="desc">A preview of Paideia showing contribution packages, automated checks, and published lessons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#11363b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>

  <g transform="translate(58 54)">
    <text x="0" y="0" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="750">Paideia</text>
    <text x="0" y="38" fill="#a7f3d0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">academic simulations and lesson materials, reviewed in public</text>
  </g>

  <g transform="translate(58 116)" filter="url(#shadow)">
    <rect width="325" height="264" rx="18" fill="#f8fafc"/>
    <text x="24" y="42" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Submit a package</text>
    <rect x="24" y="70" width="277" height="42" rx="10" fill="#e0f2fe"/>
    <text x="42" y="97" fill="#075985" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">manifest.yaml</text>
    <rect x="24" y="124" width="277" height="42" rx="10" fill="#dcfce7"/>
    <text x="42" y="151" fill="#166534" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">lesson.md + sources.md</text>
    <rect x="24" y="178" width="277" height="42" rx="10" fill="#fef3c7"/>
    <text x="42" y="205" fill="#92400e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">simulation.html</text>
    <text x="24" y="246" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Start in contributions/_incoming</text>
  </g>

  <g transform="translate(440 116)" filter="url(#shadow)">
    <rect width="325" height="264" rx="18" fill="#f8fafc"/>
    <text x="24" y="42" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Automated intake</text>
    <circle cx="48" cy="88" r="13" fill="#22c55e"/>
    <path d="M41 88l6 6 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="94" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">bucket and manifest</text>
    <circle cx="48" cy="132" r="13" fill="#22c55e"/>
    <path d="M41 132l6 6 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="138" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">sources and license notes</text>
    <circle cx="48" cy="176" r="13" fill="#22c55e"/>
    <path d="M41 176l6 6 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="182" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">visual interaction surface</text>
    <rect x="24" y="212" width="277" height="32" rx="16" fill="url(#accent)"/>
    <text x="64" y="234" fill="#052e16" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">human review after checks</text>
  </g>

  <g transform="translate(822 116)" filter="url(#shadow)">
    <rect width="325" height="264" rx="18" fill="#f8fafc"/>
    <text x="24" y="42" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Published library</text>
    <rect x="28" y="72" width="270" height="138" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
    <polyline points="50,176 88,148 124,158 164,110 204,126 250,88" fill="none" stroke="#0891b2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="88" cy="148" r="8" fill="#14b8a6"/>
    <circle cx="164" cy="110" r="8" fill="#14b8a6"/>
    <circle cx="250" cy="88" r="8" fill="#14b8a6"/>
    <rect x="28" y="226" width="86" height="18" rx="9" fill="#dbeafe"/>
    <rect x="126" y="226" width="78" height="18" rx="9" fill="#dcfce7"/>
    <rect x="216" y="226" width="82" height="18" rx="9" fill="#fef3c7"/>
    <text x="24" y="260" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Lessons become reusable pages.</text>
  </g>

  <path d="M394 248h38" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M424 238l14 10-14 10" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M776 248h38" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <path d="M806 238l14 10-14 10" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
