entries:
  - id: shared.probability.bayes-updating
    title: "Bayes Theorem Visualiser"
    priority: P0
    status: planned
    cluster: Bayesian reasoning
    discipline: math
    reuse_status: shared-core
    curricula:
      - shared
      - sutd
      - alevel
      - ib
    curriculum_mappings:
      - curriculum: sutd
        modules:
          - Freshmore probability and statistics
          - ESD stochastic modelling
      - curriculum: alevel
        subjects:
          - Mathematics
          - Computing
      - curriculum: ib
        courses:
          - Mathematics AI
          - Psychology research methods
    simulation_type: probability-tree-updater
    problem_solving_elements:
      - prior-likelihood-posterior table
      - base-rate check
      - evidence update trace
    concept_map_needs:
      prerequisites:
        - conditional probability
        - tree diagrams
      downstream:
        - Bayesian inference
        - machine learning classifiers
      misconceptions:
        - base-rate neglect
        - confusing P(A|B) with P(B|A)
    kernel_dependencies:
      - core/probability-stats
      - core/charting
      - core/prediction-gate
      - core/ui-sim
    repo_package_name: sim-bayes
    estimated_effort: M
    assignment:
      workstream: shared-probability-stats
      concept_cluster: Bayesian reasoning
      target_container_kind: shared-core

