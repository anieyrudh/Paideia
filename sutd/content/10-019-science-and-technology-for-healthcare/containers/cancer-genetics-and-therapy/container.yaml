misconceptions:
  - name: "More drivers always means lower survival immediately"
    description: "Learners may treat driver mutations as instantaneously fatal; in reality they accelerate clonal growth, which compounds the population at risk."
    evidence_source: "Vogelstein et al., Cancer Genome Landscapes (Science 2013) — referenced."
    surface_in_predict: true
  - name: "Higher dose always works"
    description: "Learners may assume any therapy works at high enough dose; in reality the therapeutic-index ratio bounds the safe maximum and resistance can lift effective IC50 beyond it."
    evidence_source: "Goodman & Gilman's Pharmacological Basis of Therapeutics (referenced)."
    surface_in_predict: true
