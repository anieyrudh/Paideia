transfer_problems:
  - id: resistance-shifts-ic50
    prompt: |
      A clone with driver count 3 (per-driver advantage 0.1) starts with size 10 and grows over 20 generations. At the same time, a Hill-shaped therapy with IC50 = 10 and n = 2 acts on each clone. Walk through how a 4x resistance factor changes the effective IC50 and the dose required for 90 percent response.
    surface_form: "resistance-shifted dose-response"
    same_concept_check: "Same concept: driver-driven growth is multiplicative per generation; resistance multiplies the effective IC50; the dose for a target response scales with effective IC50."
    rubric_path: problem-solving/resistance-shifts-ic50.md
