controls:
  - id: preset-selection
    label: "Sequence preset"
    kind: selector
    default: poly-leu
  - id: window-size
    label: "Window size W"
    kind: slider
    default: 9
    min: 3
    max: 11
    step: 2
  - id: hydrophobic-threshold
    label: "Hydrophobic threshold"
    kind: slider
    default: 1.6
    min: 0.5
    max: 3
    step: 0.1
