level: "Freshmore"
module: "Science and Technology for Healthcare"
title: "Cell Signalling Pathways"
one_line_summary: "Trace a ligand signal through a four-stage cascade and watch how saturating activations and inhibitor edges shape the transcription-factor output."
syllabus_ref: "SUTD 10.019 Science and Technology for Healthcare / Cell signalling pathways"
prerequisites:
  - cell-structure-and-the-membrane
  - hill-activation-function
