transfer_problems:
  - id: inhibitor-knockdown
    prompt: |
      In a ligand -> receptor -> kinase -> transcription-factor cascade, an inhibitor edge from a parallel phosphatase reduces the kinase output. Walk through how raising the phosphatase signal from 0 to 1 shifts the transcription-factor response, and why the cascade can switch off even with the ligand at full strength.
    surface_form: "kinase / phosphatase balance"
    same_concept_check: "Same concept: each downstream node sees the activator minus inhibitor sum through a saturating response; raising the inhibitor lowers the effective input and the output drops."
    rubric_path: problem-solving/inhibitor-knockdown.md
