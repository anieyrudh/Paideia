misconceptions:
  - name: "Cascade responses are linear"
    description: "Learners may assume each stage scales linearly with input; the saturating activations make the steady-state response sigmoidal."
    evidence_source: "Alon, An Introduction to Systems Biology."
    surface_in_predict: true
  - name: "Inhibitors only reduce by addition"
    description: "Learners may treat an inhibitor as a simple subtraction; in reality it lowers the effective input to a saturating response, which can flip the downstream verdict abruptly."
    evidence_source: "Hille, Ionic Channels of Excitable Membranes (analogous switching behaviour)."
    surface_in_predict: true
