<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Signalling cascade thumbnail</title>
  <desc id="desc">Four-node cascade with activator arrows from ligand to receptor to kinase to transcription factor, and a phosphatase inhibitor edge to the kinase.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <text x="20" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-size="19" font-weight="700">Signalling cascade</text>
  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="50" cy="120" r="18" fill="#2563eb"/><text x="50" y="124" fill="#fff">Lig</text>
    <circle cx="120" cy="120" r="18" fill="#059669"/><text x="120" y="124" fill="#fff">Rec</text>
    <circle cx="190" cy="120" r="18" fill="#f59e0b"/><text x="190" y="124" fill="#fff">Kin</text>
    <circle cx="260" cy="120" r="18" fill="#7c3aed"/><text x="260" y="124" fill="#fff">TF</text>
    <circle cx="190" cy="70" r="14" fill="#dc2626"/><text x="190" y="74" fill="#fff">Pho</text>
  </g>
  <g stroke-width="2" fill="none">
    <line x1="68" y1="120" x2="102" y2="120" stroke="#2563eb"/>
    <line x1="138" y1="120" x2="172" y2="120" stroke="#2563eb"/>
    <line x1="208" y1="120" x2="242" y2="120" stroke="#2563eb"/>
    <line x1="190" y1="84" x2="190" y2="100" stroke="#dc2626" stroke-dasharray="4 4"/>
  </g>
  <text x="20" y="160" fill="#475569" font-family="Arial, sans-serif" font-size="11">Activator: solid blue. Inhibitor: dashed red.</text>
</svg>
