<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Membrane transport fallback visual</title>
  <desc id="desc">A wider diagram showing the bilayer membrane with channels for K+, Na+, and Cl- sized by relative permeability, with concentration gradient arrows and a labelled resting voltage readout.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="48" y="50" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Cell structure and the membrane</text>
  <text x="48" y="78" fill="#475569" font-family="Arial, sans-serif" font-size="16">Permeability picks which Nernst potential the resting voltage sits near.</text>
  <rect x="80" y="140" width="480" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="320" y="130" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">outside (low [K+])</text>
  <text x="320" y="222" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">inside (high [K+])</text>
  <circle cx="170" cy="170" r="20" fill="#2563eb"/>
  <text x="170" y="176" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">K+</text>
  <circle cx="320" cy="170" r="6" fill="#94a3b8"/>
  <text x="320" y="156" fill="#475569" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Na+</text>
  <circle cx="470" cy="170" r="14" fill="#059669"/>
  <text x="470" y="176" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Cl-</text>
  <path d="M170 240 L170 270" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="180" y="265" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="13">K+ moves down its gradient until E_K is reached</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="420" y="240" width="200" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="436" y="266" fill="#0f172a" font-weight="700">Resting voltage</text>
    <text x="436" y="290" fill="#334155">approx -70 mV (K-dominant)</text>
    <text x="436" y="310" fill="#334155">approaches E_Na as P_Na rises</text>
  </g>
</svg>
