<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Membrane transport thumbnail</title>
  <desc id="desc">A bilayer membrane with three labelled channels for K+, Na+, and Cl-, sized by their relative permeability.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <rect x="40" y="70" width="240" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="158" y="60" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">outside</text>
  <text x="158" y="135" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">inside</text>
  <circle cx="90" cy="90" r="14" fill="#2563eb"/>
  <text x="90" y="95" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">K+</text>
  <circle cx="160" cy="90" r="6" fill="#94a3b8"/>
  <text x="160" y="76" fill="#475569" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Na+</text>
  <circle cx="230" cy="90" r="10" fill="#059669"/>
  <text x="230" y="95" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Cl-</text>
  <text x="24" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-size="19" font-weight="700">Cell membrane</text>
  <text x="24" y="54" fill="#475569" font-family="Arial, sans-serif" font-size="13">selective permeability sets the resting voltage</text>
</svg>
