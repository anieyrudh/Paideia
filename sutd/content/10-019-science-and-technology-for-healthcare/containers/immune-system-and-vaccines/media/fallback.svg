<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Herd immunity fallback visual</title>
  <desc id="desc">Coverage bar vs threshold line, plus Re curve as coverage sweeps from 0 to 1.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="40" y="44" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Immune system and vaccines</text>
  <text x="40" y="70" fill="#475569" font-family="Arial, sans-serif" font-size="15">Re = R0 (1 - p); herd-immunity threshold p* = 1 - 1/R0.</text>
  <rect x="60" y="120" width="520" height="34" fill="#e2e8f0"/>
  <rect x="60" y="120" width="312" height="34" fill="#2563eb"/>
  <line x1="450" x2="450" y1="112" y2="160" stroke="#dc2626" stroke-width="4"/>
  <text x="60" y="112" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="13" font-weight="700">coverage 60%</text>
  <text x="396" y="112" fill="#dc2626" font-family="Arial, sans-serif" font-size="13" font-weight="700">p* = 75%</text>
  <rect x="60" y="200" width="520" height="120" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="80" x2="80" y1="220" y2="300" stroke="#94a3b8"/>
  <line x1="80" x2="560" y1="300" y2="300" stroke="#94a3b8"/>
  <polyline points="80,220 110,234 140,248 170,262 200,276 230,288 260,300 290,300" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="320" y="216" fill="#0f172a" font-family="Arial, sans-serif" font-size="13" font-weight="700">Re falls linearly with coverage</text>
  <text x="80" y="320" fill="#475569" font-family="Arial, sans-serif" font-size="11">coverage 0 to 1</text>
</svg>
