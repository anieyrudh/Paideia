controls:
  - id: r-zero
    label: "Basic reproduction number R0"
    kind: slider
    default: 4
    min: 1.1
    max: 18
    step: 0.1
  - id: vaccination-coverage
    label: "Vaccination coverage"
    kind: slider
    default: 0.6
    min: 0
    max: 1
    step: 0.01
  - id: waning-rate
    label: "Waning rate (per day)"
    kind: slider
    default: 0.005
    min: 0
    max: 0.05
    step: 0.001
  - id: days-since-vaccination
    label: "Days since vaccination"
    kind: slider
    default: 0
    min: 0
    max: 400
    step: 5
