module: "Science and Technology for Healthcare"
title: "Immune System and Vaccines"
one_line_summary: "Compare an antigen-antibody match score with the herd-immunity threshold to see how vaccination fraction, R0, and waning together set the effective reproduction number."
syllabus_ref: "SUTD 10.019 Science and Technology for Healthcare / Immune system and vaccines"
prerequisites:
  - hill-activation-function
  - probability-fractions
aid_types:
