transfer_problems:
  - id: waning-immunity-revaccination
    prompt: |
      A booster vaccine restores immunity to 0.95 right after dosing. Immunity wanes exponentially with rate 0.005 per day. After 200 days, walk through how the effective reproduction number Re evolves for a population with R0 = 5 and 90 percent vaccination coverage at day 0.
    surface_form: "waning immunity and revaccination cadence"
    same_concept_check: "Same concept: immunity exponentially decays; the effective vaccinated fraction shrinks, lifting Re."
    rubric_path: problem-solving/waning-immunity-revaccination.md
