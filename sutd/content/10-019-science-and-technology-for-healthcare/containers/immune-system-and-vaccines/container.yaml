misconceptions:
  - name: "Any vaccination coverage stops an outbreak"
    description: "Learners may think partial vaccination is enough; without crossing the herd-immunity threshold the outbreak still spreads."
    evidence_source: "OpenStax Biology, Adaptive Immunity chapter."
    surface_in_predict: true
  - name: "Antigen-antibody specificity is binary"
    description: "Learners may treat antibody recognition as on/off; in reality match score is graded and partial matches still bind weakly."
    evidence_source: "Janeway's Immunobiology (referenced)."
    surface_in_predict: true
