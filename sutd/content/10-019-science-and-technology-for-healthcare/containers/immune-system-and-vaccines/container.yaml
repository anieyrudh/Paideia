predict_at: package-level
package_predict:
  prompt: |
    A pathogen has basic reproduction number R0 = 4. Vaccinating 60 percent of the population gives them perfect immunity. Before using the checkpoint, what is the effective reproduction number Re and does the outbreak grow or shrink?
  commit_format:
    kind: multiple-choice
    options:
      - "Re = 1.6, outbreak still grows because Re > 1 and the herd-immunity threshold is 75 percent."
      - "Re = 4, vaccination does nothing for the rest of the population."
      - "Re = 0, outbreak halts immediately because some fraction is vaccinated."
      - "Re = 0.4, outbreak shrinks because vaccination always halves R0."
    correct_index: 0
  rationale_required: true
