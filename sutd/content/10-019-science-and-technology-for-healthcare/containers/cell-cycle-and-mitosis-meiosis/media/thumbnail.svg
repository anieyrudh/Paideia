<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Cell cycle wheel thumbnail</title>
  <desc id="desc">Circular phase wheel with G1, S, G2, M segments and a highlighted current phase.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <text x="20" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-size="19" font-weight="700">Cell cycle wheel</text>
  <g transform="translate(160, 105)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#cbd5e1" stroke-width="6"/>
    <path d="M 0 -50 A 50 50 0 0 1 50 0" fill="none" stroke="#2563eb" stroke-width="6"/>
    <path d="M 50 0 A 50 50 0 0 1 0 50" fill="none" stroke="#059669" stroke-width="6"/>
    <path d="M 0 50 A 50 50 0 0 1 -50 0" fill="none" stroke="#f59e0b" stroke-width="6"/>
    <path d="M -50 0 A 50 50 0 0 1 0 -50" fill="none" stroke="#7c3aed" stroke-width="6"/>
    <text x="25" y="-28" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="13" font-weight="700">G1</text>
    <text x="25" y="36" fill="#065f46" font-family="Arial, sans-serif" font-size="13" font-weight="700">S</text>
    <text x="-32" y="36" fill="#b45309" font-family="Arial, sans-serif" font-size="13" font-weight="700">G2</text>
    <text x="-32" y="-28" fill="#5b21b6" font-family="Arial, sans-serif" font-size="13" font-weight="700">M</text>
  </g>
  <text x="20" y="158" fill="#475569" font-family="Arial, sans-serif" font-size="11">Checkpoints gate each transition.</text>
</svg>
