title: "Cell Cycle and Mitosis / Meiosis"
one_line_summary: "Walk a cell through G1, S, G2, M phases under checkpoint conditions, then run mitosis or meiosis and compare daughter ploidy and DNA content."
syllabus_ref: "SUTD 10.019 Science and Technology for Healthcare / Cell cycle and mitosis/meiosis"
