predict_at: package-level
package_predict:
  prompt: |
    A diploid cell at M phase with replicated DNA divides via mitosis. Before using the checkpoint, what are the two daughter cells' ploidy and DNA-content multiplier?
  commit_format:
    kind: multiple-choice
    options:
      - "Two diploid (n = 2) G1 daughters, each with DNA content 1 (unreplicated)."
      - "Two haploid (n = 1) gametes, each with DNA content 1."
      - "Four haploid gametes, each with DNA content 1."
      - "Two diploid daughters, each with DNA content 2 (still replicated)."
    correct_index: 0
  rationale_required: true
