misconceptions:
  - name: "Mitosis halves chromosome number"
    description: "Learners may confuse mitosis (preserves ploidy) with meiosis (halves ploidy)."
    evidence_source: "OpenStax Biology, Cell Reproduction chapter."
    surface_in_predict: true
  - name: "Checkpoints are time-based"
    description: "Learners may believe phase transitions happen on a clock, not in response to molecular conditions."
    evidence_source: "Alberts et al., Molecular Biology of the Cell (referenced)."
    surface_in_predict: true
