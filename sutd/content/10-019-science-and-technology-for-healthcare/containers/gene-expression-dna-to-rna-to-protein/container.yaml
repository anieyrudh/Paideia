level: "Freshmore"
module: "Science and Technology for Healthcare"
title: "Gene Expression: DNA to RNA to Protein"
one_line_summary: "Trace a short DNA segment through transcription and translation, then watch how a regulator's concentration changes steady-state mRNA and protein levels."
syllabus_ref: "SUTD 10.019 Science and Technology for Healthcare / Gene expression"
prerequisites:
  - sequence-and-codon-table
  - hill-activation-function
aid_types:
  - simulation
  - transfer-problem
  - misconception-audit
predict_at: package-level
package_predict:
  prompt: |
    A gene's promoter is activated by an inducer. As inducer concentration rises from zero to far above the half-max, what happens to the steady-state mRNA and protein levels at fixed translation and degradation rates?
  commit_format:
    kind: multiple-choice
    options:
      - "Both rise toward a saturating plateau set by the maximum transcription rate and the per-molecule decay constants."
      - "Both rise linearly without limit."
      - "mRNA rises but protein stays at baseline."
      - "Protein rises immediately while mRNA stays at baseline."
    correct_index: 0
  rationale_required: true
