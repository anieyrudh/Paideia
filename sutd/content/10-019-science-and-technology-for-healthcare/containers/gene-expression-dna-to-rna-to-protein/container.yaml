misconceptions:
  - name: "Inducer increases protein without delay"
    description: "Learners may treat protein production as instantaneous, ignoring the mRNA intermediate and its finite decay time."
    evidence_source: "Alon, An Introduction to Systems Biology; SUTD 10.019 freshmore module."
    surface_in_predict: true
  - name: "Hill responses are linear"
    description: "Learners may approximate the Hill activation as proportional to inducer concentration, missing the saturating plateau."
    evidence_source: "Hill, J. Physiol. 1910 (origin of the Hill equation)."
    surface_in_predict: true
