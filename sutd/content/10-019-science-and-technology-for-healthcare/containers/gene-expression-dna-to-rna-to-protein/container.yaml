transfer_problems:
  - id: lac-operon-style-induction
    prompt: |
      A lac-operon-style promoter has a basal transcription rate of 0.01 per second, a maximum of 1 per second, mRNA decay 0.1 per second, translation rate 2 per mRNA per second, and protein decay 0.05 per second. Walk through how an inducer at threshold gives mRNA steady state ~5 micromolar and protein steady state ~200 micromolar.
    surface_form: "lac-operon-style steady-state calculation"
    same_concept_check: "Same concept: regulator concentration enters the Hill term, which scales transcription; steady states follow from setting dM/dt and dP/dt to zero."
    rubric_path: problem-solving/lac-operon-style-induction.md
