<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Central dogma + Hill activation fallback visual</title>
  <desc id="desc">DNA, mRNA, and protein chains with a Hill activation curve to the right.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="40" y="44" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Gene expression: DNA to RNA to protein</text>
  <text x="40" y="70" fill="#475569" font-family="Arial, sans-serif" font-size="15">Hill activation gates transcription; steady states follow from supply minus decay.</text>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="40" y="120" fill="#0f172a" text-anchor="start">DNA</text>
    <rect x="100" y="105" width="44" height="22" fill="#1e3a8a"/><text x="122" y="121" fill="#fff">ATG</text>
    <rect x="150" y="105" width="44" height="22" fill="#1e3a8a"/><text x="172" y="121" fill="#fff">GAA</text>
    <rect x="200" y="105" width="44" height="22" fill="#1e3a8a"/><text x="222" y="121" fill="#fff">CTG</text>
    <rect x="250" y="105" width="44" height="22" fill="#1e3a8a"/><text x="272" y="121" fill="#fff">TTC</text>
    <rect x="300" y="105" width="44" height="22" fill="#1e3a8a"/><text x="322" y="121" fill="#fff">TAA</text>
    <text x="40" y="170" fill="#0f172a" text-anchor="start">mRNA</text>
    <rect x="100" y="155" width="44" height="22" fill="#2563eb"/><text x="122" y="171" fill="#fff">AUG</text>
    <rect x="150" y="155" width="44" height="22" fill="#2563eb"/><text x="172" y="171" fill="#fff">GAA</text>
    <rect x="200" y="155" width="44" height="22" fill="#2563eb"/><text x="222" y="171" fill="#fff">CUG</text>
    <rect x="250" y="155" width="44" height="22" fill="#2563eb"/><text x="272" y="171" fill="#fff">UUC</text>
    <rect x="300" y="155" width="44" height="22" fill="#2563eb"/><text x="322" y="171" fill="#fff">UAA</text>
    <text x="40" y="220" fill="#0f172a" text-anchor="start">protein</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="122" cy="215" r="13" fill="#f59e0b"/><text x="122" y="220" fill="#fff">M</text>
    <circle cx="172" cy="215" r="13" fill="#dc2626"/><text x="172" y="220" fill="#fff">E</text>
    <circle cx="222" cy="215" r="13" fill="#2563eb"/><text x="222" y="220" fill="#fff">L</text>
    <circle cx="272" cy="215" r="13" fill="#2563eb"/><text x="272" y="220" fill="#fff">F</text>
    <circle cx="322" cy="215" r="13" fill="#475569"/><text x="322" y="220" fill="#fff">*</text>
  </g>
  <rect x="400" y="100" width="200" height="200" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="120" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hill activation</text>
  <line x1="420" y1="280" x2="580" y2="280" stroke="#94a3b8"/>
  <line x1="420" y1="120" x2="420" y2="280" stroke="#94a3b8"/>
  <path d="M420,275 L450,270 L480,250 L510,210 L540,170 L570,150 L580,148" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="305" fill="#475569" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">inducer concentration</text>
</svg>
