      author: "Codex"
      summary: "Built first SUTD EPD PID step-response product slice with fixed-plant preset simulation."
authors: ["Codex"]
advisor_signoffs: []
review:
  anieyrudh_filter:
    required_for_status: reviewed
    last_run: "2026-05-19"
    p0_open: 0
    p1_open: 0
    output_in_technical_md: true
misconceptions:
  - name: "Higher gain is always better"
    description: "Learners may increase gain indiscriminately without checking overshoot and settling-time penalties."
    evidence_source: "Åström and Murray, Feedback Systems, chapters on PID and closed-loop performance."
    surface_in_predict: true
  - name: "Derivative action removes steady-state error"
    description: "Learners may assume D action alone shifts final value to the setpoint; integral action is still needed for zero steady-state error in many plants."
    evidence_source: "Ogata, Modern Control Engineering, PID controller effects discussion."
    surface_in_predict: false
sources:
  - citation: "Åström, K. J., and Murray, R. M. Feedback Systems: An Introduction for Scientists and Engineers. Princeton University Press, 2008."
