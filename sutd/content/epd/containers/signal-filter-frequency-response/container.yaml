      A control sensor is sampled at 8 kHz. It must preserve a 400 Hz signal used by the controller while reducing 4 kHz noise before sampling. Choose a one-pole RC low-pass filter and justify the resistor-capacitor pair with cutoff frequency, magnitude at both frequencies, phase at 400 Hz, and the circuit impedance check.
    surface_form: "sensor anti-aliasing filter for a sampled control loop"
    same_concept_check: "The surface changes from a generic RC filter to a sampled sensor channel, but the same cutoff, Bode magnitude, phase, and RC phasor reasoning determine the design."
