misconceptions:
  - name: "Cutoff is an on-off boundary"
    description: "Learners may treat cutoff as a brick-wall threshold and expect all frequencies above it to vanish, instead of reading the gradual -20 dB per decade roll-off of a one-pole filter."
    evidence_source: "Oppenheim, Willsky, and Nawab, Signals and Systems, frequency-response chapters."
    surface_in_predict: true
  - name: "Phase is optional decoration"
    description: "Learners may check only the amplitude response and ignore phase shift, even though filter phase changes sensor timing and closed-loop behavior."
    evidence_source: "Astrom and Murray, Feedback Systems, frequency response and loop shaping chapters."
    surface_in_predict: true
