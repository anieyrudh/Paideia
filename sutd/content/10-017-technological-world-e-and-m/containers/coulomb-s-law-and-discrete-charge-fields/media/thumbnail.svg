<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Coulomb field thumbnail</title>
  <desc id="desc">A positive source charge, a negative test charge, and field and force arrows.</desc>
  <rect width="320" height="180" rx="12" fill="#f8fbff"/>
  <circle cx="110" cy="90" r="26" fill="#dc2626"/>
  <text x="110" y="99" fill="#fff" font-size="28" font-weight="800" text-anchor="middle">+</text>
  <circle cx="220" cy="90" r="20" fill="#2563eb"/>
  <text x="220" y="98" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">-</text>
  <line x1="110" y1="90" x2="220" y2="90" stroke="#64748b" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="220" y1="70" x2="270" y2="70" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <polygon points="270,70 256,61 256,79" fill="#059669"/>
  <line x1="220" y1="110" x2="170" y2="110" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  <polygon points="170,110 184,101 184,119" fill="#d97706"/>
  <text x="282" y="75" fill="#065f46" font-size="18" font-weight="800">E</text>
  <text x="152" y="116" fill="#92400e" font-size="18" font-weight="800">F</text>
</svg>
