controls:
  - id: frequency
    label: "Drive frequency"
    kind: slider
    variable: frequencyHertz
    unit: Hz
    default: 50
    min: 20
    max: 240
    step: 1
  - id: resistance
    label: "Resistance"
    kind: slider
    variable: resistanceOhms
    unit: ohm
    default: 20
    min: 5
    max: 80
    step: 1
  - id: inductance
    label: "Inductance"
    kind: slider
    variable: inductanceMilliHenrys
    unit: mH
    default: 100
    min: 20
    max: 300
    step: 5
  - id: capacitance
    label: "Capacitance"
    kind: slider
    variable: capacitanceMicroFarads
    unit: microF
    default: 100
    min: 20
    max: 300
    step: 5
  - id: source-voltage
    label: "Source voltage"
    kind: slider
    variable: sourceVoltageRmsVolts
    unit: V RMS
    default: 10
    min: 2
    max: 24
    step: 0.5
