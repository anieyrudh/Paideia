misconceptions:
  - name: "Resonance means zero impedance"
    description: "Learners may cancel reactance and forget that the resistor still sets the minimum impedance."
    evidence_source: "OpenStax University Physics Volume 2, AC circuits chapter."
    surface_in_predict: true
  - name: "The larger reactance always gives larger current"
    description: "Learners may miss that current is largest when net reactance is smallest, not when either reactance is large."
    evidence_source: "Halliday, Resnick, and Walker, Fundamentals of Physics, 2018."
    surface_in_predict: true
