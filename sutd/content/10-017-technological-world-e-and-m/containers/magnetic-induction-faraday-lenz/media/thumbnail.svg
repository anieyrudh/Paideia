<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Faraday-Lenz induction thumbnail</title>
  <desc id="desc">A coil links a changing magnetic field and produces an induced field in the opposite direction.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <rect x="12" y="12" width="296" height="156" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="132" cy="90" rx="66" ry="44" fill="#eff6ff" stroke="#2563eb" stroke-width="7"/>
  <ellipse cx="132" cy="90" rx="45" ry="29" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="76" y="63">.</text>
    <text x="116" y="58">.</text>
    <text x="158" y="66">.</text>
    <text x="82" y="105">.</text>
    <text x="123" y="118">.</text>
    <text x="166" y="105">.</text>
  </g>
  <path d="M225 55 C258 70 258 112 225 128" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="216" y="149" fill="#9a3412" font-family="Arial, sans-serif" font-size="14" font-weight="700">opposes change</text>
  <text x="28" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">Faraday-Lenz</text>
  <defs>
    <marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="5" refY="5">
      <path d="M0,0 L9,5 L0,9 Z" fill="#f97316"/>
    </marker>
  </defs>
</svg>
