<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Magnetic Induction: Faraday-Lenz fallback visual</title>
  <desc id="desc">A changing outward magnetic flux through a coil induces a field into the page.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="36" y="32" width="568" height="296" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="64" y="76" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Changing flux through a coil</text>
  <text x="64" y="109" fill="#475569" font-family="Arial, sans-serif" font-size="18">Faraday sets emf magnitude; Lenz sets opposition direction.</text>
  <ellipse cx="250" cy="202" rx="118" ry="78" fill="#eff6ff" stroke="#2563eb" stroke-width="11"/>
  <ellipse cx="250" cy="202" rx="82" ry="52" fill="#ffffff" stroke="#93c5fd" stroke-width="4"/>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="25" font-weight="700">
    <text x="155" y="168">.</text>
    <text x="210" y="151">.</text>
    <text x="275" y="156">.</text>
    <text x="333" y="177">.</text>
    <text x="166" y="222">.</text>
    <text x="225" y="250">.</text>
    <text x="292" y="245">.</text>
    <text x="344" y="218">.</text>
  </g>
  <path d="M443 128 C505 158 505 242 443 272" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="412" y="303" fill="#9a3412" font-family="Arial, sans-serif" font-size="20" font-weight="700">induced field opposes increase</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="70" y="286" width="196" height="28" rx="14" fill="#e0f2fe"/>
    <text x="86" y="306" fill="#075985">Phi = BA cos(theta)</text>
    <rect x="284" y="286" width="162" height="28" rx="14" fill="#fee2e2"/>
    <text x="300" y="306" fill="#991b1b">emf = -N dPhi/dt</text>
  </g>
  <defs>
    <marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="6" refY="6">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f97316"/>
    </marker>
  </defs>
</svg>
