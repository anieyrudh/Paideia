controls:
  - id: dielectric-constant
    label: "Dielectric constant"
    variable: dielectricConstant
    unit: kappa
    min: 1
    max: 8
    step: 0.25
    default: 3
  - id: plate-area
    label: "Plate area"
    variable: plateAreaSquareCentimetres
    unit: cm^2
    min: 20
    max: 160
    step: 5
    default: 80
  - id: plate-gap
    label: "Plate separation"
    variable: plateSeparationMillimetres
    unit: mm
    min: 0.4
    max: 3
    step: 0.1
    default: 1
  - id: voltage
    label: "Applied voltage"
    variable: voltageVolts
    unit: V
    min: 2
    max: 24
    step: 0.5
    default: 12
