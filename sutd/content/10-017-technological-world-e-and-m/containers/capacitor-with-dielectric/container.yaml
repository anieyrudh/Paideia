misconceptions:
  - name: "A dielectric blocks the field completely"
    description: "Learners may treat the slab as a perfect shield instead of a polarizable material that reduces the field per unit free charge."
    evidence_source: "Griffiths, Introduction to Electrodynamics, 2017."
    surface_in_predict: true
  - name: "Voltage alone sets stored energy"
    description: "Learners may miss that at fixed voltage, changing capacitance changes both charge and energy."
    evidence_source: "Halliday, Resnick, and Walker, Fundamentals of Physics, 2018."
    surface_in_predict: true
