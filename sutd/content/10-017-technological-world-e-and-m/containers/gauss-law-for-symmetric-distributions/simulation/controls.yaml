controls:
  - id: symmetry
    label: "Symmetry"
    variable: symmetry
    unit: n/a
    default: spherical
    options: [spherical, cylindrical, planar]
  - id: enclosed-charge
    label: "Enclosed charge"
    variable: enclosedChargeNanoCoulombs
    unit: nC
    min: -8
    max: 8
    step: 0.5
    default: 3.2
  - id: line-charge-density
    label: "Line charge density"
    variable: linearChargeDensityNanoCoulombsPerMetre
    unit: nC/m
    min: -8
    max: 8
    step: 0.5
    default: 2
  - id: surface-charge-density
    label: "Surface charge density"
    variable: surfaceChargeDensityNanoCoulombsPerSquareMetre
    unit: nC/m^2
    min: -8
    max: 8
    step: 0.5
    default: 1.8
  - id: radius
    label: "Gaussian radius"
    variable: radiusMetres
    unit: m
    min: 0.15
    max: 1.2
    step: 0.05
    default: 0.45
  - id: length
    label: "Cylinder length"
    variable: lengthMetres
    unit: m
    min: 0.5
    max: 3
    step: 0.1
    default: 1.5
  - id: face-area
    label: "Pillbox face area"
    variable: faceAreaSquareMetres
    unit: m^2
    min: 0.1
    max: 1.5
    step: 0.05
    default: 0.4
