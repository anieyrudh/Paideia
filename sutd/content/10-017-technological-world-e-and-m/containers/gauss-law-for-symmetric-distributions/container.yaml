misconceptions:
  - name: "Gauss law only works for spheres"
    description: "Learners may treat the sphere as the law instead of one surface that matches one symmetry class."
    evidence_source: "Griffiths, Introduction to Electrodynamics, 2017."
    surface_in_predict: true
  - name: "Flux is the same as field strength"
    description: "Learners may miss that total flux can remain fixed while field strength changes with Gaussian area."
    evidence_source: "Halliday, Resnick, and Walker, Fundamentals of Physics, 2018."
    surface_in_predict: true
  - name: "All parts of any closed surface contribute equally"
    description: "Learners may count end caps or side faces even when the field is tangent or zero-normal there."
    evidence_source: "MIT OpenCourseWare 8.02SC Electricity and Magnetism."
    surface_in_predict: false
