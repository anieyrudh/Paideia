misconceptions:
  - name: "The gradient points along a contour"
    description: "Learners may follow the drawn level curve instead of recognizing that a level curve has zero first-order change and the gradient is normal to it."
    evidence_source: "Stewart Calculus, multivariable calculus chapters on directional derivatives."
    surface_in_predict: true
  - name: "Partial derivatives describe total change in every direction"
    description: "Learners may treat f_x or f_y alone as the total slope, instead of using the gradient dot product to measure change along an arbitrary direction."
    evidence_source: "MIT OCW 18.02SC directional derivatives and gradients notes."
    surface_in_predict: true
