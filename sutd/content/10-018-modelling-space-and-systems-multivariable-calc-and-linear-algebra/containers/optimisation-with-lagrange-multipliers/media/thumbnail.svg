<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Lagrange gradients on a constraint</title>
  <desc id="desc">An ellipse constraint with objective and constraint gradient arrows at one point.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <ellipse cx="360" cy="190" rx="150" ry="92" fill="#ecfeff" stroke="#0891b2" stroke-width="6"/>
  <circle cx="454" cy="121" r="11" fill="#111827"/>
  <path d="M454 121 L540 74" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/>
  <path d="M454 121 L503 39" stroke="#0f766e" stroke-width="9" stroke-dasharray="12 9" stroke-linecap="round"/>
  <text x="48" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Lagrange multipliers</text>
  <text x="48" y="116" font-family="Arial, sans-serif" font-size="22" fill="#475569">Constrained optimum means aligned gradients</text>
</svg>
