<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Determinant and trace thumbnail</title>
  <desc id="desc">A unit square (dashed) maps to a parallelogram whose signed area is the determinant; diagonal entries sum to the trace.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M40 140H280"/>
    <path d="M40 26V158"/>
    <path d="M40 110H280"/>
    <path d="M40 80H280"/>
    <path d="M40 50H280"/>
    <path d="M80 158V26"/>
    <path d="M120 158V26"/>
    <path d="M160 158V26"/>
    <path d="M200 158V26"/>
    <path d="M240 158V26"/>
  </g>
  <path d="M80 140L120 140L120 110L80 110Z" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M80 140L200 110L240 60L120 90Z" fill="#bfdbfe" fill-opacity="0.55" stroke="#2563eb" stroke-width="3"/>
  <text x="160" y="92" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="14" font-weight="600">det A = signed area</text>
  <text x="24" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-size="19" font-weight="700">Determinant &amp; trace</text>
  <text x="24" y="54" fill="#475569" font-family="Arial, sans-serif" font-size="13">tr A = a + d &#160;|&#160; det A = ad - bc</text>
</svg>
