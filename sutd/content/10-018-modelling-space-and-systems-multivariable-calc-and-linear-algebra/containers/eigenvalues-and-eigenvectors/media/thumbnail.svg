<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Eigenvalues and eigenvectors thumbnail</title>
  <desc id="desc">Two eigenvector lines through the origin labelled with their eigenvalues.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M40 90H300"/>
    <path d="M170 20V160"/>
  </g>
  <path d="M40 130L300 50" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 50L300 130" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  <circle cx="170" cy="90" r="5" fill="#0f172a"/>
  <text x="220" y="60" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="15" font-weight="700">lambda_1 = 3</text>
  <text x="220" y="120" fill="#065f46" font-family="Arial, sans-serif" font-size="15" font-weight="700">lambda_2 = 2</text>
  <text x="24" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-size="19" font-weight="700">Eigenvalues &amp; eigenvectors</text>
</svg>
