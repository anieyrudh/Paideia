misconceptions:
  - name: "Eigenvalues are always the diagonal entries"
    description: "Learners may assume the diagonal entries are always the eigenvalues, ignoring the role of off-diagonal coupling."
    evidence_source: "Strang, Introduction to Linear Algebra."
    surface_in_predict: true
  - name: "Complex eigenvalues mean no real behaviour"
    description: "Learners may dismiss complex eigenvalues as non-physical instead of reading them as a rotation-plus-scaling pair."
    evidence_source: "Hirsch, Smale, Devaney, Differential Equations and Dynamical Systems."
    surface_in_predict: true
