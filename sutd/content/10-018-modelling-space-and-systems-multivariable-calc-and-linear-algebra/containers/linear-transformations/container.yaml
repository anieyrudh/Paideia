misconceptions:
  - name: "Linear transformations always preserve length"
    description: "Learners may confuse linear with rigid; only rotations and reflections preserve length, while scalings and shears change it."
    evidence_source: "Strang, Introduction to Linear Algebra."
    surface_in_predict: true
  - name: "Rotation matrices have nonzero diagonal entries only"
    description: "Learners may try to identify rotation from the diagonal alone, missing that the off-diagonal cosine/sine encodes the angle."
    evidence_source: "SUTD 10.018 linear algebra study aids."
    surface_in_predict: true
