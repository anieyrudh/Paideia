transfer_problems:
  - id: composite-decomposition
    prompt: |
      A = [[2, 0], [0, 2]] composed with [[cos(theta), -sin(theta)], [sin(theta), cos(theta)]] for theta = 30 degrees. Decompose the composite into the order "scale then rotate" and explain how the determinant, trace, and basis images change between scaling, rotating, and the composite.
    surface_form: "graphics pipeline transform decomposition"
    same_concept_check: "Same concept: a linear transformation is determined by its action on the standard basis, so composites read off as products of basis images."
