misconceptions:
  - name: "Large arrows automatically mean large divergence"
    description: "Learners may read speed from arrow length as source strength, rather than checking whether flow expands or contracts locally."
    evidence_source: "OpenStax Calculus Volume 3, vector field diagnostics."
    surface_in_predict: true
  - name: "Curl means the whole field must move in circles"
    description: "Learners may miss that curl is a local rotational tendency, even in fields that do not form complete circular streamlines."
    evidence_source: "MIT OpenCourseWare multivariable calculus notes on curl."
    surface_in_predict: true
