controls:
  - id: field-kind
    label: Vector field
    type: select
  - id: sample-x
    label: Sample x
    type: slider
    min: -1.5
    max: 1.5
    step: 0.25
  - id: sample-y
    label: Sample y
    type: slider
    min: -1.5
    max: 1.5
    step: 0.25
  - id: strength
    label: Field strength
    type: slider
    min: 0.5
    max: 2
    step: 0.25
