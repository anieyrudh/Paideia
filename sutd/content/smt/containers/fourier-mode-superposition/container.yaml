      A one metre rod has an initial temperature profile with one warm lobe near the centre and cooler fixed ends. Choose the sine basis modes you would keep first, compute the first four coefficients, and state which added mode most reduces the reconstruction error.
    surface_form: "heat-equation initial-temperature decomposition"
    same_concept_check: "The setting changes from a string-shaped displacement to an initial temperature profile, but the work is still sine-basis projection, coefficient interpretation, and reconstruction-error comparison."
