misconceptions:
  - name: "One mode must explain every shape"
    description: "Learners may try to make a single sine arch match every target, instead of reading the residual as evidence that more orthogonal modes are needed."
    evidence_source: "Kreyszig, Advanced Engineering Mathematics, Fourier series chapters."
    surface_in_predict: true
  - name: "Coefficients are arbitrary visual sliders"
    description: "Learners may treat modal coefficients as cosmetic controls, rather than signed projections that measure how much of each basis shape is present."
    evidence_source: "Strang, Introduction to Linear Algebra, orthogonality and Fourier series sections."
    surface_in_predict: true
