branch: sutd
subject: dai
level: "Freshmore"
module: "Design and Artificial Intelligence"
title: "Fairness Threshold Audit"
one_line_summary: "Compare group confusion matrices under a threshold policy and explain when a shared threshold creates unequal stakeholder harm."
syllabus_ref: "SUTD DAI / Human-centred AI fairness evaluation"
prerequisites:
  - confusion-matrix-thresholds
  - trust-calibration
  - probability
aid_types:
  - simulation
  - transfer-problem
  - misconception-audit
  - annotated-source
predict_at: package-level
package_predict:
  prompt: |
    Two student groups receive the same risk-score model. If both groups use one 70% threshold, which audit result is most plausible?
  commit_format:
    kind: multiple-choice
    options:
      - "Equal overall accuracy means the threshold is fair enough"
      - "The group with lower recall can carry more missed-support harm"
      - "A lower threshold always makes every group better off"
  rationale_required: true
