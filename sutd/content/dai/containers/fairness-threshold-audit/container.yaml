transfer_problems:
  - id: transfer-hiring-shortlist-audit
    prompt: |
      A hiring shortlist model screens two applicant groups. At the current threshold, Group A has TP=18, FP=6, TN=28, FN=8. Group B has TP=10, FP=5, TN=29, FN=16. False negatives cost 30 stakeholder-harm units and false positives cost 8 review-burden units. Audit whether one threshold is acceptable, compute recall and weighted harm for each group, and propose one policy revision.
    surface_form: "hiring shortlist threshold audit"
    same_concept_check: "The learner still compares group confusion matrices, substitutes group error counts into recall and cost formulas, then interprets threshold policy as stakeholder impact."
    rubric_path: problem-solving/transfer-hiring-shortlist-audit.md
