misconceptions:
  - name: "Equal accuracy means equal impact"
    description: |
      Learners may compare only overall accuracy and miss that one group can receive lower recall and higher weighted harm even when accuracy looks close.
    evidence_source: "Hardt, Price, and Srebro 2016; Mitchell et al. 2021."
    surface_in_predict: true
  - name: "One global threshold is always fairest"
    description: |
      Learners may treat a single threshold as neutral without checking whether group score distributions, base rates, and error costs create unequal impact.
    evidence_source: "Hardt, Price, and Srebro 2016; Suresh and Guttag 2021."
    surface_in_predict: true
sources:
