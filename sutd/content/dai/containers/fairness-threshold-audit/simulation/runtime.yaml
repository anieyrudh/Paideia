runtime:
  package_id: sutd/dai/fairness-threshold-audit
  sim_id: fairness-threshold-audit
  stages:
    - predict
    - manipulate
    - observe
    - explain
  prediction_gate:
    required: true
    rationale_required: true
    reveal_target: "group audit tables, chart, formula panel, and annotated stakeholder interpretation"
  persistence:
    prediction: local
    manipulation_state: session
  accessibility:
    keyboard_controls: true
    critical_axe_violations_allowed: 0
  visual_smoke_targets:
    - desktop
    - mobile
visual_quality:
  setup: []
  prediction:
    option_label: "The group with lower recall can carry more missed-support harm"
    rationale: "An equal threshold rarely produces equal recall, so the group with lower recall has more false negatives and a higher weighted missed-support cost."
  observation:
    observation_label: "Observation unlocked"
    visual: required
    formula: required
