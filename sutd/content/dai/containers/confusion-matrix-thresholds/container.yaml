subject: dai
level: "Freshmore"
module: "Design and Artificial Intelligence"
title: "Confusion Matrix Thresholds"
one_line_summary: "Tune a classifier threshold and explain how false positives, false negatives, precision, recall, and stakeholder cost move together."
syllabus_ref: "SUTD DAI / Human-centred AI decision thresholds"
prerequisites:
  - trust-calibration
  - probability
  - classification
