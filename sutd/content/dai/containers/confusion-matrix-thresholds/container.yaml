  - misconception-audit
predict_at: package-level
package_predict:
  prompt: |
    Before revealing the counts, predict what happens if the threshold is raised from 65% to 80% while false negatives are costly.
  commit_format:
    kind: multiple-choice
    options:
      - "Precision and recall both increase because the model becomes stricter"
      - "Recall falls, so missed-positive cost can rise even if precision improves"
      - "Accuracy is unchanged because the underlying scores do not change"
  rationale_required: true
