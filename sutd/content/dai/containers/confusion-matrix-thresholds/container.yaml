misconceptions:
  - name: "Accuracy is enough for every deployment"
    description: |
      Learners may optimize the single accuracy number and miss that false positives and false negatives have different consequences for different stakeholders.
    evidence_source: "Google Machine Learning Crash Course thresholding guide; Suresh and Guttag 2021."
    surface_in_predict: true
  - name: "A single threshold is neutral for all groups"
    description: |
      Learners may treat one global threshold as inherently fair even when base rates, score calibration, or error costs differ across groups.
    evidence_source: "Hardt et al. 2016; Suresh and Guttag 2021."
    surface_in_predict: true
