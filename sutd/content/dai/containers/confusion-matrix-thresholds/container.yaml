transfer_problems:
  - id: transfer-loan-review-threshold
    prompt: |
      A loan-review model flags applications for manual review. False positives slow down eligible applicants; false negatives approve risky applications. Choose a threshold, compute the confusion matrix, and justify the policy using precision, recall, and cost units.
    surface_form: "loan-review threshold policy"
    same_concept_check: "The learner still updates TP, FP, TN, and FN from a threshold, then interprets precision, recall, and asymmetric stakeholder cost."
