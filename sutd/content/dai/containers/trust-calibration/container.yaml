schema_version: "1.0.0"
id: trust-calibration
aliases: []
branch: sutd
subject: dai
level: "Freshmore"
module: "Data and AI"
title: "Trust Calibration"
one_line_summary: "Calibrate trust in a fixed classifier by comparing confidence, accuracy, costs, and a human-override rule."
syllabus_ref: "SUTD DAI / Trustworthy decision-making"
prerequisites:
  - basic-probability
  - confusion-matrix-basics
aid_types:
  - simulation
  - transfer-problem
  - misconception-audit
predict_at: package-level
package_predict:
  prompt: |
    Before comparing with outcomes, choose whether a high-confidence automation-only policy or a human-override policy will produce lower total decision cost on this fixed dataset.
  commit_format:
    kind: multiple-choice
    options:
      - "Automation-only at confidence ≥ 0.8 has lower total cost"
      - "Human-override for uncertain cases (0.4 to 0.8) has lower total cost"
      - "Both policies produce the same total cost"
  rationale_required: true
components:
  concept_card: concept-card.md
  concept_map: concept-map/concept-map.yaml
  mindmap: concept-map/mindmap.md
  mermaid: concept-map/graph.mmd
  media: media
  simulation: simulation
  embed: embed
  problem_solving: problem-solving
  sources: sources.md
capabilities:
  sim_worthy: true
  interactive_simulation: true
  notebook_lab: false
  visual_derivation: true
simulation:
  spec: simulation/simulation.yaml
  controls: simulation/controls.yaml
  presets: simulation/presets.yaml
  state_labels: simulation/state-labels.yaml
  runtime: simulation/runtime.yaml
problem_solving:
  algorithm: problem-solving/algorithm.md
  steps: problem-solving/steps.yaml
embed_api:
  entry: embed/index.ts
  api: embed/api.ts
  methods: [load, saveState, score, resume, syncTheme, destroy]
concept_map:
  spec: concept-map/concept-map.yaml
  mindmap: concept-map/mindmap.md
  mermaid: concept-map/graph.mmd
transfer_problems:
  - id: transfer-triage-policy
    prompt: |
      In a clinic triage setting, choose a confidence threshold and an override band that minimize total cost when false negatives are much more expensive than false positives.
    surface_form: "clinical triage"
    same_concept_check: "Still compares confidence, observed accuracy, and cost-weighted errors under a fixed dataset."
    rubric_path: problem-solving/transfer-triage-policy.md
assessments: []
status: reviewed
authoring:
  owner: "Paideia"
  reviewers: []
  qa_status: passed
