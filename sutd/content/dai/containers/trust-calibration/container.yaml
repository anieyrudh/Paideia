    p0_open: 0
    p1_open: 0
    output_in_technical_md: true
misconceptions:
  - name: "Confidence equals correctness"
    description: |
      Learners may treat 0.9 confidence as a guarantee of correctness and ignore calibration gaps and base rates.
    evidence_source: "Guo et al. 2017; Niculescu-Mizil and Caruana 2005."
    surface_in_predict: true
  - name: "Accuracy is the only metric"
    description: |
      Learners may optimize for overall accuracy while neglecting asymmetric false-positive and false-negative costs.
    evidence_source: "Google ML Crash Course thresholding guide."
    surface_in_predict: true
sources:
  - citation: "Niculescu-Mizil, A. and Caruana, R. Predicting good probabilities with supervised learning. ICML, 2005."
    url: "https://dl.acm.org/doi/10.1145/1102351.1102430"
    publication_year: 2005
