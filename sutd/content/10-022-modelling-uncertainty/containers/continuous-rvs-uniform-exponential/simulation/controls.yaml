controls:
  - id: model
    label: "Density family"
    type: selector
    options: [uniform, exponential]
  - id: minimum
    label: "Uniform minimum"
    type: slider
    min: 0
    max: 9
    step: 0.1
  - id: maximum
    label: "Uniform maximum"
    type: slider
    min: 0.5
    max: 10
    step: 0.1
  - id: rate
    label: "Exponential rate"
    type: slider
    min: 0.1
    max: 2
    step: 0.01
  - id: lower-bound
    label: "Interval lower bound"
    type: slider
    min: 0
    max: 10
    step: 0.1
  - id: upper-bound
    label: "Interval upper bound"
    type: slider
    min: 0.1
    max: 12
    step: 0.1
