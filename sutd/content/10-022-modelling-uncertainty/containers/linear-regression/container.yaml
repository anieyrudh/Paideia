misconceptions:
  - name: "The regression line must pass through all observations"
    description: "Learners may treat a fitted line as an interpolating curve rather than a least-squares summary of residuals."
    evidence_source: "Introductory regression teaching contrasts residual minimisation with exact interpolation."
    surface_in_predict: true
  - name: "A high R squared proves causation"
    description: "Learners may overclaim from strong linear association without checking design, confounding, and extrapolation limits."
    evidence_source: "Statistical modelling guidance separates association, prediction, and causal claims."
    surface_in_predict: true
