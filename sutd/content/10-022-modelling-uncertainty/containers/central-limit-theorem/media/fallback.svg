<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Central Limit Theorem fallback visual</title>
  <desc id="desc">A skewed population distribution and a narrower bell-shaped sampling distribution.</desc>
  <rect width="640" height="360" fill="#f8fbff"/>
  <text x="48" y="64" fill="#10201a" font-family="sans-serif" font-size="30" font-weight="700">Central Limit Theorem</text>
  <text x="48" y="104" fill="#344054" font-family="sans-serif" font-size="18">Repeated sample means cluster near mu with spread sigma/sqrt(n).</text>
  <g transform="translate(58 160)">
    <rect x="0" y="90" width="34" height="70" rx="5" fill="#1f5f8b"/>
    <rect x="46" y="55" width="34" height="105" rx="5" fill="#1f5f8b"/>
    <rect x="92" y="20" width="34" height="140" rx="5" fill="#1f5f8b"/>
    <rect x="138" y="115" width="34" height="45" rx="5" fill="#1f5f8b"/>
    <text x="0" y="190" fill="#344054" font-family="sans-serif" font-size="16">Population</text>
  </g>
  <g transform="translate(330 160)">
    <path d="M0 150 C42 40 118 40 160 150" fill="none" stroke="#6941c6" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" x2="180" y1="160" y2="160" stroke="#667085" stroke-width="3"/>
    <text x="0" y="190" fill="#344054" font-family="sans-serif" font-size="16">Sample means</text>
  </g>
</svg>
