<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 800 520">
  <title id="title">Static Markov chain steady-state visual</title>
  <desc id="desc">A transition matrix, state update equation, and steady-state interpretation.</desc>
  <rect width="800" height="520" fill="#f8faf8"/>
  <text x="54" y="70" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#172026">Markov Chain Steady State</text>
  <text x="54" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#42514a">The long-run mix satisfies pi = P pi.</text>
  <rect x="58" y="150" width="260" height="190" rx="8" fill="#ffffff" stroke="#c6d5cc"/>
  <text x="84" y="198" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#172026">P = [[0.84, 0.38],</text>
  <text x="84" y="236" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#172026">     [0.16, 0.62]]</text>
  <text x="84" y="292" font-family="Inter, Arial, sans-serif" font-size="18" fill="#42514a">columns sum to 1</text>
  <rect x="388" y="150" width="354" height="190" rx="8" fill="#ffffff" stroke="#c6d5cc"/>
  <text x="418" y="200" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#172026">pi_S = 0.38 / (0.38 + 0.16)</text>
  <text x="418" y="246" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#172026">pi_S = 0.704</text>
  <text x="418" y="292" font-family="Inter, Arial, sans-serif" font-size="18" fill="#42514a">about 70.4% smooth weeks</text>
  <path d="M86 420 L220 380 L354 368 L488 364 L622 363 L724 363" fill="none" stroke="#177245" stroke-width="6"/>
  <path d="M86 370 L220 410 L354 422 L488 426 L622 427 L724 427" fill="none" stroke="#b54708" stroke-width="6"/>
  <line x1="86" x2="724" y1="446" y2="446" stroke="#667085" stroke-width="2"/>
</svg>
