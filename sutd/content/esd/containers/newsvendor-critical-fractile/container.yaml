misconceptions:
  - name: "The optimal stock is always mean demand"
    description: "Learners may use the expected demand as the order quantity even when shortage and leftover costs are strongly asymmetric."
    evidence_source: "Newsvendor teaching examples contrast mean-demand ordering with the critical-ratio optimum."
    surface_in_predict: true
  - name: "A higher service level is always cheaper"
    description: "Learners may treat service level as a monotone improvement rather than a marginal tradeoff against leftover cost."
    evidence_source: "Inventory models frame service level as a cost-balanced fractile, not a universal target."
    surface_in_predict: true
