transfer_problems:
  - id: lab-kit-pop-up
    prompt: |
      A one-day lab-kit pop-up faces uncertain demand at 50, 70, 90, 110, and 130 kits. A missed kit costs 24 SGD and a leftover kit costs 8 SGD. Compute the critical fractile, choose the smallest demand point whose cumulative probability reaches it, and explain whether the answer should be above or below mean demand.
    surface_form: "single-period event inventory"
    same_concept_check: "Same concept: compare underage and overage costs, then map the critical fractile onto the demand CDF."
