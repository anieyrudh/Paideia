transfer_problems:
  - id: resource-allocation-table
    prompt: |
      Define a state for choosing among the first k projects with b credits left. Write the recurrence and identify which table entries can be reused.
    surface_form: "resource allocation with a fixed credit budget"
    same_concept_check: "The state definition and recurrence determine table entries; memoisation only avoids repeated subproblems."
    rubric_path: problem-solving/algorithm.md
