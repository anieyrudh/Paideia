misconceptions:
  - name: "dynamic programming means any loop"
    description: "Learners identify the loop structure instead of the state, recurrence, and reused overlapping subproblems."
    evidence_source: "MIT OpenCourseWare 6.006 dynamic programming material"
    surface_in_predict: true
  - name: "memoisation changes the recurrence result"
    description: "Learners think storing values changes the answer rather than preserving the recurrence while reducing repeated work."
    evidence_source: "OpenDSA dynamic programming chapter"
    surface_in_predict: true
