schema_version: "1.0.0"
id: dynamic-programming-state-recursion
aliases: []
branch: sutd
subject: csd
level: "Freshmore"
module: "ISTD/CSD"
title: "Dynamic Programming State Recursion"
one_line_summary: "Define DP states, trace a recurrence, and read a memoisation table without changing the recurrence value."
syllabus_ref: "SUTD CSD: Algorithms"
prerequisites: ["graph-search-and-shortest-paths", "recursion", "arrays"]
aid_types: [simulation, misconception-audit, transfer-problem]
predict_at: package-level
package_predict:
  prompt: |
    When ways(5) needs ways(4), and ways(4) was already computed, what should the table do?
  commit_format:
    kind: multiple-choice
    options:
      - "Reuse ways(4) without changing its value."
      - "Recompute every branch below ways(4) so the answer is more accurate."
      - "Change the recurrence because memoisation changes the problem."
      - "Count only the loop iterations and ignore the state definition."
  rationale_required: true
