aliases: ["recursion tree", "divide-and-conquer recurrence", "master theorem intuition"]
branch: sutd
subject: csd
level: "Freshmore"
module: "ISTD/CSD"
title: "Recursion Tree Complexity"
one_line_summary: "Estimate divide-and-conquer recurrence growth by comparing cost across recursion-tree levels."
syllabus_ref: "SUTD CSD: Algorithms"
prerequisites: ["dynamic-programming-state-recursion", "graph-search-and-shortest-paths", "asymptotic-notation"]
aid_types: [simulation, misconception-audit, transfer-problem]
predict_at: package-level
package_predict:
  prompt: |
    For T(n) = 2T(n/2) + n, which part of the recursion tree contributes the same order of work as every other level?
  commit_format:
    kind: multiple-choice
    options:
      - "Every level contributes n operations, so the height adds a log n factor."
      - "Only the root matters because it sees the full input size."
      - "Only the leaves matter because there are many base cases."
      - "The base case never changes the total work."
    correct_index: 0
  rationale_required: true
