misconceptions:
  - name: "recursive code always has exponential cost"
    description: "Learners count the growing number of calls but ignore that each deeper subproblem may be smaller and cheaper."
    evidence_source: "MIT OpenCourseWare 6.006 divide-and-conquer recurrence material"
    surface_in_predict: true
  - name: "base cases do not affect total work"
    description: "Learners omit tree height and leaf count, so they miss when leaf work dominates or when a balanced tree adds a logarithmic factor."
    evidence_source: "CLRS recurrence-tree and Master theorem discussion"
    surface_in_predict: true
