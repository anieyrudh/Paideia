transfer_problems:
  - id: cache-oblivious-search-index
    prompt: |
      A search-index build splits the records into three equal shards and does linear merge work at each node: T(n) = 3T(n/3) + 2n. Build the first three recursion-tree levels, compare their costs, and decide the asymptotic order.
    surface_form: "search-index build with shard merges"
    same_concept_check: "The learner must compare recursion-tree level costs rather than reading the code shape as exponential by default."
    rubric_path: problem-solving/cache-oblivious-search-index.md
