<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Recursion tree fallback</title>
  <desc id="desc">Static formula for level cost in a recursion tree.</desc>
  <rect width="640" height="360" fill="#17211d"/>
  <rect x="64" y="64" width="512" height="232" rx="8" fill="#f8faf7"/>
  <text x="320" y="128" fill="#14201c" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Recursion Tree Complexity</text>
  <text x="320" y="188" fill="#2563eb" font-family="Menlo, Consolas, monospace" font-size="28" font-weight="700" text-anchor="middle">L_k = a^k c(n / b^k)^p</text>
  <text x="320" y="238" fill="#52635b" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="middle">Compare a / b^p to decide the dominant work.</text>
</svg>
