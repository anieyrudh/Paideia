    kind: multiple-choice
    options:
      - "BFS and Dijkstra always return the same path because both are shortest."
      - "BFS minimizes number of edges; Dijkstra minimizes total non-negative weight."
      - "DFS always finds the lowest-weight path first."
  rationale_required: true
