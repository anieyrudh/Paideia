<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Chemical bonding thumbnail</title>
  <desc id="desc">Three particle models comparing ionic, polar, and nonpolar bonding.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Bonding and attractions</text>
  <g transform="translate(58 92)">
    <circle r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1e3a8a">Na+</text>
    <circle cx="62" r="24" fill="#dcfce7" stroke="#0f766e" stroke-width="3"/>
    <text x="62" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#14532d">Cl-</text>
  </g>
  <g transform="translate(190 92)">
    <circle r="24" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <text y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#7c2d12">O</text>
    <circle cx="-34" cy="32" r="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <circle cx="34" cy="32" r="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="24" y="158" font-family="Arial" font-size="14" fill="#334155">Compare bond class, shape, and particle attraction.</text>
</svg>
