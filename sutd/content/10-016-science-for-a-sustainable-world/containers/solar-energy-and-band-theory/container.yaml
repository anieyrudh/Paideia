misconceptions:
  - name: "Higher-energy photons always make proportionally more electrical energy"
    description: "Learners may assume every electron volt above the gap is useful, missing that excess photon energy is mostly thermalised."
    evidence_source: "Photovoltaic device physics references."
    surface_in_predict: true
  - name: "Any light colour can excite any semiconductor"
    description: "Learners may ignore the threshold condition and expect below-gap photons to be absorbed by any solar material."
    evidence_source: "OpenStax quantum and electronic structure chapters."
    surface_in_predict: true
