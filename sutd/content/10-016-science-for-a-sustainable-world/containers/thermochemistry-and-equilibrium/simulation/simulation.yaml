id: thermochemistry-and-equilibrium
title: "Thermochemistry and Equilibrium Lab"
interaction_type: comparative-matrix
kernel_deps:
  - core/sim-runtime
  - core/prediction-gate
  - core/chemistry
  - core/thermodynamics
  - core/ui-sim
predict:
  prompt: |
    A 100 g water sample warms from 25 C to 45 C. Is heat absorbed or released by the water sample?
  commit_format:
    kind: multiple-choice
    options:
      - "absorbed by the sample"
      - "released by the sample"
      - "no heat transfer"
      - "cannot be related to temperature"
    correct_index: 0
  rationale_required: true
manipulate:
  controls:
    - id: final-temperature-celsius
      label: Final temperature
      kind: slider
      kernel_binding: state.finalTemperatureCelsius
      bounds:
        min: 20
        max: 80
        step: 1
    - id: product-concentration
      label: Product concentration
      kind: slider
      kernel_binding: state.productConcentration
      bounds:
        min: 0.1
        max: 2
        step: 0.1
    - id: reactant-concentration
      label: Reactant concentration
      kind: slider
      kernel_binding: state.reactantConcentration
      bounds:
        min: 0.1
        max: 2
        step: 0.1
observe:
  renderers:
    - id: thermo-equilibrium-evidence
      module: "@paideia/sutd-sims/thermochemistry-and-equilibrium"
      symbol: ThermochemistryAndEquilibrium
      props_binding: |
        Show heat-transfer calculation, equilibrium quotient, and particle-level interpretation.
explain:
  prompt: |
    Explain why heat-flow direction and equilibrium composition answer different questions about the same reaction system.
  socratic: true
  expected_misconceptions_surfaced:
    - Exothermic always means product-favoured
    - Equilibrium means equal reactant and product concentrations
