controls:
  - id: final-temperature-celsius
    label: Final temperature
    kind: slider
    min: 20
    max: 80
    step: 1
    unit: C
    default: 45
  - id: product-concentration
    label: Product concentration
    kind: slider
    min: 0.1
    max: 2
    step: 0.1
    unit: mol/L
    default: 1.2
  - id: reactant-concentration
    label: Reactant concentration
    kind: slider
    min: 0.1
    max: 2
    step: 0.1
    unit: mol/L
    default: 0.4
