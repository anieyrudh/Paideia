controls:
  - id: raw-turbidity-ntu
    label: "Raw turbidity"
    kind: slider
    min: 5
    max: 150
    step: 5
    unit: NTU
    default: 80
  - id: filter-removal-percent
    label: "Coagulation and filtration removal"
    kind: slider
    min: 40
    max: 98
    step: 1
    unit: "%"
    default: 90
  - id: chlorine-mg-per-litre
    label: "Free chlorine dose"
    kind: slider
    min: 0.1
    max: 3
    step: 0.1
    unit: mg/L
    default: 1.2
  - id: contact-minutes
    label: "Contact time"
    kind: slider
    min: 5
    max: 90
    step: 5
    unit: min
    default: 30
  - id: p-h
    label: "pH"
    kind: slider
    min: 4.5
    max: 10
    step: 0.1
    default: 7.2
  - id: filter-velocity-metres-per-second
    label: "Filter approach velocity"
    kind: slider
    min: 0.02
    max: 0.3
    step: 0.01
    unit: m/s
    default: 0.08
