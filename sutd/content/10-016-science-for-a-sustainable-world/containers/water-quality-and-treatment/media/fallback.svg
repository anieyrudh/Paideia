<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Water treatment evidence chain</title>
  <desc id="desc">A fallback diagram showing turbidity, disinfection CT, pH, and final decision.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <rect x="64" y="72" width="132" height="82" rx="10" fill="#f8fafc" stroke="#476582"/>
  <rect x="224" y="72" width="132" height="82" rx="10" fill="#f8fafc" stroke="#476582"/>
  <rect x="384" y="72" width="132" height="82" rx="10" fill="#f8fafc" stroke="#476582"/>
  <rect x="544" y="72" width="112" height="82" rx="10" fill="#eef6ff" stroke="#1b7f5f"/>
  <text x="130" y="120" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20">turbidity</text>
  <text x="290" y="120" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20">CT</text>
  <text x="450" y="120" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20">pH</text>
  <text x="600" y="120" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20">screen</text>
  <path d="M196 113h28M356 113h28M516 113h28" stroke="#476582" stroke-width="5"/>
  <text x="360" y="240" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#172033">Clear-looking water still needs invisible evidence.</text>
</svg>
