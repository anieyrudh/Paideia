branch: sutd
subject: 10-016-science-for-a-sustainable-world
level: "Freshmore"
module: "Science for a Sustainable World"
title: "Water Quality and Treatment"
one_line_summary: "Evaluate a water treatment train by combining turbidity removal, CT disinfection, pH banding, and filter-flow evidence."
syllabus_ref: "SUTD 10.016 Science for a Sustainable World / Water quality and treatment"
prerequisites:
  - concentration
  - reaction-rates
aid_types:
  - simulation
  - transfer-problem
  - misconception-audit
predict_at: package-level
package_predict:
  prompt: |
    The water looks clear after filtration, but disinfection contact time is very low. What is the safest claim?
  commit_format:
    kind: multiple-choice
    options:
      - "Clear water is automatically safe to drink"
      - "Low turbidity helps, but pathogen risk still needs disinfection evidence"
      - "Chlorine dose alone is enough even with zero contact time"
      - "pH has no effect on water treatment decisions"
    correct_index: 1
  rationale_required: true
