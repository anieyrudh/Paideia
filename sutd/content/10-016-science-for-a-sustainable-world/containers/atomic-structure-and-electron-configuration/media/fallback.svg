<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Atomic structure fallback visual</title>
  <desc id="desc">A static diagram showing carbon with two electrons in the first shell and four in the second shell.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="48" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Carbon: Z = 6</text>
  <text x="48" y="86" font-family="Arial, sans-serif" font-size="18" fill="#334155">Neutral electron count = atomic number = 6</text>
  <circle cx="320" cy="190" r="32" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/>
  <text x="320" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7f1d1d">6p</text>
  <circle cx="320" cy="190" r="70" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="320" cy="190" r="118" fill="none" stroke="#2563eb" stroke-width="4"/>
  <g fill="#0f766e">
    <circle cx="320" cy="120" r="8"/>
    <circle cx="320" cy="260" r="8"/>
  </g>
  <g fill="#2563eb">
    <circle cx="320" cy="72" r="8"/>
    <circle cx="438" cy="190" r="8"/>
    <circle cx="320" cy="308" r="8"/>
    <circle cx="202" cy="190" r="8"/>
  </g>
  <text x="48" y="308" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Shell summary: 2, 4</text>
  <text x="48" y="334" font-family="Arial, sans-serif" font-size="20" fill="#0f172a">Subshell notation: 1s2 2s2 2p2</text>
</svg>
