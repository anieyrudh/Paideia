<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Atomic structure thumbnail</title>
  <desc id="desc">Electron shells around a nucleus with a valence shell highlighted.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <circle cx="160" cy="90" r="22" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/>
  <text x="160" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7f1d1d">Z</text>
  <circle cx="160" cy="90" r="48" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 6"/>
  <circle cx="160" cy="90" r="78" fill="none" stroke="#2563eb" stroke-width="3"/>
  <g fill="#0f766e">
    <circle cx="160" cy="42" r="6"/>
    <circle cx="160" cy="138" r="6"/>
  </g>
  <g fill="#2563eb">
    <circle cx="160" cy="12" r="6"/>
    <circle cx="238" cy="90" r="6"/>
    <circle cx="160" cy="168" r="6"/>
    <circle cx="82" cy="90" r="6"/>
  </g>
  <text x="24" y="34" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Electron configuration</text>
  <text x="24" y="156" font-family="Arial, sans-serif" font-size="14" fill="#334155">Z sets electrons; shells reveal valence.</text>
</svg>
