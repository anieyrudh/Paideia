  - name: "Zero net force means no forces act"
    description: "Learners may think equilibrium requires no forces rather than forces summing to zero."
    evidence_source: "OpenStax University Freshmore Physics Volume 1, Section 5.4 Newton's Second Law."
    surface_in_predict: true
