package_predict:
  prompt: |
    A 6 N force pulls left and a 5 N weight pulls down. What pair of support forces is needed for equilibrium?
  commit_format:
    kind: multiple-choice
    options:
      - "6 N right and 5 N up"
      - "5 N right and 6 N up"
      - "11 N right only"
      - "1 N up only"
  rationale_required: true
