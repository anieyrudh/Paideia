branch: sutd
subject: freshmore
level: "Freshmore"
module: "Freshmore Physics"
title: "Free-Body Diagram / Mechanics Lab"
one_line_summary: "Balance perpendicular forces by making the resultant force zero in both horizontal and vertical directions."
