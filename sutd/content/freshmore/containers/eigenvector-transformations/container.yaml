misconceptions:
  - name: "Every vector is an eigenvector"
    description: "Learners may think any transformed vector counts as an eigenvector instead of checking whether Av remains parallel to v."
    evidence_source: "Linear algebra textbook treatments of eigenvectors as invariant directions."
    surface_in_predict: true
  - name: "Eigenvalues are rotation angles"
    description: "Learners may read an eigenvalue as a turn amount instead of a scalar stretch or flip along an invariant direction."
    evidence_source: "SUTD Freshmore linear algebra emphasis on transformations, eigendirections, and modal interpretation."
    surface_in_predict: true
