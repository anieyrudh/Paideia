<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Eigenvector transformations fallback visual</title>
  <desc id="desc">A matrix transformation preserves one candidate direction and tilts another.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <g stroke="#dbe4ee" stroke-width="1">
    <path d="M80 300H560"/>
    <path d="M80 250H560"/>
    <path d="M80 200H560"/>
    <path d="M80 150H560"/>
    <path d="M80 100H560"/>
    <path d="M120 320V60"/>
    <path d="M180 320V60"/>
    <path d="M240 320V60"/>
    <path d="M300 320V60"/>
    <path d="M360 320V60"/>
    <path d="M420 320V60"/>
    <path d="M480 320V60"/>
    <path d="M540 320V60"/>
  </g>
  <path d="M92 284L556 126" stroke="#94a3b8" stroke-width="4" stroke-dasharray="12 10"/>
  <path d="M120 275L254 230" stroke="#059669" stroke-width="10" stroke-linecap="round"/>
  <path d="M120 275L470 156" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <path d="M120 275L226 134" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="275" r="8" fill="#0f172a"/>
  <text x="52" y="54" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">Eigenvector transformations</text>
  <text x="52" y="88" fill="#475569" font-family="Arial, sans-serif" font-size="18">Check whether Av lands on the same line as v.</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="424" y="236" width="148" height="72" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="444" cy="258" r="6" fill="#059669"/>
    <text x="460" y="263" fill="#334155">candidate v</text>
    <circle cx="444" cy="286" r="6" fill="#2563eb"/>
    <text x="460" y="291" fill="#334155">transformed Av</text>
  </g>
</svg>
