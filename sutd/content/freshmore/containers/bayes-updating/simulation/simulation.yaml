id: bayes-updating
title: "Bayes Updating Explorer"
interaction_type: decision-matrix
kernel_deps:
  - core/sim-runtime
  - core/prediction-gate
  - core/probability-stats
predict:
  prompt: |
    With prior 10%, sensitivity 95%, and specificity 90%, what is P(H|+) approximately?
  commit_format:
    kind: multiple-choice
    options: ["9.5%", "34.5%", "51.3%", "90.0%"]
  rationale_required: true
manipulate:
  controls:
    - id: prevalence-percent
      label: "Prior prevalence P(H)"
      kind: slider
      kernel_binding: state.prevalencePercent
      bounds: { min: 1, max: 60, step: 1 }
    - id: sensitivity-percent
      label: "Sensitivity P(+|H)"
      kind: slider
      kernel_binding: state.sensitivityPercent
      bounds: { min: 50, max: 99, step: 1 }
    - id: specificity-percent
      label: "Specificity P(-|¬H)"
      kind: slider
      kernel_binding: state.specificityPercent
      bounds: { min: 50, max: 99, step: 1 }
observe:
  renderers:
    - id: posterior-readout
      module: local
      symbol: bayes-posterior
      props_binding: |
        Show Bayes formula, substituted values, and posterior interpretation.
explain:
  prompt: |
    Explain why high sensitivity can still produce moderate posterior when prevalence is low.
  socratic: true
  expected_misconceptions_surfaced:
    - "A positive test always means high probability"
    - "Sensitivity alone determines posterior"
