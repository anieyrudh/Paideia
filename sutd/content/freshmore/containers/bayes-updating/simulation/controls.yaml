controls:
  - id: prevalence-percent
    label: "Prior prevalence P(H)"
    kind: slider
    default: 10
    min: 1
    max: 60
    step: 1
  - id: sensitivity-percent
    label: "Sensitivity P(+|H)"
    kind: slider
    default: 95
    min: 50
    max: 99
    step: 1
  - id: specificity-percent
    label: "Specificity P(-|not H)"
    kind: slider
    default: 90
    min: 50
    max: 99
    step: 1
