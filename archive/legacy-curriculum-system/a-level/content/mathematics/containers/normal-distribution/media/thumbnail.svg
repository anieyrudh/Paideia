  <rect x="42" y="42" width="556" height="276" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="92" x2="548" y1="268" y2="268" stroke="#64748b" stroke-width="2"/>
  <line x1="320" x2="320" y1="66" y2="268" stroke="#94a3b8" stroke-dasharray="6 8" stroke-width="2"/>
  <path d="M92 268 C158 268 176 248 214 191 C254 132 279 84 320 84 C361 84 386 132 426 191 C464 248 482 268 548 268" fill="none" stroke="#1f5f8b" stroke-width="5"/>
  <path d="M214 268 C254 132 279 84 320 84 C361 84 386 132 426 268 Z" fill="#bfdbfe" opacity="0.78"/>
  <line x1="214" x2="214" y1="136" y2="268" stroke="#b42318" stroke-width="4"/>
  <line x1="426" x2="426" y1="136" y2="268" stroke="#027a48" stroke-width="4"/>
  <text x="320" y="306" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Normal Distribution</text>
  <text x="214" y="125" fill="#b42318" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">z=-1</text>
  <text x="426" y="125" fill="#027a48" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">z=1</text>
