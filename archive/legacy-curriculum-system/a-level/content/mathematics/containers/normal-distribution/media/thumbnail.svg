<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Normal distribution thumbnail</title>
  <desc id="desc">A normal curve with a shaded central interval and z-score markers.</desc>
