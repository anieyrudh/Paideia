<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 800 420">
  <title id="title">Confidence interval fallback</title>
  <desc id="desc">Static confidence interval diagram with formula and interpretation cue.</desc>
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="64" y="70" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="700">Mean confidence interval</text>
  <text x="64" y="112" fill="#475569" font-family="Arial, sans-serif" font-size="20">sample mean +/- z* x sigma/sqrt(n)</text>
  <line x1="100" x2="700" y1="230" y2="230" stroke="#64748b" stroke-width="3"/>
  <line x1="236" x2="564" y1="210" y2="210" stroke="#1f5f8b" stroke-width="18" stroke-linecap="round"/>
  <line x1="236" x2="236" y1="178" y2="242" stroke="#1f5f8b" stroke-width="9" stroke-linecap="round"/>
  <line x1="564" x2="564" y1="178" y2="242" stroke="#1f5f8b" stroke-width="9" stroke-linecap="round"/>
  <circle cx="400" cy="210" r="16" fill="#027a48"/>
  <line x1="342" x2="342" y1="156" y2="264" stroke="#b42318" stroke-width="7" stroke-linecap="round"/>
  <text x="214" y="288" fill="#334155" font-family="Arial, sans-serif" font-size="18">lower endpoint</text>
  <text x="370" y="288" fill="#334155" font-family="Arial, sans-serif" font-size="18">xbar</text>
  <text x="528" y="288" fill="#334155" font-family="Arial, sans-serif" font-size="18">upper endpoint</text>
  <text x="96" y="340" fill="#1f2937" font-family="Arial, sans-serif" font-size="18">Interpretation: the repeated-sampling method, not this fixed parameter, carries the confidence level.</text>
</svg>
