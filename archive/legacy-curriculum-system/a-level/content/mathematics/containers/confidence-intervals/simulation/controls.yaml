controls:
  - id: sample-mean
    label: "Sample mean"
    kind: slider
    default: 68
    min: 50
    max: 80
    step: 0.1
    unit: marks
  - id: population-standard-deviation
    label: "Population standard deviation"
    kind: slider
    default: 9
    min: 4
    max: 16
    step: 0.5
    unit: marks
  - id: sample-size
    label: "Sample size"
    kind: slider
    default: 36
    min: 16
    max: 100
    step: 1
  - id: confidence-level
    label: "Confidence level"
    kind: selector
    default: 0.95
    options:
      - label: "90%"
        value: 0.9
      - label: "95%"
        value: 0.95
      - label: "99%"
        value: 0.99
  - id: comparison-mean
    label: "Claimed population mean"
    kind: slider
    default: 65
    min: 50
    max: 80
    step: 0.1
    unit: marks
