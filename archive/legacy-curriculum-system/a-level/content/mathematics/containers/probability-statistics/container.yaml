package_predict:
  prompt: |
    A score distribution has many ordinary outcomes and a few high-score outcomes. Before comparing with the lab, predict what can happen if the high-score outcome becomes rarer but worth more marks.
  commit_format:
    kind: multiple-choice
    options:
      - "The expected score must fall whenever the high score becomes rarer."
      - "The expected score can stay close while the spread increases."
      - "The most likely score must become the same as the expected score."
      - "The hypothesis decision no longer needs a sample size."
    correct_index: 1
  rationale_required: true
