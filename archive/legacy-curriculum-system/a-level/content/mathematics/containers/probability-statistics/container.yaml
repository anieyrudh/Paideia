misconceptions:
  - name: "Independent and mutually exclusive mean the same thing"
    description: "Learners may treat independent events and mutually exclusive events as interchangeable, instead of recognising that independence concerns whether one event changes the probability of another."
    evidence_source: "OpenStax Introductory Statistics, Chapter 3 Probability Topics."
    surface_in_predict: false
  - name: "Expected value is the most likely outcome"
    description: "Learners may read E(X) as the outcome that should occur most often, rather than the long-run weighted average of all possible values."
    evidence_source: "OpenStax Introductory Statistics, Chapter 4 Discrete Random Variables."
    surface_in_predict: true
  - name: "A hypothesis-test decision depends only on the observed mean"
    description: "Learners may ignore variability and sample size, treating any difference between observed and null means as equally strong evidence."
    evidence_source: "OpenStax Introductory Statistics, Chapter 9 Hypothesis Testing with One Sample."
    surface_in_predict: true
