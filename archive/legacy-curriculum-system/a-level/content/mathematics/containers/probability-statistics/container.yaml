    prompt: |
      A school fundraiser game pays 0 points, 4 points, or a high-score prize. The organisers change the high-score prize from common and modest to rare and large. Decide whether the expected score, variance, and sample-mean test decision support the claim that the game became more generous.
    surface_form: "fundraiser prize game"
    same_concept_check: "Same concept: model the random variable, compute E(X) and Var(X), then compare an observed sample mean with the null mean using its standard error."
