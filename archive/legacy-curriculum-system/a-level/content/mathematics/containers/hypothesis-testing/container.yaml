misconceptions:
  - name: "p-value is the probability the null hypothesis is true"
    description: "Learners may read a small p-value as a direct posterior probability for H0, rather than as the probability of a result at least this extreme if H0 were true."
    evidence_source: "Singapore-Cambridge H2 Mathematics 9758 syllabus, Hypothesis testing; OpenStax Introductory Statistics, Hypothesis Testing with One Sample."
    surface_in_predict: true
  - name: "rejecting the null proves the alternative is true"
    description: "Learners may treat rejection as proof, instead of a decision against the null model at a stated significance level with assumptions still attached."
    evidence_source: "OpenStax Introductory Statistics, Chapter 9 Hypothesis Testing with One Sample."
    surface_in_predict: true
  - name: "only the observed difference matters"
    description: "Learners may ignore sample size and standard deviation, treating a fixed difference between sample mean and null mean as equally strong evidence in every setting."
    evidence_source: "OpenStax Introductory Statistics, Chapter 9 Hypothesis Testing with One Sample."
    surface_in_predict: true
