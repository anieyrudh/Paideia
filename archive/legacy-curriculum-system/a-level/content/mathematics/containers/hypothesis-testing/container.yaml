package_predict:
  prompt: |
    A sample mean is above the null mean. Before comparing with the lab, predict what happens to the strength of evidence when the sample size grows but the observed mean stays fixed.
  commit_format:
    kind: multiple-choice
    options:
      - "The evidence weakens because more observations make the average less surprising."
      - "The evidence strengthens because the standard error becomes smaller."
      - "The p-value is the probability that H0 is true."
      - "Any non-zero difference proves the alternative hypothesis."
    correct_index: 1
  rationale_required: true
