    prompt: |
      A clinic claims its mean waiting time is 18 minutes. A sample of 49 visits has mean 16.1 minutes. The population standard deviation is known to be 5.6 minutes. At the 5% significance level, decide whether there is evidence that the mean waiting time is less than 18 minutes.
    surface_form: "clinic waiting-time claim"
    same_concept_check: "Same concept: state H0 and H1, compute the sample-mean standard error, standardise the observed mean, compare with the critical region, and interpret the p-value decision in context."
