misconceptions:
  - name: "Capacitance depends on stored charge alone"
    description: "Learners may read C = Q/V as capacitance increasing whenever charge increases, instead of recognising capacitance is the ratio of charge separated per volt for a fixed physical capacitor."
    evidence_source: "OpenStax College Physics 2e, Chapter 19 Electric Potential and Electric Field."
    surface_in_predict: true
  - name: "Capacitors create charge rather than separate charge"
    description: "Learners may think a charged capacitor has gained net charge, rather than equal and opposite charge being separated onto the two plates by a supply."
    evidence_source: "OpenStax University Physics Volume 2, Chapter 8 Capacitance."
    surface_in_predict: true
  - name: "Capacitor discharge is linear"
    description: "Learners may expect voltage to fall by equal amounts in equal times, missing that a resistor-capacitor discharge removes equal fractions per time constant."
    evidence_source: "OpenStax University Physics Volume 2, Chapter 10 Direct-Current Circuits."
    surface_in_predict: false
