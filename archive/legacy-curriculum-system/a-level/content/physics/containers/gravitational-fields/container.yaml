misconceptions:
  - name: "Field strength is constant near every mass"
    description: "Learners may transfer the near-Earth approximation g is roughly constant to every radius around every mass, missing the inverse-square dependence on distance from the centre."
    evidence_source: "Singapore-Cambridge H2 Physics 9478 syllabus, Energy and Fields learning outcomes on field strength and inverse-square fields."
    surface_in_predict: true
  - name: "Potential energy must be positive"
    description: "Learners may expect gravitational potential and potential energy to be positive because they associate energy with a stored positive quantity, rather than using zero at infinity for attractive fields."
    evidence_source: "OpenStax University Physics Volume 1, Section 13.4 Gravitational Potential Energy and Total Energy."
    surface_in_predict: false
  - name: "A heavier probe changes the field strength at a point"
    description: "Learners may multiply by the probe mass too early and mistake force on a test mass for the field strength created by the source mass."
    evidence_source: "Singapore-Cambridge H2 Physics 9478 syllabus definition of gravitational field strength as force per unit mass."
    surface_in_predict: false
