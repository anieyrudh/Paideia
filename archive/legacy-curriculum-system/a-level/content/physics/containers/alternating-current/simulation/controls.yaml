controls:
  - id: source-voltage
    label: "Supply rms voltage"
    kind: slider
    kernel_binding: state.sourceVoltageRmsVolts
    unit: "V rms"
    min: 4
    max: 24
    step: 1
  - id: frequency
    label: "Frequency"
    kind: slider
    kernel_binding: state.frequencyHertz
    unit: Hz
    min: 20
    max: 200
    step: 5
  - id: resistance
    label: "Resistance"
    kind: slider
    kernel_binding: state.resistanceOhms
    unit: ohm
    min: 10
    max: 120
    step: 5
  - id: inductance
    label: "Inductance"
    kind: slider
    kernel_binding: state.inductanceMilliHenrys
    unit: mH
    min: 10
    max: 500
    step: 10
  - id: capacitance
    label: "Capacitance"
    kind: slider
    kernel_binding: state.capacitanceMicroFarads
    unit: microF
    min: 20
    max: 500
    step: 10
  - id: sample-time
    label: "Time marker"
    kind: slider
    kernel_binding: state.sampleTimeMilliseconds
    unit: ms
    min: 0
    max: 40
    step: 1
