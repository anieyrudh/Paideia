<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Measurement lab fallback">
  <rect width="320" height="180" fill="#fffdf7"/>
  <text x="32" y="46" fill="#13251e" font-family="Arial, sans-serif" font-size="22" font-weight="700">Measurement check</text>
  <text x="32" y="82" fill="#10201a" font-family="Arial, sans-serif" font-size="18">quantity = value ± uncertainty</text>
  <text x="32" y="112" fill="#10201a" font-family="Arial, sans-serif" font-size="18">unit check: distance ÷ time</text>
  <text x="32" y="144" fill="#1f5f8b" font-family="Arial, sans-serif" font-size="20" font-weight="700">complete records need units</text>
</svg>
