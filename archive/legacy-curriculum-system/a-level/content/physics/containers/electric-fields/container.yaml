misconceptions:
  - name: "Positive and negative charges feel force in the same field direction"
    description: "Learners may remember that electric field lines show force direction but omit the phrase 'on a positive test charge', causing them to put negative-charge force in the field direction."
    evidence_source: "OpenStax College Physics 2e, Chapter 18 Electric Charge and Electric Field."
    surface_in_predict: true
  - name: "Voltage is the same thing as field strength"
    description: "Learners may use volt and newton per coulomb interchangeably, instead of distinguishing electric potential as energy per charge from electric field strength as force per charge."
    evidence_source: "OpenStax College Physics 2e, Chapter 19 Electric Potential and Electric Field."
    surface_in_predict: true
  - name: "Field strength depends on the test charge"
    description: "Learners may think increasing the test charge makes the electric field at the point stronger, rather than only increasing the force experienced by that charge."
    evidence_source: "OpenStax College Physics 2e, Chapter 18 Electric Charge and Electric Field."
    surface_in_predict: false
