controls:
  - id: smooth-stays-smooth
    label: "Smooth week stays smooth"
    kind: slider
    min: 0.55
    max: 0.95
    step: 0.01
    unit: probability per week
  - id: congested-recovers
    label: "Congested week recovers"
    kind: slider
    min: 0.05
    max: 0.65
    step: 0.01
    unit: probability per week
  - id: initial-smooth
    label: "Initial smooth probability"
    kind: slider
    min: 0.05
    max: 0.95
    step: 0.01
    unit: probability
  - id: weeks
    label: "Forecast horizon"
    kind: slider
    min: 2
    max: 20
    step: 1
    unit: weeks
