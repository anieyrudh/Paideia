transfer_problems:
  - id: service-ticket-backlog
    prompt: |
      A weekly service desk has state S = stable backlog and B = backed-up. From S, 78% of weeks remain stable. From B, 35% recover to stable. Starting from 60% stable, compute the next two weekly mixes and the steady-state distribution. Explain why the long-run mix is not the same thing as no tickets moving.
    surface_form: "two-state service operations Markov chain"
    same_concept_check: "Same concept: multiply the state vector by the transition matrix, then solve the stationary distribution pi = P pi."
    rubric_path: problem-solving/steps.yaml
