misconceptions:
  - name: "Steady state means no individual transitions happen"
    description: "Learners may read a stable distribution as a frozen system rather than equal aggregate inflow and outflow."
    evidence_source: "Queue entry misconception map and standard Markov-chain steady-state interpretation."
    surface_in_predict: true
  - name: "The largest immediate transition always dominates long-run state"
    description: "Learners may choose the state with the strongest one-step arrow without accounting for both inflow and outflow."
    evidence_source: "Queue entry misconception map and transition-matrix analysis."
    surface_in_predict: true
