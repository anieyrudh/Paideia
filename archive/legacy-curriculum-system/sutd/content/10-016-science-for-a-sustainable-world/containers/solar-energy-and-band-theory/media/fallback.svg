<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Photon energy compared with band gap</title>
  <desc id="desc">A labelled fallback diagram showing photon energy, band gap, absorption, and heat loss.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <rect x="50" y="44" width="620" height="320" rx="14" fill="#f8fafc" stroke="#d8dee9"/>
  <line x1="136" y1="282" x2="584" y2="282" stroke="#395b82" stroke-width="8"/>
  <line x1="136" y1="154" x2="584" y2="154" stroke="#88419d" stroke-width="8"/>
  <text x="140" y="318" font-family="Inter, Arial, sans-serif" font-size="22" fill="#24415f">Valence band</text>
  <text x="140" y="134" font-family="Inter, Arial, sans-serif" font-size="22" fill="#5e2d72">Conduction band</text>
  <line x1="330" y1="282" x2="330" y2="154" stroke="#88419d" stroke-width="4"/>
  <text x="348" y="224" font-family="Inter, Arial, sans-serif" font-size="22" fill="#5e2d72">E_g threshold</text>
  <line x1="510" y1="306" x2="510" y2="128" stroke="#1b7f5f" stroke-width="6"/>
  <path d="M510 110 496 138h28Z" fill="#1b7f5f"/>
  <text x="418" y="342" font-family="Inter, Arial, sans-serif" font-size="22" fill="#1b7f5f">E_photon</text>
  <path d="M548 130 C586 106 622 110 644 140" fill="none" stroke="#b45309" stroke-width="5"/>
  <text x="520" y="92" font-family="Inter, Arial, sans-serif" font-size="20" fill="#b45309">excess to heat</text>
</svg>
