controls:
  - id: habitat-percent
    label: "Starting intact habitat"
    kind: slider
    min: 20
    max: 100
    step: 5
    unit: "%"
    default: 80
  - id: conversion-percent-per-year
    label: "Land-use conversion"
    kind: slider
    min: 0
    max: 6
    step: 0.25
    unit: "%/year"
    default: 2
  - id: restoration-percent-per-year
    label: "Restoration"
    kind: slider
    min: 0
    max: 4
    step: 0.25
    unit: "%/year"
    default: 0.5
  - id: sensitivity
    label: "Species sensitivity"
    kind: slider
    min: 0.6
    max: 2.2
    step: 0.1
    default: 1.4
