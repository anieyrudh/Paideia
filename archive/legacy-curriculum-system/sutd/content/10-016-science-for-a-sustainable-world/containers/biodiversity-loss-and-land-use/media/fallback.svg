<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Land-use biodiversity evidence chain</title>
  <desc id="desc">A fallback diagram connecting land-use conversion, habitat, species sensitivity, and biodiversity index.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <rect x="72" y="92" width="140" height="80" rx="10" fill="#fff7ed" stroke="#b45309"/>
  <rect x="290" y="92" width="140" height="80" rx="10" fill="#e7f5e8" stroke="#2f7d4f"/>
  <rect x="508" y="92" width="140" height="80" rx="10" fill="#eef6ff" stroke="#476582"/>
  <path d="M212 132h78M430 132h78" stroke="#476582" stroke-width="5"/>
  <text x="142" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18">land use</text>
  <text x="360" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18">habitat</text>
  <text x="578" y="138" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18">species</text>
  <text x="360" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">B = 100(H_t/H_0)^z</text>
</svg>
