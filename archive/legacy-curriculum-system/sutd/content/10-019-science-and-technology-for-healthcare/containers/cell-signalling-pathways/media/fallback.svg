<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Signalling cascade fallback visual</title>
  <desc id="desc">Wider cascade graph plus a sigmoidal response curve illustrating how ligand input maps to transcription-factor output.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <text x="40" y="44" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Cell signalling pathways</text>
  <text x="40" y="70" fill="#475569" font-family="Arial, sans-serif" font-size="15">Saturating responses keep the cascade output bounded and switch-like.</text>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="80" cy="200" r="26" fill="#2563eb"/><text x="80" y="206" fill="#fff">Lig</text>
    <circle cx="180" cy="200" r="26" fill="#059669"/><text x="180" y="206" fill="#fff">Rec</text>
    <circle cx="280" cy="200" r="26" fill="#f59e0b"/><text x="280" y="206" fill="#fff">Kin</text>
    <circle cx="380" cy="200" r="26" fill="#7c3aed"/><text x="380" y="206" fill="#fff">TF</text>
    <circle cx="280" cy="120" r="20" fill="#dc2626"/><text x="280" y="125" fill="#fff">Pho</text>
  </g>
  <g stroke-width="3" fill="none">
    <line x1="106" y1="200" x2="154" y2="200" stroke="#2563eb"/>
    <line x1="206" y1="200" x2="254" y2="200" stroke="#2563eb"/>
    <line x1="306" y1="200" x2="354" y2="200" stroke="#2563eb"/>
    <line x1="280" y1="140" x2="280" y2="174" stroke="#dc2626" stroke-dasharray="6 6"/>
  </g>
  <rect x="430" y="100" width="180" height="200" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="450" y1="280" x2="600" y2="280" stroke="#94a3b8"/>
  <line x1="450" y1="120" x2="450" y2="280" stroke="#94a3b8"/>
  <path d="M450,275 L470,272 L490,260 L510,230 L530,180 L550,150 L570,140 L600,135" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="520" y="120" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">TF output vs ligand</text>
  <text x="520" y="305" fill="#475569" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">ligand input</text>
</svg>
