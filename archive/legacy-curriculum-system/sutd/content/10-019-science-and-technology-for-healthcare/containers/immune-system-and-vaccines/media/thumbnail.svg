<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Herd immunity thumbnail</title>
  <desc id="desc">A coverage bar and Re indicator showing the threshold relationship.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <text x="20" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-size="19" font-weight="700">Herd immunity</text>
  <rect x="20" y="80" width="280" height="22" fill="#e2e8f0"/>
  <rect x="20" y="80" width="168" height="22" fill="#2563eb"/>
  <line x1="230" x2="230" y1="74" y2="110" stroke="#dc2626" stroke-width="3"/>
  <text x="20" y="74" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="11" font-weight="700">vaccinated 60%</text>
  <text x="200" y="74" fill="#dc2626" font-family="Arial, sans-serif" font-size="11" font-weight="700">p* = 75%</text>
  <text x="20" y="140" fill="#0f172a" font-family="Arial, sans-serif" font-size="14" font-weight="700">Re = R0 (1 - p) = 1.6</text>
  <text x="20" y="160" fill="#475569" font-family="Arial, sans-serif" font-size="11">below the threshold; outbreak still grows.</text>
</svg>
