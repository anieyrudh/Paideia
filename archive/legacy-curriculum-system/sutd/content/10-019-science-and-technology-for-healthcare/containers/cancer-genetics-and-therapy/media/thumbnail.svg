<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Cancer genetics thumbnail</title>
  <desc id="desc">Exponential clonal growth curve next to a Hill-shaped dose-response curve.</desc>
  <rect width="320" height="180" fill="#f8fafc"/>
  <text x="20" y="32" fill="#0f172a" font-family="Arial, sans-serif" font-size="19" font-weight="700">Cancer genetics</text>
  <text x="20" y="50" fill="#475569" font-family="Arial, sans-serif" font-size="11">Educational only.</text>
  <polyline points="30,140 50,138 70,134 90,128 110,118 130,104 150,84 170,60" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="30" y="76" fill="#dc2626" font-family="Arial, sans-serif" font-size="11" font-weight="700">clonal growth (1+s)^k g</text>
  <line x1="180" x2="180" y1="60" y2="160" stroke="#cbd5e1"/>
  <polyline points="190,150 210,148 230,140 250,120 270,90 290,72" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="190" y="86" fill="#2563eb" font-family="Arial, sans-serif" font-size="11" font-weight="700">Hill dose-response</text>
</svg>
