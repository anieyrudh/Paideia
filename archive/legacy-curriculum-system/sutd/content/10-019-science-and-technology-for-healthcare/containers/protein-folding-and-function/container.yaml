misconceptions:
  - name: "Sequence alone determines fold"
    description: "Learners may take Anfinsen's dogma to mean the primary sequence uniquely codes a fold, ignoring environment, ionic strength, chaperones, and the multiplicity of metastable conformers."
    evidence_source: "OpenStax Biology 2e; Dobson, Protein folding and misfolding (2003)."
    surface_in_predict: true
  - name: "Hydropathy alone predicts secondary structure"
    description: "Learners may equate a high hydropathy window with a definite alpha-helix or beta-sheet, ignoring backbone phi/psi constraints."
    evidence_source: "Kyte and Doolittle, J. Mol. Biol., 1982."
    surface_in_predict: true
