transfer_problems:
  - id: transmembrane-helix-detection
    prompt: |
      Given a 20-residue protein sequence, decide whether it contains a candidate transmembrane helix. Use a window-9 Kyte-Doolittle hydropathy profile, the +1.6 hydrophobic threshold, and the role of environment in folding to defend the answer.
    surface_form: "candidate transmembrane segment detection"
    same_concept_check: "Same concept: hydropathy windowing flags likely transmembrane segments; environment and chaperones decide the final fold."
