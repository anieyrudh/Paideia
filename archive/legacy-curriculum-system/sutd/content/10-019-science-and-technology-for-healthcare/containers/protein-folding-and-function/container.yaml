title: "Protein Folding and Function"
one_line_summary: "Edit a short amino-acid sequence and read its hydropathy profile to see how primary sequence biases the fold without uniquely determining it."
syllabus_ref: "SUTD 10.019 Science and Technology for Healthcare / Protein folding and function"
