    surface_in_predict: true
  - name: "Resting voltage depends on cell volume"
    description: "Learners may attribute the resting voltage to mechanical or volumetric properties rather than to permeability-weighted Nernst potentials."
    evidence_source: "OpenStax Biology, Membrane structure and function."
    surface_in_predict: true
