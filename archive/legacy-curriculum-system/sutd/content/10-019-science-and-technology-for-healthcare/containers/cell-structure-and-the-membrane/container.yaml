predict_at: package-level
package_predict:
  prompt: |
    A cell sits in a bath where [K+] outside is much lower than [K+] inside. The membrane is far more permeable to K+ than to Na+ or Cl-. Before reveal, what best describes the resting membrane potential?
  commit_format:
    kind: multiple-choice
    options:
      - "Strongly negative inside, close to the K+ Nernst potential"
      - "Strongly positive inside, close to the Na+ Nernst potential"
      - "Exactly zero, because the membrane is impermeable to most ions"
      - "Random, because resting potential depends only on cell volume"
    correct_index: 0
  rationale_required: true
