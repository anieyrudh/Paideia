transfer_problems:
  - id: red-blood-cell-tonicity
    prompt: |
      A red blood cell with surface area 140 micrometres squared and radius 4 micrometres sits in a saline bath. Walk through how the membrane's permeability to water versus the major ions controls the cell's resting voltage and how a change in the bath would change the flux direction.
    surface_form: "red blood cell tonicity and resting voltage"
    same_concept_check: "Same concept: selective permeability picks which ion's Nernst potential dominates the resting voltage; surface-area-to-volume ratio controls how fast the bath equilibrates."
