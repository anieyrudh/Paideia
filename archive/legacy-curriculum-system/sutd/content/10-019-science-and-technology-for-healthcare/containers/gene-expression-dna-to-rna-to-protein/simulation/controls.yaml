controls:
  - id: dna-preset
    label: "DNA preset"
    kind: selector
    default: methionine-start
  - id: inducer-concentration
    label: "Inducer concentration (uM)"
    kind: slider
    default: 1
    min: 0
    max: 10
    step: 0.1
  - id: hill-coefficient
    label: "Hill coefficient n"
    kind: slider
    default: 2
    min: 1
    max: 4
    step: 1
  - id: hill-threshold
    label: "Half-max threshold K (uM)"
    kind: slider
    default: 1
    min: 0.1
    max: 5
    step: 0.1
