    title: "Cancer Genetics and Therapy"
    relationship: "Driver mutations often shift transcription rates of oncogenes/tumour suppressors."
    status: planned
  - id: protein-folding-and-function
    title: "Protein Folding and Function"
    relationship: "The protein produced by translation must fold to function."
    status: available
siblings:
  - id: protein-folding-and-function
    title: "Protein Folding and Function"
