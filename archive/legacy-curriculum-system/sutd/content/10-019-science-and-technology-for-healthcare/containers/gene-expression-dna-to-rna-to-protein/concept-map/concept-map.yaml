    status: available
misconception_graph:
  nodes:
    - id: inducer-immediate
      label: "Inducer immediately increases protein"
    - id: hill-linear
      label: "Hill responses are linear"
    - id: equal-expression
      label: "All cells express all genes equally"
    - id: one-codon-per-amino
      label: "Each codon has exactly one amino acid"
