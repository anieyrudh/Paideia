    relationship: "Inducer concentration enters transcription as a Hill term."
    status: available
downstream:
  - id: cell-signalling-pathways
    title: "Cell Signalling Pathways"
    relationship: "Many signalling outputs are transcription factors that gate gene expression."
    status: planned
