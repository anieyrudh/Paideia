id: vector-transformations
title: "2D Matrix-Vector Transformation Explorer"
interaction_type: diagram-builder
kernel_deps:
  - core/sim-runtime
  - core/prediction-gate
  - core/linear-algebra
predict:
  prompt: |
    Matrix A sends e1 to (2, 0) and e2 to (1, 1). Before reveal, what is the x-coordinate of A(1, 1)?
  commit_format:
    kind: multiple-choice
    options: ["x = 1", "x = 2", "x = 3", "x = 4"]
  rationale_required: true
manipulate:
  controls:
    - id: a11
      label: "Basis e1 x output"
      kind: slider
      kernel_binding: state.a11
      bounds: { min: -3, max: 3, step: 1 }
    - id: a21
      label: "Basis e1 y output"
      kind: slider
      kernel_binding: state.a21
      bounds: { min: -3, max: 3, step: 1 }
    - id: a12
      label: "Basis e2 x output"
      kind: slider
      kernel_binding: state.a12
      bounds: { min: -3, max: 3, step: 1 }
    - id: a22
      label: "Basis e2 y output"
      kind: slider
      kernel_binding: state.a22
      bounds: { min: -3, max: 3, step: 1 }
    - id: input-x
      label: "Input x component"
      kind: slider
      kernel_binding: state.x
      bounds: { min: -3, max: 3, step: 1 }
    - id: input-y
      label: "Input y component"
      kind: slider
      kernel_binding: state.y
      bounds: { min: -3, max: 3, step: 1 }
observe:
  renderers:
    - id: transform-readout
      module: local
      symbol: VectorTransformations
      props_binding: "matrix entries + vector"
explain:
  prompt: |
    Use basis movement: where does e1 go? where does e2 go? Then combine those moves to explain T(x,y).
  socratic: true
  expected_misconceptions_surfaced:
    - "Columns are outputs for basis vectors"
