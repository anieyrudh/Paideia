misconceptions:
  - name: "Heat and temperature are the same quantity"
    description: |
      Learners may treat temperature as the amount of heat instead of the state variable whose difference drives heat transfer.
    evidence_source: "OpenStax University Physics Volume 2, Chapter 1 Temperature and Heat."
    surface_in_predict: true
  - name: "Radiation needs air or contact"
    description: |
      Learners may assume radiation is another form of convection rather than electromagnetic emission that depends on absolute temperature and emissivity.
    evidence_source: "OpenStax University Physics Volume 2, Chapter 1 Temperature and Heat."
    surface_in_predict: false
  - name: "Conduction ignores thickness"
    description: |
      Learners may focus on temperature difference and material but miss that a longer conduction path reduces heat-flow rate.
    evidence_source: "OpenStax University Physics Volume 2, Chapter 1 Temperature and Heat."
    surface_in_predict: false
