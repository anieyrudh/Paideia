<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" viewBox="0 0 640 360">
  <title id="title">Fallback confusion matrix threshold visual</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="48" y="54" fill="#101828" font-family="sans-serif" font-size="28" font-weight="700">Confusion matrix threshold</text>
  <rect x="64" y="92" width="220" height="86" fill="#d8f3dc" stroke="#1b4332" stroke-width="3"/>
  <rect x="284" y="92" width="220" height="86" fill="#ffe8cc" stroke="#b54708" stroke-width="3"/>
  <rect x="64" y="178" width="220" height="86" fill="#e7f0ff" stroke="#1f5f8b" stroke-width="3"/>
  <rect x="284" y="178" width="220" height="86" fill="#fde2e1" stroke="#b42318" stroke-width="3"/>
  <text x="92" y="145" fill="#1b4332" font-family="sans-serif" font-size="24">true positive</text>
  <text x="312" y="145" fill="#7a2e0e" font-family="sans-serif" font-size="24">false positive</text>
  <text x="92" y="231" fill="#1f5f8b" font-family="sans-serif" font-size="24">true negative</text>
  <text x="312" y="231" fill="#912018" font-family="sans-serif" font-size="24">false negative</text>
  <text x="64" y="316" fill="#344054" font-family="sans-serif" font-size="20">Cost = FP x C_FP + FN x C_FN</text>
</svg>
