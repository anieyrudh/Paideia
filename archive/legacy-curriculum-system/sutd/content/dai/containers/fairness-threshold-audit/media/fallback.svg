<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Static fairness audit fallback</title>
  <desc id="desc">A static comparison of recall gap and stakeholder harm gap.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="48" y="58" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Static audit summary</text>
  <g font-family="Arial, sans-serif" font-size="18">
    <text x="68" y="116" fill="#334155">Recall gap</text>
    <rect x="68" y="136" width="440" height="24" rx="12" fill="#e2e8f0"/>
    <rect x="68" y="136" width="176" height="24" rx="12" fill="#d97706"/>
    <text x="526" y="156" fill="#334155">40.0 pp</text>
    <text x="68" y="214" fill="#334155">Weighted harm gap</text>
    <rect x="68" y="234" width="440" height="24" rx="12" fill="#e2e8f0"/>
    <rect x="68" y="234" width="220" height="24" rx="12" fill="#7c3aed"/>
    <text x="526" y="254" fill="#334155">50 units</text>
  </g>
</svg>
