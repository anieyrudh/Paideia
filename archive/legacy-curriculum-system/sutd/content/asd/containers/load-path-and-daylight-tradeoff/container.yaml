  - bracing and aperture
branch: sutd
subject: asd
level: "Undergraduate"
module: "Architecture and Sustainable Design"
title: "Load Path and Daylight Tradeoff"
one_line_summary: "Tune one structural bay to see how bracing, window opening, and lateral load compete between a clear force path and useful daylight."
syllabus_ref: "SUTD ASD / structures and environmental systems"
prerequisites:
  - 2d-vectors
  - force-equilibrium
  - ratio-reasoning
aid_types:
  - simulation
  - transfer-problem
  - misconception-audit
predict_at: package-level
package_predict:
  prompt: |
    For a single bay with a useful window opening, which option is most likely to keep a clear load path while preserving usable daylight?
  commit_format:
    kind: multiple-choice
    options:
      - "Large opening with no brace"
      - "Medium opening with diagonal brace"
      - "Small opening with X-brace"
  rationale_required: true
