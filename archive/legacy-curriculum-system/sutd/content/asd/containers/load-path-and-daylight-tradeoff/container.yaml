misconceptions:
  - name: "Loads travel only vertically"
    description: "Learners ignore lateral demand and assume gravity columns are the whole structural story."
    evidence_source: "Introductory structural design texts distinguish gravity and lateral load paths."
    surface_in_predict: true
  - name: "More glass always improves performance"
    description: "Learners treat daylight as independent of stiffness, bracing, glare, and envelope constraints."
    evidence_source: "Architectural daylighting guidance frames window area as a tradeoff, not a monotonic good."
    surface_in_predict: true
