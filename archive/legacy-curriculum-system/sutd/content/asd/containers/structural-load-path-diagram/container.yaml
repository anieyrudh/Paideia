misconceptions:
  - name: "Loads disappear at supports"
    description: "Learners may stop tracing force once it reaches a base support, instead of checking equal and opposite reactions and overturning effects."
    evidence_source: "Introductory statics texts require support reactions in every complete free-body diagram."
    surface_in_predict: true
  - name: "All members carry equal force"
    description: "Learners may distribute load evenly across every visible member and miss that member force depends on geometry, direction, and connectivity."
    evidence_source: "Structural analysis teaching distinguishes load path topology from equal load sharing."
    surface_in_predict: true
