misconceptions:
  - id: misconception-any-loop
    claim: "Dynamic programming means any loop."
    correction: "A DP solution needs a state, recurrence, base cases, and reused overlapping subproblems."
  - id: misconception-changes-result
    claim: "Memoisation changes the recurrence result."
    correction: "Memoisation stores already computed state values; it changes work done, not the recurrence value."
