misconceptions:
  - name: "Stable means every state stops moving instantly"
    description: "Learners may read stability as zero velocity everywhere, rather than eventual return for nearby states under nonzero rates."
    evidence_source: "Strogatz, Nonlinear Dynamics and Chaos, 2015."
    surface_in_predict: true
  - name: "Only one eigenvalue matters"
    description: "Learners may check one eigenvalue and ignore a second positive direction or the real part of a complex pair."
    evidence_source: "Hirsch, Smale, and Devaney, Differential Equations, Dynamical Systems, and an Introduction to Chaos, 2013."
    surface_in_predict: true
