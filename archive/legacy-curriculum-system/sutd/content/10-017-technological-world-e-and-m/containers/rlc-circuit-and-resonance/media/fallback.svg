<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540">
  <title id="title">RLC resonance fallback diagram</title>
  <desc id="desc">Formula and schematic summary for series RLC resonance.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="64" y="64" width="832" height="412" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="104" y="130" fill="#0f172a" font-family="Arial, sans-serif" font-size="42" font-weight="700">Series RLC resonance</text>
  <text x="104" y="185" fill="#334155" font-family="Arial, sans-serif" font-size="30">f0 = 1 / (2 pi sqrt(LC))</text>
  <text x="104" y="232" fill="#334155" font-family="Arial, sans-serif" font-size="30">Z = R + j(XL - XC)</text>
  <text x="104" y="279" fill="#334155" font-family="Arial, sans-serif" font-size="30">At resonance: XL = XC, so |Z| = R</text>
  <path d="M550 180h82v54h60" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M692 234h44m16-48v96m20-96v96m16-48h58" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M846 234v-54H550" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <circle cx="550" cy="180" r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="6"/>
  <line x1="570" y1="376" x2="800" y2="376" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10"/>
  <line x1="620" y1="376" x2="620" y2="284" stroke="#7c3aed" stroke-width="18" stroke-linecap="round"/>
  <line x1="710" y1="376" x2="710" y2="468" stroke="#059669" stroke-width="18" stroke-linecap="round"/>
  <circle cx="800" cy="376" r="15" fill="#f97316"/>
</svg>
