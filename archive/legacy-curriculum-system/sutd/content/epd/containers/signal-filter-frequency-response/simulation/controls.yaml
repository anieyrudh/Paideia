controls:
  - id: filter-mode
    label: Filter mode
    kind: selector
    options:
      - value: low-pass
        label: "Low-pass: output across capacitor"
      - value: high-pass
        label: "High-pass: output across resistor"
  - id: resistance
    label: Resistance
    kind: slider
    min: 1
    max: 47
    step: 1
    unit: kOhm
  - id: capacitance
    label: Capacitance
    kind: slider
    min: 0.01
    max: 0.47
    step: 0.01
    unit: uF
  - id: probe-frequency
    label: Probe frequency
    kind: slider
    min: 20
    max: 20000
    step: 20
    unit: Hz
