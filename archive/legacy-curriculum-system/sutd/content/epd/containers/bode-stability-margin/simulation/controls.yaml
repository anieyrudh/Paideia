controls:
  - id: loop-gain
    label: Loop gain
    kind: slider
    min: 1
    max: 8
    step: 0.5
    unit: "times"
  - id: actuator-lag
    label: Actuator lag
    kind: slider
    min: 0.2
    max: 1.2
    step: 0.05
    unit: "s"
  - id: sensor-lag
    label: Sensor lag
    kind: slider
    min: 0.1
    max: 0.6
    step: 0.05
    unit: "s"
