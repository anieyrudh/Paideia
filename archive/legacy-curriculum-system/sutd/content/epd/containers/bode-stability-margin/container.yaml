misconceptions:
  - name: "Higher gain always improves stability"
    description: "Learners may expect a larger loop gain to make the feedback loop safer, missing that higher gain often moves gain crossover into a frequency range with more phase lag."
    evidence_source: "Astrom and Murray, Feedback Systems, frequency response and robustness chapters."
    surface_in_predict: true
  - name: "Magnitude alone decides closed-loop stability"
    description: "Learners may read only the 0 dB crossing and ignore the phase value that determines how close the loop is to -180 degrees at crossover."
    evidence_source: "Nise, Control Systems Engineering, Bode stability margin treatment."
    surface_in_predict: true
