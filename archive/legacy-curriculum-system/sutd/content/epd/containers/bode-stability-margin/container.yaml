      A drone altitude loop has an actuator lag of 0.55 s and a sensor-filter lag of 0.35 s. Choose a loop gain that preserves at least 30 degrees of phase margin while still improving response speed over a gain-1 baseline.
    surface_form: "drone altitude loop with sensor filtering"
    same_concept_check: "The surface changes from a generic loop to a drone altitude controller with different lags and a stricter margin target, but the decision still comes from reading gain crossover, phase margin, and gain margin on the open-loop Bode plot."
