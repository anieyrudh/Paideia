controls:
  - id: model
    label: "Model family"
    type: selector
    options: [binomial, geometric, poisson]
  - id: success-probability
    label: "Success probability"
    type: slider
    min: 0.05
    max: 0.95
    step: 0.01
  - id: trial-count
    label: "Trial count"
    type: slider
    min: 2
    max: 20
    step: 1
  - id: event-rate
    label: "Event rate"
    type: slider
    min: 0.5
    max: 10
    step: 0.1
