controls:
  - id: integral-mode
    label: "Integral mode"
    kind: selector
    default: double
    options:
      - label: "Double integral over a rectangle"
        value: double
      - label: "Triple integral as stacked layers"
        value: triple
  - id: density-kind
    label: "Density field"
    kind: selector
    default: constant
    options:
      - label: "Constant density"
        value: constant
      - label: "Ramp in x"
        value: ramp-x
      - label: "Tilted plane"
        value: tilted-plane
  - id: x-max
    label: "x upper bound"
    kind: slider
    default: 3
    min: 1
    max: 5
    step: 0.25
    unit: m
  - id: y-max
    label: "y upper bound"
    kind: slider
    default: 2
    min: 1
    max: 5
    step: 0.25
    unit: m
  - id: z-max
    label: "z layer height"
    kind: slider
    default: 2
    min: 1
    max: 4
    step: 0.25
    unit: m
