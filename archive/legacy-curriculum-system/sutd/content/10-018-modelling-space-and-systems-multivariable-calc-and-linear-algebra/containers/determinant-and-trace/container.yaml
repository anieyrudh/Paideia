title: "Determinant and Trace"
one_line_summary: "Read the determinant as the signed area scale factor and the trace as the sum of eigenvalues directly from a 2x2 matrix."
syllabus_ref: "SUTD 10.018 Modelling Space and Systems / Linear Algebra"
prerequisites:
  - matrices
