<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Determinant and trace fallback visual</title>
  <desc id="desc">A unit square (dashed) and its transformed parallelogram with labelled signed area; diagonal entries highlighted to show the trace.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <g stroke="#dbe4ee" stroke-width="1">
    <path d="M80 300H560"/>
    <path d="M80 250H560"/>
    <path d="M80 200H560"/>
    <path d="M80 150H560"/>
    <path d="M80 100H560"/>
    <path d="M120 320V60"/>
    <path d="M180 320V60"/>
    <path d="M240 320V60"/>
    <path d="M300 320V60"/>
    <path d="M360 320V60"/>
    <path d="M420 320V60"/>
    <path d="M480 320V60"/>
    <path d="M540 320V60"/>
  </g>
  <path d="M120 300L180 300L180 240L120 240Z" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M120 300L300 240L420 120L240 180Z" fill="#bfdbfe" fill-opacity="0.55" stroke="#2563eb" stroke-width="4"/>
  <text x="270" y="220" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="20" font-weight="700">det A = ad - bc</text>
  <text x="270" y="246" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="16">signed area scale factor</text>
  <circle cx="124" cy="296" r="6" fill="#0f172a"/>
  <text x="52" y="54" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">Determinant &amp; trace</text>
  <text x="52" y="88" fill="#475569" font-family="Arial, sans-serif" font-size="18">Read area scaling and eigenvalue sum directly from a 2x2 matrix.</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="424" y="236" width="172" height="80" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="436" y="262" fill="#0f172a" font-weight="700">tr A = a + d</text>
    <text x="436" y="286" fill="#334155">sum of eigenvalues</text>
    <text x="436" y="306" fill="#334155">discriminant T^2 - 4D classifies them</text>
  </g>
</svg>
