controls:
  - id: surface-kind
    label: "Surface"
    kind: selector
    default: bowl
    options:
      - label: "Bowl"
        value: bowl
      - label: "Saddle"
        value: saddle
      - label: "Tilted valley"
        value: tilted-valley
  - id: point-x
    label: "Point x"
    kind: slider
    default: 1
    min: -2
    max: 2
    step: 0.1
  - id: point-y
    label: "Point y"
    kind: slider
    default: 0.6
    min: -2
    max: 2
    step: 0.1
  - id: direction-degrees
    label: "Test direction angle"
    kind: slider
    default: 30
    min: 0
    max: 360
    step: 5
    unit: degrees
  - id: x-curvature
    label: "x curvature"
    kind: slider
    default: 1.2
    min: -2.5
    max: 2.5
    step: 0.1
  - id: y-curvature
    label: "y curvature"
    kind: slider
    default: 0.8
    min: -2.5
    max: 2.5
    step: 0.1
  - id: xy-coupling
    label: "xy coupling"
    kind: slider
    default: 0.35
    min: -1.5
    max: 1.5
    step: 0.05
