<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title">
  <title id="title">Fallback critical path diagram</title>
  <rect width="720" height="280" fill="#ffffff"/>
  <g stroke="#44636e" stroke-width="3" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#44636e"/></marker></defs>
    <line x1="145" y1="82" x2="210" y2="82"/>
    <line x1="315" y1="82" x2="380" y2="82"/>
    <line x1="485" y1="82" x2="555" y2="140"/>
  </g>
  <g fill="#edf4f7" stroke="#497180" stroke-width="2">
    <rect x="30" y="52" width="115" height="60" rx="8"/>
    <rect x="210" y="52" width="105" height="60" rx="8"/>
    <rect x="380" y="52" width="105" height="60" rx="8"/>
    <rect x="555" y="110" width="120" height="60" rx="8"/>
  </g>
  <text x="54" y="88" font-family="Inter,Arial" font-size="18" fill="#14242b">Start</text>
  <text x="235" y="88" font-family="Inter,Arial" font-size="18" fill="#14242b">Build</text>
  <text x="405" y="88" font-family="Inter,Arial" font-size="18" fill="#14242b">Test</text>
  <text x="581" y="146" font-family="Inter,Arial" font-size="18" fill="#14242b">Launch</text>
</svg>
