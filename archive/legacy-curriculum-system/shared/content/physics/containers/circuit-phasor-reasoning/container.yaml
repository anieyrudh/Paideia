transfer_problems:
  - id: motor-start-capacitor
    prompt: |
      A small AC motor winding is modelled as a 30 ohm resistor in series with a 0.18 H inductance on a 50 Hz supply. A 100 microfarad capacitor is added in series for correction. Decide whether the current leads or lags the voltage, calculate the rms current for a 12 V rms supply, and explain the phase relationship.
    surface_form: "motor start capacitor"
    same_concept_check: "Same concept: build the series impedance vector, use its magnitude for current, and use the sign of net reactance for phase."
