misconceptions:
  - name: "Phasors are physical rotating wires"
    description: "Learners may treat phasors as literal objects instead of vector bookkeeping for sinusoidal magnitude and phase."
    evidence_source: "OpenStax College Physics 2e, Chapter 23 Electromagnetic Induction, AC Circuits, and Electrical Technologies."
    surface_in_predict: true
  - name: "Resistance makes every AC circuit in phase"
    description: "Learners may notice resistance in the circuit but ignore that net reactance sets the phase angle."
    evidence_source: "OpenStax College Physics 2e, Chapter 23 Electromagnetic Induction, AC Circuits, and Electrical Technologies."
    surface_in_predict: true
  - name: "Current is used up around a circuit"
    description: "Learners may forget that the same series current passes through each component while component voltages differ in phase."
    evidence_source: "OpenStax College Physics 2e, Chapter 21 Circuits and DC Instruments."
    surface_in_predict: true
