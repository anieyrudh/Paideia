transfer_problems:
  - id: battery-life-claim
    prompt: |
      A battery maker claims the mean life is 10.0 hours. A quality team samples 49 batteries, finds a mean of 9.6 hours, and uses a known population standard deviation of 1.4 hours. At the 5% level, decide whether there is evidence that the mean life is lower than claimed.
    surface_form: "battery-life quality claim"
    same_concept_check: "Same concept: define a null mean, compute a standard error and z statistic, compare with the correct tail's critical boundary, then interpret reject or do-not-reject in context."
    rubric_path: problem-solving/battery-life-claim.md
