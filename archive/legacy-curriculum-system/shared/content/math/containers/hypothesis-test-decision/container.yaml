branch: shared
subject: math
level: "Shared core"
module: "Inference"
title: "Hypothesis Test Decision Lab"
one_line_summary: "Decide whether sample evidence falls in a rejection region for a normal mean test."
syllabus_ref: "Shared mathematics / Inference / One-sample hypothesis tests"
prerequisites:
  - probability-distributions
  - central-limit-theorem
aid_types:
