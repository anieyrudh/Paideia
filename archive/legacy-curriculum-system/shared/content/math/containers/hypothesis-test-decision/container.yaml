misconceptions:
  - name: "P-value is the probability the null is true"
    description: "Learners may read a small p-value as P(H0 is true) instead of as tail evidence calculated assuming the null model."
    evidence_source: "OpenStax Introductory Statistics 2e, Chapter 9 hypothesis testing discussion."
    surface_in_predict: true
  - name: "Significance means practical importance"
    description: "Learners may treat rejection as proof of a large or important real-world effect, even when the sample size makes a small difference statistically detectable."
    evidence_source: "OpenStax Introductory Statistics 2e, Chapter 9 hypothesis testing examples."
    surface_in_predict: true
  - name: "Any sample mean above the null rejects an upper-tail test"
    description: "Learners may compare only the direction of the observed mean to the null mean and skip the standard error, alpha, and critical boundary."
    evidence_source: "OpenStax Introductory Statistics 2e, Section 9.5 full hypothesis test examples."
    surface_in_predict: true
