    output_in_technical_md: true
misconceptions:
  - name: "A positive test always means high probability"
    description: |
      Learners may ignore the base rate and assume a positive result is enough to make the hypothesis very likely.
    evidence_source: "OpenIntro Statistics conditional probability; Khan Academy Bayes theorem examples."
    surface_in_predict: true
  - name: "Sensitivity alone determines posterior"
    description: |
      Learners may use P(+|H) as if it were P(H|+), ignoring false positives and the prior.
    evidence_source: "OpenIntro Statistics conditional probability."
    surface_in_predict: true
  - name: "False positives can be ignored when specificity is high"
    description: |
      Learners may forget that a large non-hypothesis population can still contribute many false positives.
    evidence_source: "OpenIntro Statistics conditional probability."
    surface_in_predict: true
sources:
