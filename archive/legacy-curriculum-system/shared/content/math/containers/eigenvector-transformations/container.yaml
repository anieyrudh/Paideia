transfer_problems:
  - id: modal-axis-decoupling
    prompt: |
      A two-room heat model has two independent modes: one pattern warms both rooms together and another warms one room while cooling the other. A disturbance pattern keeps the same shape over time while only its size changes. Explain why that pattern is an eigenvector, identify what the eigenvalue would describe in this context, and state what evidence would rule out the claim.
    surface_form: "thermal mode interpretation"
    same_concept_check: "Same concept: use preserved direction and one shared scale factor to decide whether a changing state pattern is an eigenvector."
    rubric_path: problem-solving/modal-axis-decoupling.md
