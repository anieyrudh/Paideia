name: Daily Coverage Report

on:
  schedule:
    # 10:00 UTC = 18:00 SGT
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "24"

jobs:
  regenerate:
    name: Regenerate docs/_meta/coverage.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Regenerate coverage table
        run: node scripts/regenerate-coverage.mjs

      - name: Open PR if coverage changed
        # NOTE: the canonical implementation of this action lives at
        # peter-evans/create-pull-request@v6. Some orgs vendor it under the
        # `actions/` namespace; swap the prefix if you fork or mirror it.
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(meta): regenerate container coverage table"
          title: "chore(meta): regenerate container coverage table"
          body: |
            Automated update of `docs/_meta/coverage.md` based on the current container statuses.

            Generated by `daily-coverage-report.yml`.
          branch: bot/coverage-report
          delete-branch: true
          add-paths: |
            docs/_meta/coverage.md
          labels: |
            auto-generated
            docs
