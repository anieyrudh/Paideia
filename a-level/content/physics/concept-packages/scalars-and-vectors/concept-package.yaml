schema_version: "1.0.0"
id: scalars-and-vectors
branch: a-level
subject: physics
title: "Scalars and Vectors"
one_line_summary: "Distinguish scalar and vector quantities, then combine coplanar vectors without treating arrows as ordinary numbers."
syllabus_ref: "9478 / Section I / 1(h)-1(j)"
level: "H2"
prerequisites: []
aid_types:
  - misconception-audit
predict_at: package-level
package_predict:
  prompt: |
    Two displacement arrows each have length 5 m. One points east and one points north. Before seeing any construction, what resultant magnitude do you expect?
  commit_format:
    kind: multiple-choice
    options:
      - "0 m"
      - "5 m"
      - "7.1 m"
      - "10 m"
  rationale_required: true
items:
  concept_card: concept-card.md
  misconceptions: misconceptions.md
  sources: sources.md
  sims: []
  transfer_problems: []
  assessments: []
status: content-only
authors:
  - "Anieyrudh R"
advisor_signoffs: []
misconceptions:
  - name: "Magnitude-only vector addition"
    description: |
      Learners add vector magnitudes as if direction were irrelevant, so perpendicular 5 m displacements are treated as 10 m rather than as a right-triangle resultant.
    evidence_source: "OpenStax University Physics Volume 1, Section 2.1; Van Deventer and Wittmann 2015, Phys. Rev. ST Phys. Educ. Res. 11, 010101."
    surface_in_predict: true
  - name: "Negative scalar does not reverse direction"
    description: |
      Learners may treat multiplication by a negative scalar as a change in length only, missing that the resulting vector is antiparallel to the original.
    evidence_source: "Barniol 2011, Physics Education Research Conference Proceedings, doi:10.1063/1.3680007."
    surface_in_predict: false
