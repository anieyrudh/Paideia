schema_version: "1.0.0"
id: scalars-and-vectors
branch: a-level
subject: physics
title: "Scalars and Vectors"
one_line_summary: "Distinguish scalar and vector quantities, then combine coplanar vectors without treating arrows as ordinary numbers."
syllabus_ref: "9478 / Section I / 1(h)-1(j)"
level: "H2"
prerequisites: []
aid_types:
  - simulation
  - misconception-audit
  - transfer-problem
predict_at: both
package_predict:
  prompt: |
    Two displacement arrows each have length 5 m. One points east and one points north. Before seeing any construction, what resultant magnitude do you expect?
  commit_format:
    kind: multiple-choice
    options:
      - "0 m"
      - "5 m"
      - "7.1 m"
      - "10 m"
  rationale_required: true
items:
  concept_card: concept-card.md
  misconceptions: misconceptions.md
  sources: sources.md
  sims:
    - id: resultant-magnitude
      title: "Resultant Magnitude Explorer"
      interaction_type: diagram-builder
      kernel_deps:
        - core/prediction-gate
      predict:
        prompt: |
          Two displacement arrows each have length 5 m. One points east and one points north. Before seeing any construction, what resultant magnitude do you expect?
        commit_format:
          kind: multiple-choice
          options:
            - "0 m"
            - "5 m"
            - "7.1 m"
            - "10 m"
          correct_index: 2
        rationale_required: true
      manipulate:
        controls:
          - id: vector-a-magnitude
            label: "Vector A magnitude"
            kind: slider
            kernel_binding: state.vectorA.magnitude
            bounds: { min: 0, max: 10, step: 0.5 }
          - id: vector-b-magnitude
            label: "Vector B magnitude"
            kind: slider
            kernel_binding: state.vectorB.magnitude
            bounds: { min: 0, max: 10, step: 0.5 }
          - id: angle-between
            label: "Angle between vectors"
            kind: slider
            kernel_binding: state.angleDegrees
            bounds: { min: 0, max: 180, step: 5 }
      observe:
        renderers:
          - id: resultant-vector-diagram
            module: "@paideia/a-level-physics-sims/resultant-magnitude"
            symbol: ResultantVectorDiagram
            props_binding: |
              Draw vector A east, vector B at the selected angle, and the geometric resultant from their component sum.
      explain:
        prompt: |
          Why does changing only the angle between two vectors change the resultant magnitude even when both vector lengths stay fixed?
        socratic: true
        expected_misconceptions_surfaced:
          - "Magnitude-only vector addition"
  transfer_problems:
    - id: field-trip-displacement
      prompt: |
        A class walks 300 m east from the school gate to a bus stop, then 400 m north to a field site. Decide whether the quantities should be combined as scalars or vectors, calculate the displacement magnitude from the school gate, and explain why total walking distance is not the same physical quantity as displacement.
      surface_form: "field-trip route"
      same_concept_check: "The surface changes from abstract arrows to a route context, but the required decision is still whether direction must be preserved before combining quantities."
      rubric_path: transfer/field-trip-displacement.md
  assessments: []
status: draft
authors:
  - "Anieyrudh R"
advisor_signoffs: []
misconceptions:
  - name: "Magnitude-only vector addition"
    description: |
      Learners add vector magnitudes as if direction were irrelevant, so perpendicular 5 m displacements are treated as 10 m rather than as a right-triangle resultant.
    evidence_source: "OpenStax University Physics Volume 1, Section 2.1; Van Deventer and Wittmann 2015, Phys. Rev. ST Phys. Educ. Res. 11, 010101."
    surface_in_predict: true
  - name: "Negative scalar does not reverse direction"
    description: |
      Learners may treat multiplication by a negative scalar as a change in length only, missing that the resulting vector is antiparallel to the original.
    evidence_source: "Barniol 2011, Physics Education Research Conference Proceedings, doi:10.1063/1.3680007."
    surface_in_predict: false
sources:
  - citation: "Singapore Examinations and Assessment Board. Singapore-Cambridge H2 A Level 9478 Physics syllabus for examination in 2027. 2025."
    url: "https://www.seab.gov.sg/files/A%20Level%20Syllabus%20Sch%20Cddts/2027/9478_y27_sy.pdf"
    publication_year: 2025
    license: "Copyright MOE & Cambridge University Press & Assessment"
    seab_alignment: matches
  - citation: "Moebs, W., Ling, S. J., and Sanny, J. University Physics Volume 1, Section 2.1 Scalars and Vectors. OpenStax, 2016."
    url: "https://openstax.org/books/university-physics-volume-1/pages/2-1-scalars-and-vectors"
    publication_year: 2016
    license: "CC BY-NC-SA"
    seab_alignment: matches
  - citation: "Barniol, P. Students' difficulties with unit vectors and scalar multiplication of a vector. Physics Education Research Conference Proceedings, 2011."
    url: "https://doi.org/10.1063/1.3680007"
    publication_year: 2011
    license: "Copyright American Institute of Physics"
    seab_alignment: n/a
language: en
