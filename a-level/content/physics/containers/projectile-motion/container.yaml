misconceptions:
  - name: "Horizontal and vertical motion affect each other directly"
    description: |
      Learners may think gravity slows the horizontal component because the projectile is falling, rather than treating horizontal velocity as constant when air resistance is neglected.
    evidence_source: "OpenStax University Physics Volume 1, Section 4.3 Projectile Motion."
    surface_in_predict: true
  - name: "A projectile needs a continuing forward force"
    description: |
      Learners may explain forward motion by inventing a continuing force in the launch direction after release, instead of using inertia and gravitational acceleration.
    evidence_source: "OpenStax University Physics Volume 1, Section 4.3 Projectile Motion."
    surface_in_predict: false
  - name: "Launch angle changes gravitational acceleration"
    description: |
      Learners may treat gravity as smaller or larger for different launch angles, instead of keeping acceleration fixed downward while the initial velocity components change.
    evidence_source: "Singapore Examinations and Assessment Board 9478 Physics syllabus, projectile motion learning outcomes."
    surface_in_predict: false
