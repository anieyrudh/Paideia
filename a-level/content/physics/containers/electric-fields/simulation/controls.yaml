controls:
  - id: source-charge
    label: Source charge
    unit: microC
    kind: slider
    min: -1
    max: 1
    step: 0.1
    default: 0.5
    color: red-blue
  - id: test-charge
    label: Test charge
    unit: nC
    kind: slider
    min: -30
    max: 30
    step: 5
    default: -20
    color: blue
  - id: separation
    label: Separation
    unit: cm
    kind: slider
    min: 5
    max: 25
    step: 1
    default: 15
    color: green
  - id: angle
    label: Position angle
    unit: deg
    kind: slider
    min: 0
    max: 180
    step: 5
    default: 0
    color: slate
