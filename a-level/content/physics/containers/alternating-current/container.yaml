misconceptions:
  - name: "RMS is an arithmetic average voltage"
    description: "Learners may average the positive and negative halves of an AC waveform and conclude that useful AC voltage is zero, instead of using root-mean-square value for equivalent heating effect."
    evidence_source: "OpenStax College Physics 2e, Chapter 23 Electromagnetic Induction, AC Circuits, and Electrical Technologies."
    surface_in_predict: true
  - name: "Higher frequency always means higher rms value"
    description: "Learners may confuse how often a sinusoid repeats with its amplitude-derived rms value; frequency changes reactance in a load but not the source rms conversion for fixed peak voltage."
    evidence_source: "Singapore-Cambridge H2 A Level Physics syllabus 9478, alternating current learning outcomes."
    surface_in_predict: true
  - name: "Resistance alone sets current in every AC circuit"
    description: "Learners may apply I = V/R directly to RLC loads and miss that in AC the current is set by impedance magnitude, including inductive and capacitive reactance."
    evidence_source: "OpenStax College Physics 2e, Chapter 23 Electromagnetic Induction, AC Circuits, and Electrical Technologies."
    surface_in_predict: false
  - name: "Leading and lagging phase are interchangeable"
    description: "Learners may identify a phase difference but not connect its sign to inductive or capacitive behaviour, so they cannot decide whether current leads or lags voltage."
    evidence_source: "OpenStax College Physics 2e, Chapter 23 Electromagnetic Induction, AC Circuits, and Electrical Technologies."
    surface_in_predict: false
