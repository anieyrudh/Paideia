      forceNewtons: 5
      displacementMetres: 2
      angleDegrees: 180
      elapsedSeconds: 2.5
      massKilograms: 3
      initialSpeedMetresPerSecond: 3
  - id: same-work-slower
    label: "Same work, slower"
    state:
      forceNewtons: 10
      displacementMetres: 3
      angleDegrees: 0
      elapsedSeconds: 6
      massKilograms: 4
      initialSpeedMetresPerSecond: 1
