      forceNewtons: 10
      displacementMetres: 3
      angleDegrees: 0
      elapsedSeconds: 2
      massKilograms: 4
      initialSpeedMetresPerSecond: 1
  - id: sideways-pull
    label: "Sideways pull"
    state:
      forceNewtons: 12
      displacementMetres: 3
      angleDegrees: 90
      elapsedSeconds: 3
      massKilograms: 4
      initialSpeedMetresPerSecond: 1
