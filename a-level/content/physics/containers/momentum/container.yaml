package_predict:
  prompt: |
    Two carts collide head-on on a low-friction track. Before revealing the lab, predict which statement about total momentum is correct for the isolated two-cart system.
  commit_format:
    kind: multiple-choice
    options:
      - "Total momentum can change because speeds change during impact."
      - "Total momentum stays constant if external horizontal force is negligible."
      - "Momentum is conserved only when masses are equal."
      - "Momentum is not conserved in any real collision."
    correct_index: 1
  rationale_required: true
