misconceptions:
  - name: "Momentum and force are the same quantity"
    description: "Learners may describe energy as disappearing when negative work reduces kinetic energy instead of tracking transfer out of the kinetic store."
    evidence_source: "OpenStax University Physics Volume 1, Section 8.1 Linear Momentum and Force."
    surface_in_predict: false
  - name: "Momentum conservation needs equal masses"
    description: "Learners may multiply force by displacement without using the force component along the displacement, or may choose the 30 W distractor by treating power as the same quantity as work."
    evidence_source: "OpenStax University Physics Volume 1, Section 8.1 Linear Momentum and Force."
    surface_in_predict: false
  - name: "Conservation means each object keeps its own momentum"
    description: "Learners may choose a work answer without dividing by time, or may compare power outputs without considering the time taken for the same energy transfer."
    evidence_source: "OpenStax University Physics Volume 1, Section 8.3 Elastic Collisions in One Dimension."
    surface_in_predict: true
