package_predict:
  prompt: |
    Two identical waves meet in phase. Before comparing with the lab, what happens to the displacement where their crests overlap?
  commit_format:
    kind: multiple-choice
    options:
      - "They cancel to zero"
      - "They add to double the displacement"
      - "The wavelength doubles"
      - "The frequency halves"
    correct_index: 1
  rationale_required: true
