misconceptions:
  - name: "Energy is lost rather than transferred"
    description: "Learners may describe energy as disappearing when negative work reduces kinetic energy instead of tracking transfer out of the kinetic store."
    evidence_source: "OpenStax University Physics Volume 1, Section 7.1 Work."
    surface_in_predict: false
  - name: "Work equals force regardless of displacement direction"
    description: "Learners may multiply force by displacement without using the force component along the displacement, or may choose the 30 W distractor by treating power as the same quantity as work."
    evidence_source: "OpenStax University Physics Volume 1, Section 7.1 Work."
    surface_in_predict: false
  - name: "Power is the same thing as energy"
    description: "Learners may choose a work answer without dividing by time, or may compare power outputs without considering the time taken for the same wave behaviour."
    evidence_source: "OpenStax University Physics Volume 1, Section 7.4 Power."
    surface_in_predict: true
