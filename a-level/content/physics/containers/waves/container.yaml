package_predict:
  prompt: |
    A 10 N pull moves a trolley 3.0 m in the same direction as the motion in 2.0 s. Before revealing the lab, which work and average power statement is correct?
  commit_format:
    kind: multiple-choice
    options:
      - "0 J and 0 W"
      - "30 J and 15 W"
      - "30 J and 30 W"
      - "60 J and 15 W"
    correct_index: 1
  rationale_required: true
