misconceptions:
  - name: "Amplitude and wavelength are interchangeable"
    description: "Learners may think a larger resultant displacement means the wavelength has increased."
    evidence_source: "OpenStax College Physics 2e, Chapter 16 Wave Superposition and Interference."
    surface_in_predict: false
  - name: "Constructive interference changes the frequency"
    description: "Learners may treat a larger resultant displacement as a change in the timing of the wave rather than a displacement sum."
    evidence_source: "OpenStax College Physics 2e, Chapter 16 Wave Superposition and Interference."
    surface_in_predict: false
  - name: "Destructive interference destroys energy"
    description: "Learners may say a zero resultant means waves or energy disappear instead of recognising local cancellation of displacement."
    evidence_source: "OpenStax College Physics 2e, Chapter 16 Wave Superposition and Interference."
    surface_in_predict: true
