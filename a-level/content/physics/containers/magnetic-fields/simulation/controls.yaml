controls:
  - id: field-strength
    label: Magnetic field strength
    kind: slider
    unit: mT
    bounds: { min: 5, max: 120, step: 5 }
    default: 40
  - id: current
    label: Current
    kind: slider
    unit: A
    bounds: { min: 0, max: 12, step: 0.5 }
    default: 6
  - id: active-length
    label: Active wire length
    kind: slider
    unit: cm
    bounds: { min: 2, max: 20, step: 1 }
    default: 8
  - id: angle
    label: Angle to field
    kind: slider
    unit: deg
    bounds: { min: 0, max: 90, step: 5 }
    default: 90
  - id: particle-charge
    label: Particle charge
    kind: slider
    unit: microC
    bounds: { min: -8, max: 8, step: 1 }
    default: 2
  - id: particle-speed
    label: Particle speed
    kind: slider
    unit: km s^-1
    bounds: { min: 0.2, max: 5, step: 0.2 }
    default: 1
