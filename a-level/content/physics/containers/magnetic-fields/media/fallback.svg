<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Magnetic force fallback diagram</title>
  <desc id="desc">Field into the page, current to the right, and magnetic force up the page.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="48" y="44" width="544" height="272" rx="22" fill="#f8fbff" stroke="#cbd5e1" stroke-width="4"/>
  <g fill="#dbeafe">
    <circle cx="128" cy="110" r="18"/><circle cx="224" cy="110" r="18"/><circle cx="320" cy="110" r="18"/><circle cx="416" cy="110" r="18"/><circle cx="512" cy="110" r="18"/>
    <circle cx="128" cy="196" r="18"/><circle cx="224" cy="196" r="18"/><circle cx="320" cy="196" r="18"/><circle cx="416" cy="196" r="18"/><circle cx="512" cy="196" r="18"/>
  </g>
  <g fill="#1e3a8a" font-family="Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle">
    <text x="128" y="119">x</text><text x="224" y="119">x</text><text x="320" y="119">x</text><text x="416" y="119">x</text><text x="512" y="119">x</text>
    <text x="128" y="205">x</text><text x="224" y="205">x</text><text x="320" y="205">x</text><text x="416" y="205">x</text><text x="512" y="205">x</text>
  </g>
  <defs>
    <marker id="wire" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f5f8b"/>
    </marker>
    <marker id="force" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c2410c"/>
    </marker>
  </defs>
  <line x1="170" y1="250" x2="450" y2="250" stroke="#1f5f8b" stroke-linecap="round" stroke-width="14" marker-end="url(#wire)"/>
  <line x1="450" y1="250" x2="450" y2="132" stroke="#c2410c" stroke-linecap="round" stroke-width="13" marker-end="url(#force)"/>
  <text x="177" y="286" fill="#1f5f8b" font-family="Arial, sans-serif" font-size="22" font-weight="800">current</text>
  <text x="466" y="138" fill="#c2410c" font-family="Arial, sans-serif" font-size="22" font-weight="800">force</text>
  <text x="66" y="74" fill="#10201a" font-family="Arial, sans-serif" font-size="18" font-weight="800">Magnetic field into page</text>
</svg>
