schema_version: "1.0.0"
id: magnetic-fields
aliases:
  - magnetic flux density
  - motor effect
  - force on a moving charge
branch: a-level
subject: physics
level: "H2"
module: "Electricity and Magnetism"
title: "Magnetic Fields"
one_line_summary: "Use Fleming's left-hand rule and magnetic-force formulae to connect field direction, current, moving charges, and circular paths."
syllabus_ref: "9478 / Section V / Electricity and Magnetism"
prerequisites:
  - electric-fields
  - circular-motion
  - resolving-vectors
aid_types:
  - simulation
  - misconception-audit
  - transfer-problem
predict_at: both
package_predict:
  prompt: |
    A wire carries conventional current to the right while a magnetic field goes into the page. Before comparing with the result, which way is the force on the wire?
  commit_format:
    kind: multiple-choice
    options:
      - "Up the page."
      - "Down the page."
      - "Along the current, to the right."
      - "There is no force because the field is perpendicular to the current."
    correct_index: 0
  rationale_required: true
package_explain:
  prompt: |
    Why is the magnetic force perpendicular to both the current or velocity direction and the magnetic field direction?
  socratic: true
  expected_misconceptions_surfaced:
    - "Magnetic force acts along the field line"
    - "Stationary charges feel magnetic force"
    - "A negative charge curves the same way as a positive charge"
