misconceptions:
  - name: "Magnetic force acts along the field line"
    description: "Learners may copy electric-field intuition and draw the force parallel to magnetic field lines instead of perpendicular to both field and current or velocity."
    evidence_source: "OpenStax University Physics Volume 2, Chapter 11 Magnetic Forces and Fields."
    surface_in_predict: true
  - name: "Stationary charges feel magnetic force"
    description: "Learners may remember that charge is required but omit the velocity condition in F = |q|vB sin theta."
    evidence_source: "OpenStax University Physics Volume 2, Chapter 11 Magnetic Forces and Fields."
    surface_in_predict: false
  - name: "Negative charges curve the same way as positive charges"
    description: "Learners may apply Fleming's left-hand rule to velocity without reversing the force direction for a negative charge."
    evidence_source: "OpenStax University Physics Volume 2, Chapter 11 Magnetic Forces and Fields."
    surface_in_predict: true
