transfer_problems:
  - id: velocity-selector
    prompt: |
      A positive ion enters a region where a uniform magnetic field is directed into the page. It moves to the right at 2.5 x 10^3 m s^-1 with charge 3.0 microC. Find the magnetic force magnitude when B = 0.060 T, state the force direction, and explain what changes for a negative ion.
    surface_form: "charged particle entering a magnetic-field region"
    same_concept_check: "Same concept: identify velocity, field direction, charge sign, and perpendicular force before using F = |q|vB sin theta."
    rubric_path: problem-solving/velocity-selector.md
