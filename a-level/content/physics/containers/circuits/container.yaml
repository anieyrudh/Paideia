misconceptions:
  - name: "Current is used up by components"
    description: "Learners may think current is consumed as it passes through resistors, rather than recognising charge flow is conserved at junctions."
    evidence_source: "OpenStax College Physics 2e, Chapter 20 Electric Current, Resistance, and Ohm's Law."
    surface_in_predict: true
  - name: "A fixed-voltage battery fixes current"
    description: "Learners may treat a voltage source as forcing the same current in every connected circuit, instead of calculating current from the external resistance."
    evidence_source: "OpenStax College Physics 2e, Chapter 21 Circuits and DC Instruments."
    surface_in_predict: true
  - name: "Adding any resistor always increases total resistance"
    description: "Learners may overgeneralise series behaviour and miss that adding a parallel branch creates an additional path, lowering equivalent resistance."
    evidence_source: "OpenStax College Physics 2e, Chapter 21 Circuits and DC Instruments."
    surface_in_predict: true
