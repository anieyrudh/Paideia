      A phone charger supplies 5.0 V to two parallel paths: a 20 ohm charging path and a 100 ohm indicator path. A 2.0 ohm protective resistor is in series with the parallel pair. Find the total current and explain which path carries more current.
    surface_form: "phone charger branch circuit"
    same_concept_check: "Same concept: reduce the parallel paths, add the series resistance, then use Ohm's law and branch current relations."
