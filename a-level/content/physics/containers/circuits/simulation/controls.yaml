controls:
  - id: supply-voltage
    label: "Supply voltage"
    kind: slider
    unit: V
    default: 9
    min: 3
    max: 12
    step: 0.5
  - id: series-resistance
    label: "Series resistor"
    kind: slider
    unit: ohm
    default: 20
    min: 5
    max: 60
    step: 1
  - id: branch-a-resistance
    label: "Upper branch resistor"
    kind: slider
    unit: ohm
    default: 40
    min: 10
    max: 100
    step: 1
  - id: branch-b-resistance
    label: "Lower branch resistor"
    kind: slider
    unit: ohm
    default: 60
    min: 10
    max: 100
    step: 1
