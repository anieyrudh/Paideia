misconceptions:
  - name: "Sine-cosine swap"
    description: |
      Learners memorise component formulae without linking sine and cosine to opposite and adjacent sides, so the horizontal and vertical components are swapped.
    evidence_source: "OpenStax University Physics Volume 1, Section 2.2 Coordinate Systems and Components of a Vector."
    surface_in_predict: true
  - name: "Components as extra forces"
    description: |
      Learners may treat components as additional vectors added to the original vector rather than as a replacement representation of the same vector.
    evidence_source: "OpenStax University Physics Volume 1, Section 2.2 Coordinate Systems and Components of a Vector."
    surface_in_predict: false
