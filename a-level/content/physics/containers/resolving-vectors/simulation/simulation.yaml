id: component-resolution
title: "Component Resolution Explorer"
interaction_type: diagram-builder
kernel_deps:
  - core/numerical-math
predict:
  prompt: |
    A 10 N force acts at 30 degrees above the horizontal. Before revealing the components, which horizontal component is closest?
  commit_format:
    kind: multiple-choice
    options:
      - "5.0 N"
      - "8.7 N"
      - "10.0 N"
      - "11.5 N"
  rationale_required: true
manipulate:
  controls:
    - id: magnitude
      label: "Vector magnitude"
      kind: slider
      kernel_binding: "core/numerical-math.scalar"
      bounds:
        min: 0
        max: 20
        step: 0.5
    - id: angle
      label: "Angle above horizontal"
      kind: slider
      kernel_binding: "core/numerical-math.angle"
      bounds:
        min: 0
        max: 90
        step: 5
observe:
  renderers:
    - id: component-resolution
      module: "@paideia/a-level-physics-sims/resolving-vectors"
      symbol: "ResolvingVectorsSim"
      props_binding: "state -> component vector diagram and formula readout"
explain:
  prompt: "Explain why the horizontal component uses cosine when the angle is measured from the horizontal."
  socratic: true
  expected_misconceptions_surfaced:
    - "Sine-cosine swap"
    - "Components as extra forces"
