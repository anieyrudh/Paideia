controls:
  - id: vector-magnitude
    label: "Vector magnitude"
    kind: slider
    kernel_binding: state.magnitudeNewtons
    default: 10
    unit: N
    min: 0
    max: 20
    step: 0.5
  - id: angle-above-horizontal
    label: "Angle above horizontal"
    kind: slider
    kernel_binding: state.angleDegrees
    default: 30
    unit: degrees
    min: 0
    max: 90
    step: 5
