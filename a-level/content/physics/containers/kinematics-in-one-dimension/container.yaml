misconceptions:
  - name: "Velocity and acceleration must have the same sign"
    description: |
      Learners often think negative acceleration means the object must be moving in the negative direction, rather than recognising acceleration as the rate of change of velocity.
    evidence_source: "OpenStax University Physics Volume 1, Section 3.4 Motion with Constant Acceleration."
    surface_in_predict: false
  - name: "Average velocity equals final velocity"
    description: |
      In accelerated motion, learners may use final velocity multiplied by time as displacement, ignoring that the velocity changed during the interval.
    evidence_source: "OpenStax University Physics Volume 1, Section 3.4 Motion with Constant Acceleration."
    surface_in_predict: true
  - name: "Distance and displacement are interchangeable"
    description: |
      Learners may treat the size of a path length and signed change in position as identical even when direction or reversal matters.
    evidence_source: "Singapore Examinations and Assessment Board 9478 Physics syllabus, kinematics learning outcomes for distance, displacement, speed, velocity, and acceleration."
    surface_in_predict: false
