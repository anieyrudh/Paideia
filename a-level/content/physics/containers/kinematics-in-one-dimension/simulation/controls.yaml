controls:
  - id: initial-velocity
    label: "Initial velocity"
    kind: slider
    unit: "m s^-1"
    default: 0
    min: -5
    max: 12
    step: 0.5
  - id: acceleration
    label: "Acceleration"
    kind: slider
    unit: "m s^-2"
    default: 2
    min: -4
    max: 6
    step: 0.5
  - id: elapsed-time
    label: "Elapsed time"
    kind: slider
    unit: s
    default: 3
    min: 0
    max: 8
    step: 0.5
