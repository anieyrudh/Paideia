<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 180">
  <title id="title">Kinematics in one dimension thumbnail</title>
  <desc id="desc">A trolley on a line with a curved displacement-time trace and velocity labels.</desc>
  <rect width="320" height="180" rx="18" fill="#fffdf7"/>
  <path d="M34 134 C92 132 142 112 188 78 C222 54 260 42 292 36" fill="none" stroke="#1f5f8b" stroke-width="8" stroke-linecap="round"/>
  <line x1="32" y1="138" x2="294" y2="138" stroke="#10201a" stroke-width="3"/>
  <rect x="104" y="112" width="64" height="24" rx="6" fill="#f0b429"/>
  <circle cx="120" cy="138" r="7" fill="#10201a"/>
  <circle cx="152" cy="138" r="7" fill="#10201a"/>
  <text x="30" y="34" fill="#10201a" font-family="Arial, sans-serif" font-size="22" font-weight="700">s = ut + 1/2at^2</text>
