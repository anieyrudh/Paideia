transfer_problems:
  - id: orbital-speed-check
    prompt: |
      A satellite of mass 120 kg moves at 7600 m/s in a circular orbit of radius 6.8 x 10^6 m. Find the inward acceleration, the gravitational force required, and state how the force demand changes if the same satellite moves faster at the same orbital radius.
    surface_form: "orbital-motion"
    same_concept_check: "Same concept: constant speed still requires inward acceleration and an inward resultant force, but the transfer now uses gravity and orbital scale rather than a track object with classroom-scale sliders."
    rubric_path: problem-solving/orbital-speed-check.md
