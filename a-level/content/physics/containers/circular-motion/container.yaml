schema_version: "1.0.0"
id: circular-motion
aliases:
  - uniform circular motion
  - centripetal acceleration
  - centripetal force
branch: a-level
subject: physics
level: "H2"
module: "Forces and Motion"
title: "Circular Motion"
one_line_summary: "Relate constant speed on a circular path to inward acceleration and resultant force."
syllabus_ref: "9478 / Section II / Circular Motion"
prerequisites:
  - resolving-vectors
  - kinematics-in-one-dimension
  - forces-and-equilibrium
aid_types:
  - simulation
  - misconception-audit
  - transfer-problem
predict_at: both
package_predict:
  prompt: |
    A rider moves at constant speed around a circular track. Before revealing the vectors, predict the direction of the acceleration and resultant force.
  commit_format:
    kind: multiple-choice
    options:
      - "Toward the centre of the circle."
      - "Forward along the tangent because the rider is moving."
      - "Outward away from the centre."
      - "Zero because the speed is constant."
    correct_index: 0
  rationale_required: true
package_explain:
  prompt: |
    Why can speed stay constant while velocity and acceleration keep changing direction in circular motion?
  socratic: true
  expected_misconceptions_surfaced:
    - "Constant speed means zero acceleration"
    - "Centripetal force is an extra new force"
    - "Circular motion force points outward"
