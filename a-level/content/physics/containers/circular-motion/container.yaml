misconceptions:
  - name: "Centripetal force is an extra new force"
    description: "Learners may draw a separate centripetal force in addition to real forces instead of treating it as the inward resultant force."
    evidence_source: "OpenStax University Physics Volume 1, Section 6.3 Centripetal Force."
    surface_in_predict: false
  - name: "Constant speed means zero acceleration"
    description: "Learners may focus only on speed magnitude and miss that velocity changes direction continuously in circular motion."
    evidence_source: "OpenStax University Physics Volume 1, Section 4.4 Uniform Circular Motion."
    surface_in_predict: true
  - name: "Circular motion force points outward"
    description: "Learners may interpret the outward sensation in a turning frame as an outward force in an inertial force diagram."
    evidence_source: "OpenStax University Physics Volume 1, Section 6.3 Centripetal Force."
    surface_in_predict: true
