misconceptions:
  - name: "Amplitude changes the period for every oscillator"
    description: "Learners may assume a wider swing must take longer even in the ideal simple harmonic spring model where amplitude is not in the period formula."
    evidence_source: "OpenStax College Physics 2e, Section 16.3 Simple Harmonic Motion: A Special Periodic Motion."
    surface_in_predict: true
  - name: "Acceleration is greatest at equilibrium"
    description: "Learners may connect greatest speed at equilibrium to greatest acceleration, missing that restoring acceleration is proportional to displacement from equilibrium."
    evidence_source: "OpenStax University Physics Volume 1, Section 15.1 Simple Harmonic Motion."
    surface_in_predict: false
  - name: "Zero displacement means zero speed and zero energy"
    description: "Learners may treat the equilibrium position as a rest state instead of the point where kinetic energy is maximum in the ideal oscillator."
    evidence_source: "OpenStax University Physics Volume 1, Section 15.2 Energy in Simple Harmonic Motion."
    surface_in_predict: false
