controls:
  - id: mass
    label: "Mass"
    kind: slider
    kernel_binding: state.massKilograms
    unit: kg
    min: 0.5
    max: 5
    step: 0.1
  - id: spring-constant
    label: "Spring stiffness"
    kind: slider
    kernel_binding: state.springConstantNewtonsPerMetre
    unit: "N m^-1"
    min: 4
    max: 80
    step: 1
  - id: amplitude
    label: "Amplitude"
    kind: slider
    kernel_binding: state.amplitudeMetres
    unit: m
    min: 0.1
    max: 2
    step: 0.05
  - id: phase
    label: "Starting phase"
    kind: slider
    kernel_binding: state.phaseRadians
    unit: rad
    min: 0
    max: 6.28
    step: 0.1
  - id: time
    label: "Time marker"
    kind: slider
    kernel_binding: state.timeSeconds
    unit: s
    min: 0
    max: 8
    step: 0.05
