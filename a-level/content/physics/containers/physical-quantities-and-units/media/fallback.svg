<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc">
  <title id="title">Dimensional consistency fallback</title>
  <desc id="desc">A static dimensional consistency check for distance equals speed plus acceleration.</desc>
  <rect width="480" height="260" rx="24" fill="#f8fafc"/>
  <rect x="40" y="44" width="400" height="172" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="70" y="90" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">distance = speed + acceleration</text>
  <text x="70" y="134" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="20">m  ?=  m s⁻¹ + m s⁻²</text>
  <text x="70" y="178" fill="#be123c" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Impossible as written</text>
</svg>
