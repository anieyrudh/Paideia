<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Dimensional consistency fallback</title>
  <desc id="desc">Static fallback showing that each side of an equation must have matching dimensions.</desc>
  <rect width="640" height="360" rx="28" fill="#f8fafc"/>
  <rect x="70" y="70" width="500" height="220" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="100" y="126" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Dimensional consistency</text>
  <text x="100" y="178" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="24">Only add or equate matching dimensions.</text>
  <text x="100" y="232" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="26">s = ut + 1/2at²  →  L = L + L</text>
  <text x="100" y="268" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="26">s = ut + 1/2at   →  L ≠ L + LT⁻¹</text>
</svg>
