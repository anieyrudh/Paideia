<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Unit consistency detector fallback">
  <rect width="320" height="180" fill="#fffdf7"/>
  <text x="30" y="44" fill="#13251e" font-family="Arial, sans-serif" font-size="22" font-weight="700">Unit detector</text>
  <text x="30" y="84" fill="#10201a" font-family="Arial, sans-serif" font-size="18">velocity: m s^-1 → L T^-1</text>
  <text x="30" y="116" fill="#10201a" font-family="Arial, sans-serif" font-size="18">displacement: m → L</text>
  <text x="30" y="148" fill="#b42318" font-family="Arial, sans-serif" font-size="18" font-weight="700">Do not add unlike units.</text>
</svg>
