<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Unit dependency fallback">
  <rect width="320" height="180" fill="#fffdf7"/>
  <text x="30" y="42" fill="#13251e" font-family="Arial, sans-serif" font-size="22" font-weight="800">Follow the unit trail</text>
  <text x="42" y="86" fill="#10201a" font-family="Arial, sans-serif" font-size="19">velocity = m s^-1</text>
  <text x="42" y="118" fill="#10201a" font-family="Arial, sans-serif" font-size="19">acceleration = m s^-2</text>
  <text x="42" y="150" fill="#10201a" font-family="Arial, sans-serif" font-size="19">force = kg m s^-2</text>
</svg>
