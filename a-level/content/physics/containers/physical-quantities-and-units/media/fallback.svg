<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Unit classification fallback">
  <rect width="320" height="180" fill="#fffdf7"/>
  <text x="28" y="44" fill="#13251e" font-family="Arial, sans-serif" font-size="22" font-weight="700">quantity = value × unit</text>
  <rect x="28" y="66" width="264" height="76" rx="14" fill="#f7f4ea" stroke="#d8d0bf"/>
  <text x="46" y="96" fill="#10201a" font-family="Arial, sans-serif" font-size="18">speed = distance ÷ time</text>
  <text x="46" y="124" fill="#1f5f8b" font-family="Arial, sans-serif" font-size="18" font-weight="700">m ÷ s = m s⁻¹</text>
</svg>
