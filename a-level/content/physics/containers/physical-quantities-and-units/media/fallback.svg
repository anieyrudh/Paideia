<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Physical quantities and units fallback</title>
  <desc id="desc">Static unit-balance reminder for the physical quantities container.</desc>
  <rect width="640" height="360" fill="#fffdf7"/>
  <rect x="52" y="50" width="536" height="260" rx="28" fill="#f7f4ea" stroke="#d8d0bf" stroke-width="4"/>
  <text x="92" y="112" fill="#10201a" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="900">Measurement = value + unit</text>
  <text x="92" y="164" fill="#1f5f8b" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">speed = distance / time</text>
  <text x="92" y="204" fill="#10201a" font-family="Inter,Arial,sans-serif" font-size="20">m / s = m s^-1</text>
  <text x="92" y="254" fill="#b42318" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">acceleration is not m s^-1</text>
</svg>
