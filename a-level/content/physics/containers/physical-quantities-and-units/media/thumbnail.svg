  <circle cx="548" cy="48" r="96" fill="#f0b429" opacity="0.22"/>
  <rect x="50" y="54" width="250" height="252" rx="24" fill="#10201a"/>
  <text x="82" y="104" fill="#f9f5e9" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">9.8 m s^-1</text>
  <text x="82" y="142" fill="#d8e4dc" font-family="Inter,Arial,sans-serif" font-size="16">claimed acceleration</text>
