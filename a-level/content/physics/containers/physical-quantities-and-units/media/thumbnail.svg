<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Impossible-equation detector thumbnail</title>
  <desc id="desc">A learner-facing card checks whether equation terms have matching dimensions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="32" fill="url(#bg)"/>
  <rect x="64" y="54" width="512" height="252" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="96" y="110" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Unit lie detector</text>
  <text x="96" y="158" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">s = ut + 1/2at</text>
  <g font-family="Inter, Arial, sans-serif" font-size="22">
    <rect x="96" y="190" width="154" height="64" rx="18" fill="#dbeafe"/>
    <text x="118" y="230" fill="#1e3a8a">left: L</text>
    <rect x="274" y="190" width="154" height="64" rx="18" fill="#dcfce7"/>
    <text x="296" y="230" fill="#166534">ut: L</text>
    <rect x="452" y="190" width="92" height="64" rx="18" fill="#fee2e2"/>
    <text x="475" y="230" fill="#991b1b">at: LT⁻¹</text>
  </g>
  <path d="M104 282h314" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="504" cy="282" r="26" fill="#ef4444"/>
  <path d="M493 282l8 8 16-20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
