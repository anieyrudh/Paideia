  <text x="382" y="179" fill="#10201a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">scalar or vector?</text>
  <text x="382" y="261" fill="#10201a" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">units balance?</text>
