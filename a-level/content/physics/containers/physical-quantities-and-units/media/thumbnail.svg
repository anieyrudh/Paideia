<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Unit Classification Lab thumbnail</title>
  <desc id="desc">A measurement card moving through base, derived, scalar, vector, and unit-balance shelves.</desc>
