<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Dimensional consistency checker thumbnail</title>
  <desc id="desc">A learner-facing equation checker compares SI base dimensions on both sides of a formula.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="640" height="360" rx="34" fill="url(#bg)"/>
  <rect x="54" y="54" width="532" height="252" rx="28" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
  <text x="88" y="105" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Unit Lab</text>
  <text x="88" y="154" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">distance = speed + time</text>
  <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">
    <rect x="88" y="190" width="118" height="54" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="124" y="225" fill="#1e3a8a">L</text>
    <rect x="244" y="190" width="118" height="54" rx="16" fill="#fff7ed" stroke="#fdba74"/>
    <text x="270" y="225" fill="#9a3412">L T⁻¹</text>
    <rect x="400" y="190" width="118" height="54" rx="16" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="446" y="225" fill="#991b1b">T</text>
  </g>
  <path d="M218 217h16m140 0h16" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="540" cy="217" r="23" fill="#dc2626"/>
  <path d="M530 207l20 20m0-20l-20 20" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="88" y="282" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Base dimensions reveal impossible equations.</text>
</svg>
