<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Dimensional consistency checker thumbnail</title>
  <desc id="desc">A polished unit-checking panel comparing physical dimensions on both sides of an equation.</desc>
  <rect width="640" height="360" rx="32" fill="#10201a"/>
  <circle cx="540" cy="58" r="110" fill="#f0b429" opacity="0.28"/>
  <rect x="54" y="48" width="532" height="264" rx="24" fill="#fffdf7"/>
  <text x="86" y="92" fill="#1f5f8b" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">Unit checker</text>
  <text x="86" y="144" fill="#10201a" font-family="SFMono-Regular,Consolas,monospace" font-size="42" font-weight="800">s = vt + 1/2 at</text>
  <rect x="86" y="176" width="190" height="54" rx="16" fill="#fff4cc" stroke="#f0b429"/>
  <text x="108" y="211" fill="#10201a" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800">left: L</text>
  <rect x="302" y="176" width="224" height="54" rx="16" fill="#fee4e2" stroke="#b42318"/>
  <text x="324" y="211" fill="#10201a" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800">at: L T⁻¹</text>
  <rect x="86" y="252" width="312" height="38" rx="19" fill="#b42318"/>
  <text x="108" y="278" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900">Units reject this equation</text>
</svg>
