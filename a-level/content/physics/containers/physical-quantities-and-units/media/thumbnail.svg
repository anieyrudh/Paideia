<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Impossible equation detector thumbnail</title>
  <desc id="desc">A unit detector compares equation cards using SI base dimensions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="32" fill="url(#bg)"/>
  <rect x="56" y="54" width="528" height="252" rx="26" fill="#ffffff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="88" y="104" fill="#0369a1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Unit detective lab</text>
  <rect x="88" y="132" width="230" height="72" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
  <text x="112" y="162" fill="#881337" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">distance</text>
  <text x="112" y="190" fill="#881337" font-family="Inter, Arial, sans-serif" font-size="20">speed + acceleration</text>
  <path d="M350 168h92" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <path d="M428 146l24 22-24 22" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="464" y="126" width="88" height="92" rx="18" fill="#0f172a"/>
  <text x="482" y="164" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">L T⁻¹</text>
  <text x="482" y="196" fill="#fecdd3" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">L T⁻²</text>
  <text x="96" y="258" fill="#14532d" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Reject equations whose units cannot match.</text>
</svg>
