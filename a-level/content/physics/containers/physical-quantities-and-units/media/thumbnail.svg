<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Measurement and uncertainty lab thumbnail</title>
  <desc id="desc">A trolley measurement bench with distance, time, unit, and uncertainty readouts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="640" height="360" rx="36" fill="url(#bg)"/>
  <rect x="54" y="54" width="532" height="252" rx="28" fill="#f8fafc" filter="url(#shadow)"/>
  <text x="86" y="102" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Measurement lab</text>
  <text x="86" y="132" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">value ± uncertainty, with the unit attached</text>
  <line x1="104" x2="508" y1="210" y2="210" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="104" x2="104" y1="178" y2="242" stroke="#64748b" stroke-width="5"/>
  <line x1="396" x2="396" y1="178" y2="242" stroke="#64748b" stroke-width="5"/>
  <rect x="376" y="172" width="40" height="76" rx="12" fill="#99f6e4" opacity="0.75"/>
  <rect x="356" y="166" width="72" height="38" rx="11" fill="#f97316"/>
  <circle cx="374" cy="210" r="9" fill="#1e293b"/>
  <circle cx="410" cy="210" r="9" fill="#1e293b"/>
  <text x="104" y="268" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">0.80 m ± 0.005 m</text>
  <rect x="430" y="80" width="112" height="64" rx="18" fill="#e0f2fe"/>
  <text x="448" y="107" fill="#075985" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">v = d / t</text>
  <text x="448" y="130" fill="#075985" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">m s⁻¹</text>
</svg>
