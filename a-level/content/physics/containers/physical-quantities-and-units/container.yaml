transfer_problems:
  - id: unit-consistency-check
    prompt: |
      A student writes a measured acceleration as 9.8 m s^-1. Decide whether the unit is dimensionally consistent with acceleration, correct it if needed, and explain which base units are involved.
    surface_form: "lab measurement note"
    same_concept_check: "The context changes from definitions to an experimental record, but the task is still to separate quantity, value, and unit before checking dimensions."
    rubric_path: problem-solving/unit-consistency-check.md
  - id: measurement-uncertainty-check
    prompt: |
      A student measures a trolley run as 1.20 m ± 0.01 m in 3.0 s ± 0.2 s. Find the average speed with its unit and uncertainty, then explain why distance + time is not a valid shortcut.
    surface_form: "stopwatch and metre-rule practical record"
    same_concept_check: "The task adds uncertainty, but learners still have to keep quantity, value, unit, and dimension attached throughout the calculation."
    rubric_path: problem-solving/measurement-uncertainty-check.md
