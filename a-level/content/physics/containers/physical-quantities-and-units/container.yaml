misconceptions:
  - name: "Unit as decoration"
    description: |
      Learners treat the unit as text appended after calculation rather than as part of the physical quantity that constrains valid operations.
    evidence_source: "Singapore-Cambridge H2 Physics 9478 syllabus, Section I; OpenStax University Physics Volume 1, Section 1.3."
    surface_in_predict: false
  - name: "Quantity equals number"
    description: |
      Learners may record only the numerical value and lose the measured quantity's unit, dimension, or uncertainty context.
    evidence_source: "OpenStax University Physics Volume 1, Section 1.3 Units and Standards."
    surface_in_predict: false
  - name: "Uncertainty ignored because the calculator gives many digits"
    description: |
      Learners may quote every calculator digit from a derived value while ignoring the spread and resolution of the original measurements.
    evidence_source: "Singapore-Cambridge H2 Physics 9478 syllabus, Section I; OpenStax University Physics Volume 1, Section 1.4 Unit Conversion."
    surface_in_predict: true
