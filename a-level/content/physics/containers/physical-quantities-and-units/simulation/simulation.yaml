id: measurement-uncertainty-lab
title: "Measurement and Uncertainty Lab"
interaction_type: other
kernel_deps:
  - core/prediction-gate
  - core/ui-sim
predict:
  prompt: |
    Two students measure the same card as 12.4 cm and 12.8 cm using a ruler with 0.1 cm divisions. Before the lab reveals the calculation, which source should set the uncertainty for the reported length?
  commit_format:
    kind: multiple-choice
    options:
      - "The reading spread between students"
      - "The unit name written after the number"
      - "Whether length is a scalar or vector"
      - "The number of letters in centimetre"
    correct_index: 0
  rationale_required: true
manipulate:
  controls:
    - id: first-reading
      label: "Reading 1"
      kind: slider
      kernel_binding: "measurement.length"
      bounds:
        min: 10
        max: 52
        step: 0.1
    - id: second-reading
      label: "Reading 2"
      kind: slider
      kernel_binding: "measurement.length"
      bounds:
        min: 10
        max: 52
        step: 0.1
    - id: ruler-division
      label: "Smallest ruler division"
      kind: slider
      kernel_binding: "measurement.resolution"
      bounds:
        min: 0.1
        max: 0.5
        step: 0.1
    - id: travel-time
      label: "Travel time"
      kind: slider
      kernel_binding: "measurement.time"
      bounds:
        min: 1
        max: 8
        step: 0.1
observe:
  renderers:
    - id: measurement-uncertainty-lab
      module: "@paideia/a-level-physics-sims/measurement-uncertainty"
      symbol: "MeasurementUncertaintyLab"
      props_binding: "state -> repeated measurement, uncertainty, and unit reasoning readout"
explain:
  prompt: "Explain why a unit can reject an equation before you substitute numbers."
  socratic: true
  expected_misconceptions_surfaced:
    - "Unit as decoration"
    - "Quantity equals number"
    - "Uncertainty ignored because the calculator gives many digits"
