id: impossible-equation-detector
title: "Impossible Equation Detector"
interaction_type: decision-matrix
kernel_deps:
  - core/content-schema
  - core/prediction-gate
  - core/ui-sim

predict:
  prompt: |
    Four equations look familiar. Before seeing the unit check, which one must be impossible because its units do not match?
  commit_format:
    kind: multiple-choice
    options:
      - "v = u + at"
      - "s = ut + 1/2 at^2"
      - "v = u + 1/2 at^2"
      - "F = ma"
    correct_index: 2
  rationale_required: true

manipulate:
  controls:
    - id: equation
      label: "Equation to audit"
      kind: selector
      kernel_binding: state.equation

observe:
  renderers:
    - id: impossible-equation-detector
      module: "@paideia/a-level-physics-sims/impossible-equation-detector"
      symbol: ImpossibleEquationDetectorSim
      props_binding: |
        Compare each term in the selected equation by expanding units into M, L, and T dimensions.

explain:
  prompt: |
    Why can a unit mismatch rule out an equation even before any numbers are substituted?
  socratic: true
  expected_misconceptions_surfaced:
    - "Unit as decoration"
    - "Adding unlike quantities"
    - "Dimensionally possible means proven"
