id: inverse-square-field-lab
title: "Inverse-Square Field Lab"
interaction_type: function-plot-with-draggable
kernel_deps:
  - core/sim-runtime
  - core/content-schema
  - core/mechanics
  - core/plotting
  - core/prediction-gate
  - core/shared
  - core/ui-sim
predict:
  prompt: |
    A probe moves from 1 Earth radius to 2 Earth radii from Earth's centre. Before revealing the lab, what happens to the gravitational field strength?
  commit_format:
    kind: multiple-choice
    options:
      - "It halves."
      - "It becomes one quarter as large."
      - "It stays constant."
      - "It becomes negative because gravity points inward."
    correct_index: 1
  rationale_required: true
manipulate:
  controls:
    - id: source-mass
      label: "Source mass"
      kind: slider
      kernel_binding: state.sourceMassEarthMasses
      bounds: { min: 0.5, max: 8, step: 0.5 }
    - id: radius
      label: "Field point radius"
      kind: slider
      kernel_binding: state.radiusEarthRadii
      bounds: { min: 1, max: 8, step: 0.25 }
    - id: test-mass
      label: "Probe mass"
      kind: slider
      kernel_binding: state.testMassKilograms
      bounds: { min: 100, max: 5000, step: 100 }
    - id: comparison-radius
      label: "Comparison radius"
      kind: slider
      kernel_binding: state.comparisonRadiusEarthRadii
      bounds: { min: 1, max: 8, step: 0.25 }
observe:
  renderers:
    - id: inverse-square-field-lab
      module: "@paideia/a-level-physics-sims/gravitational-fields"
      symbol: "GravitationalFieldsSim"
      props_binding: "source mass, radius, and probe mass -> field vector visual, potential curve, formula substitutions, readout, and interpretation"
explain:
  prompt: "Which quantity changed most strongly when the radius changed, and how do you know from the formula and visual field?"
  socratic: true
  expected_misconceptions_surfaced:
    - "Field strength is constant near every mass"
    - "Potential energy must be positive"
    - "A heavier probe changes the field strength at a point"
