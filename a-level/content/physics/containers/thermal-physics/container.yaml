      A weather balloon contains a fixed amount of gas. It rises into colder air where the outside pressure is lower. Explain why the balloon volume changes, and calculate the new volume for a simplified case using pV = nRT.
    surface_form: "weather balloon cooling comparison"
    same_concept_check: "Same concept: gas-law variables must use thermodynamic temperature, and changing temperature or pressure changes the volume for a fixed amount of gas."
