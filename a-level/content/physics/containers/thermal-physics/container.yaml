misconceptions:
  - name: "Temperature is the same as thermal energy"
    description: "Learners may treat a temperature reading as the amount of thermal energy in a body, ignoring mass, material heat capacity, and temperature change."
    evidence_source: "OpenStax University Physics Volume 2, Section 1.1 Temperature and Thermal Equilibrium."
    surface_in_predict: false
  - name: "Celsius can be substituted directly into gas laws"
    description: "Learners may place a Celsius reading into pV = nRT instead of converting to kelvin, producing pressures that are far too small near room temperature."
    evidence_source: "Singapore-Cambridge H2 Physics 9478 syllabus, Thermal Physics learning outcomes."
    surface_in_predict: true
  - name: "Increasing volume always increases gas pressure"
    description: "Learners may reason from everyday compression language without holding amount and thermodynamic temperature fixed; the gas-law relationship at fixed n and T is inverse."
    evidence_source: "OpenStax University Physics Volume 2, Section 2.2 Pressure, Temperature, and RMS Speed."
    surface_in_predict: false
