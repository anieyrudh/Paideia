<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Hypothesis testing decision scale</title>
  <desc id="desc">A z-axis with null mean, observed sample mean, and critical boundary markers.</desc>
  <rect width="640" height="360" fill="#f8fafc"/>
  <rect x="56" y="52" width="528" height="256" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="104" x2="536" y1="216" y2="216" stroke="#334155" stroke-width="4"/>
  <line x1="320" x2="320" y1="96" y2="242" stroke="#fb923c" stroke-width="5"/>
  <line x1="440" x2="440" y1="118" y2="242" stroke="#60a5fa" stroke-width="5"/>
  <line x1="404" x2="404" y1="140" y2="242" stroke="#ef4444" stroke-width="5" stroke-dasharray="10 8"/>
  <path d="M106 216 C190 88 450 88 534 216" fill="none" stroke="#34d399" stroke-width="6"/>
  <text x="320" y="76" fill="#334155" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">H0 mean</text>
  <text x="440" y="104" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">observed z</text>
  <text x="404" y="272" fill="#b91c1c" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">critical region</text>
</svg>
