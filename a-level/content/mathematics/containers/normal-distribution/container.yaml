package_predict:
  prompt: |
    A score is modelled as normal with mean 100 and standard deviation 12. Before comparing with the lab, predict whether the central interval 88 to 112 marks or the upper tail above 124 marks has the larger probability.
  commit_format:
    kind: multiple-choice
    options:
      - "The central interval from 88 to 112 marks is larger."
      - "The upper tail above 124 marks is larger."
      - "Both regions are equal because the normal curve is symmetric."
      - "The z-score itself is the probability area."
    correct_index: 0
  rationale_required: true
