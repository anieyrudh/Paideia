misconceptions:
  - name: "z-score is a probability"
    description: "Learners may treat a z-score such as 1.5 as a probability, instead of recognising it as a location on the standard normal scale whose area must be looked up or computed."
    evidence_source: "Singapore-Cambridge H2 Mathematics 9758 syllabus, Normal distribution; OpenStax Introductory Statistics, Chapter 6 The Normal Distribution."
    surface_in_predict: true
  - name: "symmetric distributions make every interval equally likely"
    description: "Learners may overgeneralise symmetry, assuming any two intervals or tails are equal without checking their z-distance and width."
    evidence_source: "OpenStax Introductory Statistics, Chapter 6 The Normal Distribution."
    surface_in_predict: true
  - name: "standard deviation has no unit"
    description: "Learners may detach sigma from the raw measurement unit, then divide unlike quantities or interpret z as still being measured in marks."
    evidence_source: "Singapore-Cambridge H2 Mathematics 9758 syllabus, Probability and Statistics; OpenStax Introductory Statistics, Descriptive statistics and normal distribution chapters."
    surface_in_predict: false
