misconceptions:
  - name: "confidence interval gives the probability the fixed parameter is inside"
    description: "Learners may say there is a 95% probability that the population mean is inside the computed interval, instead of recognising that the interval is fixed after sampling and the confidence statement belongs to the repeated-sampling method."
    evidence_source: "Singapore-Cambridge H2 Mathematics 9758 syllabus, Confidence intervals; OpenStax Introductory Statistics, Confidence Intervals."
    surface_in_predict: true
  - name: "wider intervals mean worse data in every context"
    description: "Learners may treat a wider interval as automatically worse, without separating confidence level, sample size, population variability, and the decision cost of under-covering the true mean."
    evidence_source: "OpenStax Introductory Statistics, Chapter 8 Confidence Intervals."
    surface_in_predict: true
  - name: "margin of error ignores units"
    description: "Learners may calculate z-star times standard error but report a unitless margin, losing that the interval endpoints are measured in the same units as the sample mean."
    evidence_source: "Singapore-Cambridge H2 Mathematics 9758 syllabus, Confidence intervals."
    surface_in_predict: false
