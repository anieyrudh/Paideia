transfer_problems:
  - id: vaccine-response-mean
    prompt: |
      A clinic measures antibody response scores after a booster. A sample of 64 patients has mean 72.4 units. The population standard deviation is known to be 11.2 units. Construct a 95% confidence interval for the population mean response, then decide whether a claimed mean of 70 units is compatible with the interval.
    surface_form: "clinic antibody response estimate"
    same_concept_check: "Same concept: compute the standard error for a sample mean, choose the two-sided confidence multiplier, form xbar +/- z*SE, and interpret whether a fixed claimed mean lies inside the interval."
    rubric_path: problem-solving/vaccine-response-mean.md
