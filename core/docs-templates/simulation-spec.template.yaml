# SimulationSpec · template
# Validates against SimulationSpec in core/content-schema.
# The scaffolder fills <PLACEHOLDERS>; author replaces with real values.

id: <sim-id>                              # kebab-case, matches sims/<sim-id>/ directory name
title: "<Sim Title>"
interaction_type: function-plot-with-draggable
# Choices:
# function-plot-with-draggable | 3D-spatial-manipulation | particle-simulation
# force-directed-graph | argument-tree | text-corpus-analysis | mind-map-editor
# code-execution-notebook | diagram-builder | animation-playback | decision-matrix
# source-annotation | timeline-builder | map-with-data-layers
# algorithm-state-visualisation | comparative-matrix | systems-flow-diagram
# sketch-input | other

kernel_deps:
  - core/sim-runtime
  - core/prediction-gate
  - core/<kernel>                          # e.g., core/numerical-math, core/plotting
  - core/<renderer>                        # e.g., core/three-scene, core/charting

# Per-sim predict — used only when concept-package.yaml predict_at === "per-sim" or "both"
# Omit otherwise.
# predict:
#   prompt: |
#     <Per-sim predict prompt>
#   commit_format:
#     kind: value
#     unit: seconds
#   rationale_required: true

manipulate:
  controls:
    - id: <control-id>
      label: "<Human label>"
      kind: slider                          # slider | stepper | toggle | selector | drag-point | drag-vector | text-input | code-editor
      kernel_binding: state.<field>         # which kernel field this control writes
      bounds: { min: 0, max: 100, step: 1 }

observe:
  renderers:
    - id: <renderer-id>
      module: core/plotting                 # which core/ module provides the renderer
      symbol: FunctionPlot                  # which exported symbol from that module
      props_binding: |
        <How kernel state maps to renderer props — one-line description>

explain:
  prompt: |
    <Socratic explain prompt — asks rather than tells>
  socratic: true
  expected_misconceptions_surfaced:
    - "<Misconception name from misconceptions.md>"
