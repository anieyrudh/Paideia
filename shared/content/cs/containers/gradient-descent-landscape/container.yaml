misconceptions:
  - name: "Bigger learning rate is always faster"
    description: "Learners may treat a larger step size as guaranteed speed-up, missing overshoot and divergence on steep ravines."
    evidence_source: "Goodfellow, Bengio, and Courville, Deep Learning, Chapter 8 optimization for training deep models."
    surface_in_predict: true
  - name: "Local slope reveals the global minimum"
    description: "Learners may assume a local gradient points directly to the best global solution, ignoring saddles, non-convexity, and domain limits."
    evidence_source: "Boyd and Vandenberghe, Convex Optimization, Section 9.3 descent methods."
    surface_in_predict: false
sources:
