transfer_problems:
  - id: tune-learning-rate-ravine
    prompt: |
      A student is tuning gradient descent for a one-parameter calibration model. The first update at theta = 4 has gradient 12 loss units per parameter unit. Compare eta = 0.04 and eta = 0.22, then justify which update is safer before running a longer training pass.
    surface_form: "one-parameter calibration learning-rate choice"
    same_concept_check: "Learners still use the gradient update rule, compare step stability, and interpret whether the learning rate turns local slope into a sensible update."
    rubric_path: problem-solving/tune-learning-rate-ravine.md
