<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Graph algorithm fallback</title>
  <desc id="desc">Static graph traversal diagram with frontier and visited labels.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="44" y="44" width="552" height="272" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="96" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Graph algorithm trace</text>
  <text x="76" y="132" fill="#475569" font-family="Arial, sans-serif" font-size="18">Frontier -> visited set -> predecessor links -> path cost</text>
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="130" y1="228" x2="250" y2="180"/>
    <line x1="250" y1="180" x2="380" y2="226"/>
    <line x1="250" y1="180" x2="390" y2="138"/>
    <line x1="390" y1="138" x2="506" y2="194"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="130" cy="228" r="28" fill="#2563eb"/>
    <text x="130" y="234" fill="#fff">start</text>
    <circle cx="250" cy="180" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="250" y="186" fill="#0f172a">front</text>
    <circle cx="380" cy="226" r="28" fill="#e2e8f0"/>
    <text x="380" y="232" fill="#0f172a">wait</text>
    <circle cx="390" cy="138" r="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="390" y="144" fill="#0f172a">visit</text>
    <circle cx="506" cy="194" r="28" fill="#dcfce7" stroke="#059669" stroke-width="3"/>
    <text x="506" y="200" fill="#0f172a">goal</text>
  </g>
</svg>
