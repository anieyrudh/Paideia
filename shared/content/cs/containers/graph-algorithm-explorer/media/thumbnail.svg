<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Graph Algorithm Explorer thumbnail</title>
  <desc id="desc">A labelled graph with a highlighted frontier and weighted path.</desc>
