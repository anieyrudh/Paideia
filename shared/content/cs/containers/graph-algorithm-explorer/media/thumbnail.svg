  <g stroke="#cbd5e1" stroke-width="4">
    <line x1="130" y1="180" x2="260" y2="90"/>
    <line x1="130" y1="180" x2="270" y2="250"/>
    <line x1="260" y1="90" x2="430" y2="125"/>
    <line x1="270" y1="250" x2="430" y2="125"/>
    <line x1="430" y1="125" x2="520" y2="220"/>
  </g>
  <path d="M130 180 L270 250 L430 125 L520 220" fill="none" stroke="#7c3aed" stroke-linecap="round" stroke-width="8"/>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="130" cy="180" r="34" fill="#2563eb"/>
