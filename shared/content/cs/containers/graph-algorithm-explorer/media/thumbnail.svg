  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="185" y="118">8</text>
    <text x="184" y="235">2</text>
    <text x="348" y="92">2</text>
    <text x="350" y="210">2</text>
    <text x="490" y="160">2</text>
  </g>
</svg>
