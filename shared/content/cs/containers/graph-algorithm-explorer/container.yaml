misconceptions:
  - name: "Visual distance equals edge weight"
    description: "Learners may read a node-link drawing as if short screen distance means cheap travel cost, even when edge weights encode the real objective."
    evidence_source: "Cormen, Leiserson, Rivest, and Stein, Introduction to Algorithms, graph algorithms chapters."
    surface_in_predict: true
  - name: "Visited order is unique for every graph"
    description: "Learners may assume BFS or DFS has one universal visited order, missing that adjacency order and tie-breaking are part of the algorithm contract."
    evidence_source: "Skiena, The Algorithm Design Manual, graph traversal discussion."
    surface_in_predict: true
