transfer_problems:
  - id: route-planning-shortest-path
    prompt: |
      A delivery map has five intersections. The route with the fewest road segments is not the route with the lowest travel time. Choose whether to model the task with BFS, DFS, or Dijkstra, then justify the invariant you will inspect before trusting the answer.
    surface_form: "delivery route planning with road travel-time weights"
    same_concept_check: "Learners still distinguish graph representation from layout, inspect frontier or visited-set evidence, and choose the algorithm whose invariant matches the requested objective."
