controls:
  - id: supply-voltage
    label: "Supply voltage"
    kind: slider
    kernel_binding: state.sourceVoltageRmsVolts
    default: 12
    min: 2
    max: 24
    step: 1
  - id: frequency
    label: "Frequency"
    kind: slider
    kernel_binding: state.frequencyHertz
    default: 50
    min: 10
    max: 200
    step: 5
  - id: resistance
    label: "Resistance"
    kind: slider
    kernel_binding: state.resistanceOhms
    default: 40
    min: 5
    max: 120
    step: 5
  - id: inductance
    label: "Inductance"
    kind: slider
    kernel_binding: state.inductanceMilliHenrys
    default: 180
    min: 10
    max: 500
    step: 10
  - id: capacitance
    label: "Capacitance"
    kind: slider
    kernel_binding: state.capacitanceMicroFarads
    default: 120
    min: 10
    max: 500
    step: 10
