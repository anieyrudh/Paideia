misconceptions:
  - name: "High gain always improves control"
    description: |
      Learners may focus on faster response and miss that higher crossover frequency often comes with more phase lag and less robustness.
    evidence_source: "Astrom and Murray feedback systems PID and loop-shaping chapters."
    surface_in_predict: true
  - name: "Bode magnitude alone determines stability"
    description: |
      Learners may read only the 0 dB crossing and ignore the phase left before the loop reaches -180 degrees.
    evidence_source: "Astrom and Murray feedback systems frequency-response stability margins."
    surface_in_predict: true
  - name: "Derivative gain removes steady-state error"
    description: |
      Learners may attribute integral-action behaviour to derivative gain instead of seeing derivative as damping and phase-shaping.
    evidence_source: "Nise control systems PID controller discussion."
    surface_in_predict: true
