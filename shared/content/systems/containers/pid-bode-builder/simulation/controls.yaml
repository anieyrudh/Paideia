controls:
  - id: proportional-gain
    label: "Proportional gain Kp"
    kind: slider
    kernel_binding: state.kp
    default: 1.4
    min: 0.2
    max: 5
    step: 0.1
  - id: integral-gain
    label: "Integral gain Ki"
    kind: slider
    kernel_binding: state.ki
    default: 0.7
    min: 0
    max: 2.5
    step: 0.05
  - id: derivative-gain
    label: "Derivative gain Kd"
    kind: slider
    kernel_binding: state.kd
    default: 0.18
    min: 0
    max: 1
    step: 0.02
  - id: natural-frequency
    label: "Plant natural frequency"
    kind: slider
    kernel_binding: state.naturalFrequencyRadPerSec
    default: 2.5
    min: 1
    max: 6
    step: 0.1
  - id: damping-ratio
    label: "Plant damping ratio"
    kind: slider
    kernel_binding: state.dampingRatio
    default: 0.45
    min: 0.15
    max: 1.2
    step: 0.05
