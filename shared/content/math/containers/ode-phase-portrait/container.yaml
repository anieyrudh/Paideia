  sim_worthy: true
  interactive_simulation: true
  notebook_lab: false
  visual_derivation: true
simulation:
  spec: simulation/simulation.yaml
  controls: simulation/controls.yaml
  presets: simulation/presets.yaml
  state_labels: simulation/state-labels.yaml
  runtime: simulation/runtime.yaml
problem_solving:
  algorithm: problem-solving/algorithm.md
  steps: problem-solving/steps.yaml
embed_api:
  entry: embed/index.ts
  api: embed/api.ts
  methods: [load, saveState, score, resume, syncTheme, destroy]
concept_map:
  spec: concept-map/concept-map.yaml
  mindmap: concept-map/mindmap.md
  mermaid: concept-map/graph.mmd
transfer_problems:
  - id: reactor-stability-check
    prompt: |
      A simplified reactor model linearises near an operating point to x' = y and y' = -0.8x + 0.4y. Classify the operating point, predict whether a small perturbation settles or grows, and name one parameter change that would reverse the stability.
    surface_form: "reactor operating-point stability"
    same_concept_check: "The context changes to a reactor, but the task is still trace-determinant classification of a planar linear ODE near an equilibrium."
    rubric_path: problem-solving/reactor-stability-check.md
