schema_version: "1.0.0"
id: ode-phase-portrait
aliases:
  - phase plane
  - planar ode stability
  - linear stability portrait
branch: shared
subject: math
level: "Shared core"
module: "Dynamical systems"
title: "ODE Phase Portrait Lab"
one_line_summary: "Classify a two-variable linear ODE by trace, determinant, and discriminant, then test how nearby trajectories move in the phase plane."
syllabus_ref: "Shared mathematics / Dynamical systems / Phase portraits"
prerequisites:
  - derivatives
  - vector-fields
  - linear-algebra
aid_types:
  - simulation
  - transfer-problem
  - misconception-audit
predict_at: package-level
package_predict:
  prompt: |
    For x' = y and y' = -1.2x - 0.6y, what should a nearby trajectory do after it is released?
  commit_format:
    kind: multiple-choice
    options:
      - "Spiral inward toward the equilibrium"
      - "Move directly away from the equilibrium"
      - "Cross the equilibrium and stop there"
  rationale_required: true
components:
  concept_card: concept-card.md
  concept_map: concept-map/concept-map.yaml
  mindmap: concept-map/mindmap.md
  mermaid: concept-map/graph.mmd
  media: media
  simulation: simulation
  embed: embed
  problem_solving: problem-solving
  sources: sources.md
