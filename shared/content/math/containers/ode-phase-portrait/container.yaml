misconceptions:
  - name: "Equilibrium means nothing changes anywhere"
    description: "Learners may think an equilibrium freezes the whole field, rather than only the state exactly at the equilibrium point."
    evidence_source: "Strogatz, Nonlinear Dynamics and Chaos, phase-plane chapters."
    surface_in_predict: true
  - name: "Arrows show only physical velocity"
    description: "Learners may read the phase-plane arrows as literal motion in space instead of rates of change for abstract state variables."
    evidence_source: "Hirsch, Smale, and Devaney, Differential Equations, Dynamical Systems, and an Introduction to Chaos."
    surface_in_predict: true
