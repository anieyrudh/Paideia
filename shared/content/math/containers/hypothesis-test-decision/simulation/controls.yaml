controls:
  - id: observed-mean
    label: "Observed sample mean"
    kind: slider
    unit: "units"
    min: 46
    max: 55
    step: 0.1
    default: 51.3
    color: "#1f5f8b"
  - id: sample-size
    label: "Sample size"
    kind: stepper
    unit: "observations"
    min: 9
    max: 100
    step: 1
    default: 36
    color: "#027a48"
  - id: alpha
    label: "Significance level"
    kind: selector
    default: 0.05
    options:
      - label: "10%"
        value: 0.1
      - label: "5%"
        value: 0.05
      - label: "1%"
        value: 0.01
    color: "#b54708"
  - id: alternative
    label: "Alternative hypothesis"
    kind: selector
    default: greater
    options:
      - label: "Mean is greater than 50"
        value: greater
      - label: "Mean is less than 50"
        value: less
      - label: "Mean is different from 50"
        value: two-sided
    color: "#6941c6"
