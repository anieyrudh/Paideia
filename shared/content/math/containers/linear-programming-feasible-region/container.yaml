misconceptions:
  - name: "The optimum must sit at the visual centre"
    description: "Learners may choose a visually balanced interior point even though a linear objective over a bounded polygon reaches its maximum or minimum on the boundary."
    evidence_source: "Boyd and Vandenberghe, Convex Optimization, linear programming geometry discussion."
    surface_in_predict: true
  - name: "Infeasible means no equation exists"
    description: "Learners may treat infeasibility as an algebraic failure instead of recognising that the requested point or system violates at least one inequality."
    evidence_source: "Operations research textbook treatments of feasible sets and constraint systems."
    surface_in_predict: true
  - name: "One satisfied inequality proves feasibility"
    description: "Learners may test one constraint at a point and stop, missing that feasibility requires satisfying every constraint simultaneously."
    evidence_source: "Introductory linear programming examples in OpenStax College Algebra and operations research texts."
    surface_in_predict: true
sources:
