    prompt: |
      A small workshop makes two products. Product x uses 1 assembly hour and 2 labour hours per batch. Product y uses 1 assembly hour and 1 labour hour per batch. The workshop has at most 12 assembly hours and 16 labour hours, and profit is Z = 4x + 3y. Find the feasible corners, evaluate the objective, and justify the optimum.
    surface_form: "production-mix planning"
    same_concept_check: "Same concept: translate resource limits into half-planes, intersect them into a feasible polygon, and evaluate a linear objective at the feasible corners."
