<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 640 360">
  <title id="title">Static LP feasible region</title>
  <desc id="desc">A static fallback diagram showing constraints, feasible region, and the optimal corner.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <line x1="80" y1="300" x2="560" y2="300" stroke="#0f172a" stroke-width="3"/>
  <line x1="80" y1="300" x2="80" y2="40" stroke="#0f172a" stroke-width="3"/>
  <path d="M80 120L440 300" stroke="#2563eb" stroke-width="4"/>
  <path d="M80 20L500 300" stroke="#7c3aed" stroke-width="4"/>
  <path d="M260 40L520 300" stroke="#059669" stroke-width="4"/>
  <polygon points="80,300 80,120 240,60 400,180 480,300" fill="#bfdbfe" opacity="0.72" stroke="#2563eb" stroke-width="5"/>
  <path d="M120 280L520 80" stroke="#d97706" stroke-dasharray="12 8" stroke-width="7"/>
  <circle cx="400" cy="180" r="14" fill="#d97706" stroke="#ffffff" stroke-width="5"/>
  <text x="410" y="174" fill="#0f172a" font-family="Arial, sans-serif" font-size="20">optimum</text>
  <text x="95" y="95" fill="#2563eb" font-family="Arial, sans-serif" font-size="18">x + y <= d1</text>
  <text x="290" y="92" fill="#7c3aed" font-family="Arial, sans-serif" font-size="18">2x + y <= d2</text>
  <text x="330" y="260" fill="#059669" font-family="Arial, sans-serif" font-size="18">x + 3y <= d3</text>
</svg>
