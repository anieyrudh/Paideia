misconceptions:
  - name: "Sample distribution equals population distribution"
    description: "Learners may expect the histogram of sample means to keep the same skew and spread as the original observations."
    evidence_source: "OpenStax Introductory Statistics 2e, Section 7.1."
    surface_in_predict: true
  - name: "Larger samples change the population"
    description: "Learners may think increasing sample size reshapes the original population instead of reshaping the distribution of repeated sample means."
    evidence_source: "OpenStax Introductory Statistics 2e, Section 7.1."
    surface_in_predict: true
