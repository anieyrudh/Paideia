transfer_problems:
  - id: delivery-time-sampling
    prompt: |
      A delivery platform has right-skewed trip times because a few trips are very delayed. You inspect many samples of 36 trips and average each sample. Use the central limit theorem to predict the centre, standard error, and whether a normal approximation for those sample means is reasonable.
    surface_form: "delivery-time sampling"
    same_concept_check: "Same concept: averages from repeated independent samples form a sampling distribution centred at the population mean with standard error sigma/sqrt(n)."
    rubric_path: problem-solving/delivery-time-sampling.md
