branch: shared
subject: math
level: "Shared core"
module: "Probability and Statistics"
title: "Central Limit Theorem Sampler"
one_line_summary: "Repeated sample means become more stable and more bell-shaped as sample size grows."
syllabus_ref: "Shared probability and statistics / Sampling distributions"
prerequisites:
  - random-variables
  - mean-and-variance
aid_types:
